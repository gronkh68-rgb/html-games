<script>

// ---------- Kartenelemente ----------
function costHtml(c) { let s = ''; for (let i = 0; i < (c.cost.b || 0); i++) s += '🩸'; if (c.cost.o) s += (s ? '<br>' : '') + '🦴' + (c.cost.o > 1 ? '×' + c.cost.o : ''); return s; }
function cardEl(c, cls) {
  const d = document.createElement('div'); d.className = 'card ' + (cls || '') + (c.sub ? ' sub' : ''); d.dataset.uid = c.uid;
  d.innerHTML = '<div class="nm">' + c.n + '</div><div class="cost">' + costHtml(c) + '</div><div class="art">' + c.art + '</div><div class="atk">' + c.atk + '</div><div class="hp' + (c.hp < c.max ? ' dmg' : '') + '">' + c.hp + '</div><div class="sg">' + c.sig.map(s => HD.SIG[s][1]).join('') + (c.lives > 1 ? '×' + c.lives : '') + '</div>';
  return d;
}
const deckCard = x => HD.make(x);
function chooser(title, text, cards, opts) {      // Auswahl-Fenster: cards = [{x, label}] -> Promise<Index|-1>
  return new Promise(res => {

    cards.forEach((x, i) => { const c = deckCard(x), e = cardEl(c, 'ok'); e.onclick = () => { $('pk').classList.remove('show'); res(i); }; e.onmouseenter = () => info(c); C.appendChild(e); });
    (opts || []).forEach(o => { const b = document.createElement('button'); b.className = 'btn' + (o.alt ? ' alt' : ''); b.textContent = o.t; b.onclick = () => { $('pk').classList.remove('show'); res(o.v); }; O.appendChild(b); });

// ---------- Menü ----------
function paintMenu() {
  $('kT').textContent = T('Kampagne', 'Campaign');
  $('kP').innerHTML = T('Zieh durch drei Gebiete mit je zwei Kämpfen, einem Lagerfeuer und einem <b>Boss</b>. Nach jedem Sieg wählst du eine neue Karte. Du hast <b>zwei Kerzen</b> (im schweren Modus nur eine): Jede Niederlage löscht eine. Bosse haben eigene Regeln und brauchen <b>7</b> Punkte Vorsprung. Dein Fortschritt wird im Browser gespeichert.', 'Travel through three regions with two fights, a campfire and a <b>boss</b> each. After every win you pick a new card. You have <b>two candles</b> (one in hard mode): every defeat snuffs one. Bosses have special rules and need a <b>7</b> point lead. Your progress is saved in your browser.');
  const sv = store.get(KEY), B = $('kBtns'); B.innerHTML = '';
  const mk = (t, f, alt) => { const b = document.createElement('button'); b.className = 'btn' + (alt ? ' alt' : ''); b.textContent = t; b.onclick = f; B.appendChild(b); };
  if (sv) mk('▶ ' + T('Kampagne fortsetzen', 'Continue') + ' (' + AREAS[sv.a].icon + ' ' + AREAS[sv.a].n + ')', () => { camp = sv; showCamp(); });
  const fresh = hard => () => { if (sv && !confirm(T('Gespeicherte Kampagne überschreiben?', 'Overwrite saved campaign?'))) return; camp = newCamp(hard); offerDeath().then(() => { store.set(KEY, camp); showCamp(); }); };
  mk(sv ? T('Neue Kampagne', 'New campaign') : '▶ ' + T('Kampagne starten', 'Start campaign'), fresh(false), !!sv);
  mk('💀 ' + T('Schwer: 1 Kerze, stärkere Gegner', 'Hard: 1 candle, tougher enemies'), fresh(true), true);
  $('oT').textContent = T('Mehrspieler', 'Multiplayer'); $('oP').textContent = T('Duell gegen einen anderen Spieler online oder gegen den Computer, mit eigenem Deck, Wiederbeitritt und Zuschauern.', 'Duel another player online or the computer, with your own deck, rejoin and spectators.'); $('oBtn').textContent = '🌐 ' + T('Duell spielen', 'Play a duel');
  $('mT').textContent = T('Freies Duell', 'Free duel');
  $('rules').innerHTML = T(
    '<b>So geht es:</b> Du und der Gegner habt je vier Bahnen. Karten kosten <b>Opfer 🩸</b> (eigene Karten vom Feld) oder <b>Knochen 🦴</b> (entstehen, wenn Karten sterben). Jede Runde ziehst du eine Karte aus dem <b>Wald</b> oder ein <b>Eichhörnchen</b>. Mit der <b>Klingel 🔔</b> greifen alle deine Karten an: Gegenüber trifft eine Karte, sonst geht der Schaden auf die <b>Waage</b>. Wer die Waage <b>5 Punkte</b> auf seine Seite bringt, gewinnt. Die Karten des Gegners warten erst in der Reihe dahinter.',
    '<b>How it works:</b> You and your opponent each have four lanes. Cards cost <b>sacrifices 🩸</b> (your own cards on the field) or <b>bones 🦴</b> (created when cards die). Each turn you draw one card from the <b>forest</b> or a <b>squirrel</b>. The <b>bell 🔔</b> makes all your cards attack: the card opposite is hit, otherwise the damage goes to the <b>scale</b>. Tip the scale <b>5 points</b> your way to win. Enemy cards wait in the row behind first.');
  $('ogrid').innerHTML = OPP.map(o => '<button class="opp" style="--c:' + o.c + '" data-o="' + o.id + '"><b>' + o.icon + ' ' + o.n + '</b><small>' + o.t + '</small></button>').join('');
}
function paintBook() {
  $('cbT').textContent = T('Kartenbuch', 'Card book');
  $('cbP').innerHTML = T('Alle Karten und Fähigkeiten im Spiel. Fähigkeiten: ', 'All cards and abilities in the game. Abilities: ') + Object.keys(HD.SIG).map(k => HD.SIG[k][1] + ' <b>' + HD.SIG[k][0] + '</b> (' + HD.SIG[k][2] + ')').join(' · ') + '<br><br><b>' + T('Boss-Regeln', 'Boss rules') + ':</b> ' + Object.keys(HD.BOSS).map(k => '<b>' + HD.BOSS[k][0] + '</b> (' + HD.BOSS[k][1] + ')').join(' · ');
  $('cbook').innerHTML = '';
  Object.keys(HD.CARDS).forEach(id => { if (HD.TOKENS[id] && id !== 'squirrel') return; const c = HD.make(id), cell = document.createElement('div'); cell.className = 'cell'; cell.appendChild(cardEl(c)); $('cbook').appendChild(cell); });

$('ogrid').addEventListener('click', e => { const b = e.target.closest('[data-o]'); if (b) { fightNode = null; startDuel(OPP.find(o => o.id === b.dataset.o), STARTER.map(id => ({ id, a: 0, h: 0 }))); } });

// ---------- Kampagne: verzweigte Karte ----------
const NAME = { fight: 'Kampf', elite: 'Elitekampf', camp: 'Lagerfeuer', pick: 'Kartenfund', trade: 'Händler', boss: 'Boss' };
function nodeName(n) { return n.t === 'event' ? T('Ereignis', 'Event') : n.t === 'camp' ? T('Lagerfeuer', 'Campfire') : n.t === 'pick' ? T('Kartenfund', 'Card find') : n.t === 'trade' ? T('Händler', 'Trader') : n.o.n; }
function nodeDesc(n) {
  if (n.t === 'fight') return '⚔️ ' + T('Kampf gegen ', 'Fight vs ') + n.o.n + ' – ' + T('Belohnung: eine neue Karte', 'reward: a new card');
  if (n.t === 'elite') return '💀 ' + T('Elitegegner ', 'Elite ') + n.o.n + ' – ' + T('stärker, dafür bessere Belohnung', 'tougher, better reward');
  if (n.t === 'camp') return '🔥 ' + T('Lagerfeuer: rasten, stärken, schärfen oder aussortieren', 'Campfire: rest, strengthen, sharpen or cull');
  if (n.t === 'pick') return '🎴 ' + T('Kartenfund: wähle eine von drei Karten', 'Card find: choose one of three cards');
  if (n.t === 'event') return '👁️ ' + T('Ereignis: etwas Unheimliches am Weg. Du musst dich entscheiden.', 'Event: something uncanny on the road. You must decide.');
  if (n.t === 'trade') return '🪙 ' + T('Händler: tausche eine Karte gegen eine zufällige stärkere', 'Trader: swap a card for a random stronger one');
  return '👑 ' + T('Boss ', 'Boss ') + n.o.n + ' – ' + HD.BOSS[n.o.boss][0] + ': ' + HD.BOSS[n.o.boss][1];
}
const WW = 320, STEP = 72, PAD = 150;      // Karte: Breite in Pixeln, Abstand der Ebenen, Rand oben/unten
function genMap(ai) {
  const A = AREAS[ai], R = Math.random, shuf = a => HD.shuffle(a.slice(), R), foes = shuf(A.foes), elites = shuf(A.elites); let fi = 0, ei = 0;
  const mk = t => t === 'fight' ? { t, o: foes[fi++ % foes.length] } : t === 'elite' ? { t, o: elites[ei++ % elites.length] } : { t };
  const kinds = [['fight'], ['fight', 'fight', 'pick', 'event'], ['fight', 'fight', 'trade', 'event'], ['camp', 'fight', 'event'], ['fight', 'elite', 'camp', 'event', 'trade'], ['fight', 'elite', 'camp', 'event', 'pick'], ['fight', 'elite', 'camp', 'event'], ['camp', 'pick', 'camp']], counts = [2, 3, 3, 2, 3, 3, 3, 2], layers = [];
  counts.forEach((c, li) => { const row = []; for (let j = 0; j < c; j++) row.push(mk(kinds[li][Math.floor(R() * kinds[li].length)])); layers.push(row); });
  if (!layers[3].some(n => n.t === 'camp')) layers[3][0] = mk('camp');
  if (!layers[7].some(n => n.t === 'camp')) layers[7][0] = mk('camp');
  [2, 4, 5, 6].forEach(li => { if (!layers[li].some(n => n.t === 'fight' || n.t === 'elite')) layers[li][0] = mk('fight'); });
  layers.push([{ t: 'boss', o: A.boss }]);
  for (let li = 0; li < layers.length - 1; li++) {
    const a = layers[li], b = layers[li + 1]; a.forEach(n => n.next = []);
    a.forEach((n, j) => { const t = a.length > 1 ? j * (b.length - 1) / (a.length - 1) : (b.length - 1) / 2, lo = Math.floor(t), hi = Math.ceil(t); n.next.push(lo); if (hi !== lo) n.next.push(hi); if (R() < .35 && b.length > 1) { const x = Math.max(0, Math.min(b.length - 1, lo + (R() < .5 ? -1 : 1))); if (n.next.indexOf(x) < 0) n.next.push(x); } });
    b.forEach((_, k) => { if (!a.some(n => n.next.indexOf(k) >= 0)) { let best = 0, bd = 99; a.forEach((n, j) => { const d = Math.abs(j * (b.length - 1) / Math.max(1, a.length - 1) - k); if (d < bd) { bd = d; best = j; } }); a[best].next.push(k); } });
  }
  const H = PAD * 2 + (layers.length - 1) * STEP;       // Die Reise geht von unten (Start) nach oben (Boss)
  layers.forEach((row, li) => row.forEach((n, j) => { n.x = Math.max(.15, Math.min(.85, .5 + (j - (row.length - 1) / 2) * .27 + (R() - .5) * .06)); n.wy = Math.round(H - PAD - li * STEP + (R() - .5) * 10); if (li === layers.length - 1) n.x = .5; }));
  return { layers, H };
}
function newCamp(hard) { const c = { a: 0, map: null, at: null, pend: null, hist: [], hard: !!hard, c: hard ? 1 : 2, deck: STARTER.map(id => ({ id, a: 0, h: 0 })) }; c.map = genMap(0); return c; }
const key = (l, i) => l + ':' + i, parse = k => k.split(':').map(Number), nodeAt = k => { const p = parse(k); return camp.map.layers[p[0]][p[1]]; };
function reachable() {
  if (camp.pend) return [];
  if (!camp.at) return camp.map.layers[0].map((n, i) => key(0, i));
  const n = camp.map.layers[camp.at.l][camp.at.i]; return n.next.map(i => key(camp.at.l + 1, i));
}
function nstate(k) {
  if (camp.hist.indexOf(k) >= 0) return 'done'; if (camp.pend && camp.pend === k) return 'cur'; return reachable().indexOf(k) >= 0 ? 'reach' : 'lock';
}
function pawnPos() { const k = camp.pend || (camp.at ? key(camp.at.l, camp.at.i) : null); if (!k) return { x: .5, wy: camp.map.H - PAD + 54 }; const n = nodeAt(k); return { x: n.x, wy: n.wy }; }

// ---------- Pixel-Grafik ----------

    const o = await chooser('👁️ ' + T('Der Pakt am Wegesrand', 'The pact by the road'), T('Eine verhüllte Gestalt bietet dir eine mächtige Karte an. Der Preis: eine Kerze.', 'A hooded figure offers a powerful card. The price: a candle.'), [], [{ t: '🕯️ ' + T('Annehmen: starke Karte, aber eine Kerze erlischt', 'Accept: strong card, but a candle goes out'), v: 'yes' }, { t: T('Ablehnen und weitergehen', 'Decline and move on'), v: 'no', alt: true }]);
    if (o === 'yes') { if (camp.c <= 1) { await chooser('👁️', T('Die Gestalt lacht: „Deine letzte Kerze? Nein.“ Sie verschwindet.', 'The figure laughs: "Your last candle? No." It vanishes.'), [], [{ t: 'OK', v: 1 }]); return; } camp.c--; const id = T3[Math.floor(Math.random() * T3.length)]; camp.deck.push({ id, a: 0, h: 0 }); await chooser('👁️ ' + T('Der Pakt gilt', 'The pact holds'), T('Du erhältst: ', 'You receive: ') + HD.CARDS[id].n, [{ id, a: 0, h: 0 }], [{ t: 'OK', v: 1 }]); }
  } else if (ev === 1) {
    const o = await chooser('👁️ ' + T('Der Verwundete', 'The wounded wanderer'), T('Ein Wanderer liegt im Dreck. Hilfst du ihm, kostet es dich eine Karte, aber er stärkt deine Kerzen.', 'A wanderer lies in the dirt. Helping costs you a card, but he strengthens your candles.'), [], [{ t: '❤️ ' + T('Helfen: eine Karte abgeben, eine Kerze entzünden', 'Help: give a card, light a candle'), v: 'yes' }, { t: T('Weitergehen', 'Move on'), v: 'no', alt: true }]);

  } else {

    if (o === 'yes' && deckN() > 10) {
      const a = await chooser(T('Erstes Opfer', 'First sacrifice'), '', camp.deck, [{ t: T('Abbrechen', 'Cancel'), v: -1, alt: true }]); if (a < 0) return;
      const rest = camp.deck.filter((_, i) => i !== a), b = await chooser(T('Zweites Opfer', 'Second sacrifice'), '', rest, [{ t: T('Abbrechen', 'Cancel'), v: -1, alt: true }]); if (b < 0) return;
      const first = camp.deck[a], second = rest[b]; camp.deck = camp.deck.filter(x => x !== first && x !== second);
      const t = await chooser(T('Wer wird gestärkt?', 'Who is empowered?'), T('+2 Angriff und +2 Leben für immer.', '+2 attack and +2 health forever.'), camp.deck, []); camp.deck[t].a += 2; camp.deck[t].h += 2;
    }
  }
}
async function trade() {
  const i = await chooser('🪙 ' + T('Händler', 'Trader'), T('Gib eine Karte ab und erhalte eine zufällige stärkere.', 'Give a card and receive a random stronger one.'), camp.deck, [{ t: T('Nicht tauschen', 'No deal'), v: -1, alt: true }]);
  if (i < 0) return;
  const old = HD.CARDS[camp.deck[i].id], pw = old.atk + old.hp, pool = T2.concat(T3).filter(id => HD.CARDS[id].atk + HD.CARDS[id].hp >= pw && id !== old.id), id = (pool.length ? pool : T2)[Math.floor(Math.random() * (pool.length ? pool.length : T2.length))];
  camp.deck[i] = { id, a: 0, h: 0 };
  await chooser('🪙 ' + T('Der Händler grinst …', 'The trader grins …'), T('Du erhältst: ', 'You receive: ') + HD.CARDS[id].n, [{ id, a: 0, h: 0 }], [{ t: 'OK', v: 1 }]);
}

// ---------- Spielstart ----------
function startDuel(o, deck) {
  const hard = !!(camp && fightNode && camp.hard);
  const base = o.base || o.diff; opp = Object.assign({}, o, { base, diff: Math.min(3, base + (hard ? 1 : 0)) }); o = opp; done = false; busy = false; ui = { sel: null, sac: [] };
  G = HD.newGame({ decks: [deck, o.d.map(id => ({ id, a: 0, h: 0 }))], npc: true, boss: o.boss || null, win: o.win || 5, hard });
  if (o.boss || hard || o.diff >= 2) HD.fillQueue(G, 1, o.diff);      // Erster Gegner-Zug: ab mittlerer Stufe, bei Bossen und im schweren Modus wartet schon eine Karte
  if (o.boss === 'curse') HD.fillQueue(G, 1, o.diff);
  document.body.classList.add('ingame'); $('back').onclick = e => { e.preventDefault(); $('bMenu').onclick(); };
  const bi = $('bossInfo'); if (o.boss) { bi.style.display = 'block'; bi.innerHTML = '👑 <b>' + o.n + '</b> · ' + HD.BOSS[o.boss][0] + ': ' + HD.BOSS[o.boss][1] + ' ' + T('Sieg ab ', 'Win at ') + o.win + T(' Punkten Vorsprung.', ' points lead.'); } else bi.style.display = 'none';
  beginTurn(); render();
  if (v3on && window.V3 && V3.ready) { V3.attach($('t3d')); V3.setMode('board'); V3.show(true); setTimeout(() => { V3.resize(); render(); }, 60); }
}
function toMenu() {
  document.body.classList.remove('ingame'); $('ov').classList.remove('show'); $('back').onclick = null; G = null; done = true;
  if (camp) showCamp(); else paintMenu();
}
function beginTurn() { HD.startTurn(G, 0); ui = { sel: null, sac: [] }; say(T('Du bist dran: Ziehe eine Karte.', 'Your turn: draw a card.')); }
function say(t) { $('msg').textContent = t; }

// ---------- Darstellung ----------
function slotEl(row, l, c, cls) { const s = document.createElement('div'); s.className = 'slot'; s.dataset.l = l; s.dataset.row = row; if (c) s.appendChild(cardEl(c, cls)); return s; }
function targets() {
  const P = G.p[0], c = ui.sel != null ? P.hand[ui.sel] : null, r = [];
  if (!c || G.turn !== 0 || G.phase !== 'main' || busy) return r;
  const need = c.cost.b || 0; let got = 0; ui.sac.forEach(l => got += HD.has(P.board[l], 'worthy') ? 3 : 1);
  if (got < need) return r;

  return r;
}
function itemTargets() { // gültige Gegner-/Eigenbahnen für den gerade gewählten Gegenstand
  const it = ui.item; if (!it || !G) return { o: [], p: [] }; const P = G.p[0], O = G.p[1], kind = HD.ITEMS[P.items[it.i]][3];
  const o = [], p = []; if (kind === 'e' || (kind === 'h' && it.l == null)) O.board.forEach((c, l) => { if (c) o.push(l); });
  if (kind === 'h' && it.l != null) P.board.forEach((c, l) => { if (!c) p.push(l); });
  return { o, p };
}
function paintItems() {
  const el = $('items'); if (!G) return; const P = G.p[0], can = G.turn === 0 && !busy && G.over === null && (G.phase === 'draw' || G.phase === 'main');
  el.innerHTML = P.items.length ? '<span class="il">' + T('Gegenstände', 'Items') + ':</span>' + P.items.map((id, i) => '<button class="itm' + (ui.item && ui.item.i === i ? ' on' : '') + '" data-i="' + i + '"' + (can ? '' : ' disabled') + ' title="' + HD.ITEMS[id][2] + '">' + HD.ITEMS[id][1] + ' ' + HD.ITEMS[id][0] + '</button>').join('') : '';
}
$('items').addEventListener('click', async e => {
  const b = e.target.closest('.itm'); if (!b || busy || !G || G.turn !== 0) return; const i = +b.dataset.i, id = G.p[0].items[i], kind = HD.ITEMS[id][3];
  info(null); $('info').innerHTML = '<b>' + HD.ITEMS[id][1] + ' ' + HD.ITEMS[id][0] + '</b>: ' + HD.ITEMS[id][2];
  if (kind) { ui = { sel: null, sac: [], item: ui.item && ui.item.i === i ? null : { i, l: null } }; say(ui.item ? (kind === 'h' ? T('Wähle die gegnerische Karte, die du dir holst.', 'Choose the enemy card to take.') : T('Wähle das Ziel.', 'Choose the target.')) : ''); render(); return; }
  busy = true; HD.useItem(G, 0, i, {}); busy = false; if (finish()) return; render();
});
async function oppSlotAction(l) {
  if (!ui.item || busy) return; const t = itemTargets(); if (t.o.indexOf(l) < 0) return; const id = G.p[0].items[ui.item.i], kind = HD.ITEMS[id][3];
  if (kind === 'h') { ui.item.l = l; say(T('Wähle eine freie Bahn auf deiner Seite.', 'Choose an empty lane on your side.')); render(); return; }
  const i = ui.item.i; ui.item = null; busy = true; const r = HD.useItem(G, 0, i, { l }); busy = false; if (r) say(r); if (finish()) return; render();
}
$('ob').addEventListener('click', e => { const sl = e.target.closest('.slot'); if (sl) oppSlotAction(+sl.dataset.l); });
function render() {
  if (!G) return; HD.refresh(G); paintItems();
  const P = G.p[0], O = G.p[1], tg = targets(), c = ui.sel != null ? P.hand[ui.sel] : null;
  const needSac = c && (c.cost.b || 0) > 0 && tg.length === 0;
  const fillRow = (id, row, arr, cls, mine) => { const el = $(id); el.innerHTML = ''; for (let l = 0; l < 4; l++) { const s = slotEl(row, l, arr[l], cls); if (mine) { if (tg.indexOf(l) >= 0) s.classList.add('tgt'); const cd = s.firstChild; if (cd) { if (ui.sac.indexOf(l) >= 0) cd.classList.add('sac'); if (needSac) cd.classList.add('ok'); } } el.appendChild(s); } };
  fillRow('oq', 'oq', O.queue, 'opp', false); fillRow('ob', 'ob', O.board, 'opp', false); fillRow('pb', 'pb', P.board, '', true);
  const it = itemTargets(); [...$('ob').children].forEach(sl => { if (it.o.indexOf(+sl.dataset.l) >= 0) sl.classList.add('tgt'); }); [...$('pb').children].forEach(sl => { if (it.p.indexOf(+sl.dataset.l) >= 0) sl.classList.add('tgt'); });
  const h = $('hand'); h.innerHTML = ''; P.hand.forEach((cd, i) => { const e = cardEl(cd, 'ok' + (i === ui.sel ? ' sel' : '')); e.dataset.i = i; h.appendChild(e); });
  const d = HD.diff(G); $('mk').style.left = (50 + d * (45 / G.win)) + '%';
  $('lbO').textContent = opp.n + ' · ' + O.dmg; $('lbY').textContent = T('Du', 'You') + ' · ' + P.dmg;
  $('bones').textContent = P.bones;
  const my = G.turn === 0 && G.over === null && !busy;
  $('dDeck').textContent = '🌲 ' + T('Wald', 'Forest') + ' (' + P.deck.length + ')'; $('dSide').textContent = '🐿️ ' + T('Eichhörnchen', 'Squirrel') + ' (' + P.side.length + ')';
  const canDraw = my && G.phase === 'draw' && !P.drew; $('dDeck').disabled = !(canDraw && P.deck.length); $('dSide').disabled = !(canDraw && P.side.length);
  $('dDeck').classList.toggle('on', canDraw); $('dSide').classList.toggle('on', canDraw);
  $('bell').disabled = !(my && G.phase === 'main');
  $('turnS').textContent = T('Runde ', 'Round ') + G.n;
  if (v3on && window.V3 && V3.ready) V3.sync({ G, tg: tg.concat(it.p), tgo: it.o, sac: ui.sac, opp });
}
function flash(s, l, cls) { const el = document.querySelector('.slot[data-row="' + (s === 0 ? 'pb' : 'ob') + '"][data-l="' + l + '"] .card'); if (el) el.classList.add(cls); }
async function hook(ev) {
  render();
  if (v3on && V3.ready) V3.fx(ev); else if (ev.k === 'atk') flash(ev.s, ev.l, 'atk-a'); else if (ev.k === 'hit') flash(ev.s, ev.l, 'hit');
  await sleep(ev.k === 'atk' ? 300 : ev.k === 'play' ? 160 : 380);
  if (ev.k === 'die' || ev.k === 'scale') render();
}

// ---------- 3D ----------
let libP = null;
const loadJs = src => new Promise((ok, no) => { const s = document.createElement('script'); s.src = src; s.onload = ok; s.onerror = () => no(new Error(src)); document.head.appendChild(s); });
async function set3d(on) {
  try { localStorage.setItem('hd-3d', on ? '1' : '0'); } catch (e) {}
  const camping = document.body.classList.contains('incamp') && !document.body.classList.contains('ingame'), gaming = document.body.classList.contains('ingame');
  if (!on) { v3on = false; document.body.classList.remove('v3'); if (window.V3 && V3.ready) V3.show(false); $('b3d').textContent = '🧊 3D'; if (camping) showCamp(); else render(); return; }
  try {
    if (!window.THREE) await loadJs('https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js');
    if (!window.V3) await loadJs('view3d.js?v=' + Date.now());
    if (!V3.ready) V3.init($('t3d'), { onSlot: (row, l) => { if (row === 'pb') slotAction(l); else if (row === 'ob') oppSlotAction(l); }, onHover: k => { if (camp && inCamp()) setInfo(k); } });
    v3on = true; document.body.classList.add('v3'); $('b3d').textContent = '▦ 2D';
    if (camping) showCamp(); else if (gaming) { V3.attach($('t3d')); V3.setMode('board'); V3.show(true); render(); }
  } catch (e) { v3on = false; document.body.classList.remove('v3'); say(T('3D konnte nicht geladen werden (Internet?). Es bleibt bei 2D.', '3D could not be loaded. Staying in 2D.')); if (camping) showCamp(); }
}
$('b3d').onclick = () => set3d(!v3on);
addEventListener('resize', () => { if (v3on && window.V3) V3.resize(); });

// ---------- Eingabe ----------
function pileDraw(from) { if (busy || G.turn !== 0 || G.phase !== 'draw') return; const c = HD.draw(G, 0, from); if (c) { say(T('Spiele Karten aus und läute dann die Klingel.', 'Play cards, then ring the bell.')); render(); } }
$('dDeck').onclick = () => pileDraw('deck'); $('dSide').onclick = () => pileDraw('side');
$('hand').addEventListener('click', e => {
  const el = e.target.closest('.card'); if (!el || busy || G.phase !== 'main') return; const i = +el.dataset.i;
  info(G.p[0].hand[i]); ui = { sel: ui.sel === i ? null : i, sac: [] }; render();
  const c = ui.sel != null ? G.p[0].hand[ui.sel] : null;
  if (c) { if ((c.cost.o || 0) > G.p[0].bones) say(T('Dafür fehlen Knochen 🦴.', 'Not enough bones 🦴.')); else if ((c.cost.b || 0) > 0) say(T('Wähle ', 'Choose ') + c.cost.b + T(' Karte(n) als Opfer 🩸.', ' card(s) to sacrifice 🩸.')); else say(T('Wähle eine freie Bahn.', 'Choose an empty lane.')); }
});
async function slotAction(l) {
  if (ui.item && ui.item.l != null && !busy) { const t = itemTargets(); if (t.p.indexOf(l) >= 0) { const i = ui.item.i, el = ui.item.l; ui.item = null; busy = true; HD.useItem(G, 0, i, { l: el, to: l }); busy = false; if (finish()) return; render(); } return; }
  if (busy || !G || G.turn !== 0 || ui.sel == null) return;
  const P = G.p[0], c = P.hand[ui.sel], tg = targets();
  if (tg.indexOf(l) >= 0) { busy = true; const idx = ui.sel, sac = ui.sac.slice(); ui = { sel: null, sac: [] }; await HD.play(G, 0, idx, l, sac, hook); busy = false; say(T('Weiter ausspielen oder die Klingel läuten.', 'Play more cards or ring the bell.')); render(); return; }
  if (P.board[l] && (c.cost.b || 0) > 0) { const k = ui.sac.indexOf(l); if (k >= 0) ui.sac.splice(k, 1); else ui.sac.push(l); info(P.board[l]); render(); if (targets().length) say(T('Wähle die Bahn für die neue Karte.', 'Choose the lane for the new card.')); }
}
$('pb').addEventListener('click', e => { const slot = e.target.closest('.slot'); if (slot) slotAction(+slot.dataset.l); });
function info(c) { $('info').innerHTML = c ? '<b>' + c.n + '</b> ' + c.atk + '/' + c.hp + (c.sig.length ? ' · ' + c.sig.map(s => HD.SIG[s][1] + ' <b>' + HD.SIG[s][0] + '</b>: ' + HD.SIG[s][2]).join(' · ') : '') : ''; }
document.addEventListener('mouseover', e => { const el = e.target.closest('.card'); if (!el || !G) return; const u = +el.dataset.uid; let c = null; G.p.forEach(p => [].concat(p.hand, p.board, p.queue).forEach(x => { if (x && x.uid === u) c = x; })); if (c) info(c); });
$('bell').onclick = async () => {
  if (busy || G.turn !== 0 || G.phase !== 'main') return; busy = true; ui = { sel: null, sac: [] }; render(); say(T('Angriff!', 'Attack!'));
  await HD.attack(G, 0, hook); if (finish()) return;
  HD.endTurn(G, 0); render(); await sleep(300);
  if (G.p[1].skip) { G.p[1].skip = false; say(T('⏳ Der Gegner überspringt seinen Zug.', '⏳ The enemy skips their turn.')); await sleep(900); } else { await npcTurn(); if (finish()) return; }
  busy = false; beginTurn(); render();
};
async function npcTurn() {
  say(opp.n + T(' ist am Zug …', ' is playing …')); HD.startTurn(G, 1); await sleep(450);
  if (G.boss) { const n0 = G.p[0].board.filter(Boolean).length; HD.bossTurn(G); if (G.boss === 'curse') say('🧙 ' + HD.BOSS.curse[0] + '!'); render(); await sleep(600); }
  HD.advanceQueue(G, 1); render(); await sleep(450);
  await HD.attack(G, 1, hook); if (G.over !== null) return;
  HD.endTurn(G, 1); HD.fillQueue(G, 1, opp.diff); render();
}
function finish() {
  if (G.over === null) return false; busy = true; render(); done = true;
  const win = G.over === 0; $('ovT').textContent = win ? T('Gewonnen! 🎉', 'You win! 🎉') : T('Verloren …', 'You lost …');
  $('ovP').textContent = win ? T('Die Waage kippt auf deine Seite.', 'The scale tips to your side.') : T('Die Waage kippt zum Gegner.', 'The scale tips to your opponent.');
  if (fightNode && camp) {
    if (!win) { camp.c--; save(); $('ovP').textContent += ' ' + (camp.c > 0 ? T('Eine Kerze erlischt. Noch ', 'A candle goes out. ') + camp.c + T(' übrig.', ' left.') : T('Die letzte Kerze erlischt: Die Kampagne ist zu Ende.', 'The last candle goes out: the campaign is over.')); }
    $('ovB').textContent = win ? T('Weiter', 'Continue') : (camp.c > 0 ? T('Nochmal versuchen', 'Try again') : T('Kampagne beenden', 'End campaign'));
    $('ovM').style.display = win || camp.c <= 0 ? 'none' : '';
  } else { $('ovB').textContent = T('Nochmal', 'Again'); $('ovM').style.display = ''; }
  $('ovM').textContent = T('Zur Karte', 'To the map'); $('ov').classList.add('show'); return true;
}
$('ovB').onclick = async () => {
  $('ov').classList.remove('show');
  if (fightNode && camp) {
    const win = G.over === 0;
    if (win) { await reward(fightNode.t !== 'fight'); await completeNode(); return; }
    if (camp.c <= 0) { await makeDeathCard(); store.del(KEY); camp = null; fightNode = null; G = null; document.body.classList.remove('incamp'); toMenu(); return; }
    startDuel(opp, camp.deck.slice()); return;
  }
  startDuel(opp, STARTER.map(id => ({ id, a: 0, h: 0 })));
};
$('ovM').onclick = () => toMenu();
$('bMenu').onclick = () => { if (!done && !confirm(T('Kampf abbrechen? In der Kampagne geht dabei keine Kerze verloren.', 'Abort the fight? No candle is lost in the campaign.'))) return; fightNode = fightNode && camp ? fightNode : null; toMenu(); };
if (window.SITE && SITE.guard) SITE.guard(() => !!G && !done);
paintMenu(); paintBook();
let want3 = true; try { want3 = localStorage.getItem('hd-3d') !== '0'; } catch (e) {}
if (want3) set3d(true);
window.__hdReady = true;
window.HDUI = { get G() { return G; }, get camp() { return camp; }, startDuel, set3d, AREAS, chooseNode: k => chooseNode(k), event: () => event(), newCamp };
})();
</script>
