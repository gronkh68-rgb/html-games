<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Hüttenduell</title>
<link rel="stylesheet" href="../common.css">
<script src="../theme.js"></script>
<style>
html,body{overscroll-behavior:none}
body{user-select:none;-webkit-user-select:none;touch-action:manipulation}
.wrap{max-width:1000px;padding:10px 12px 16px}
:root{--cw:min(92px,19vw);--ch:calc(var(--cw)*1.45);--par:#d8c7a0;--par2:#b9a577;--ink:#2a2014;--blood:#c2342d}
/* Menü */
.menu .opp{display:flex;flex-direction:column;gap:6px;text-align:left;padding:12px 14px;border-radius:14px;background:var(--card);border:1px solid var(--border);border-top:3px solid var(--c,var(--accent));color:var(--text);cursor:pointer;font:inherit}
.menu .opp:hover{border-color:var(--c,var(--accent));transform:translateY(-2px)}
.menu .opp b{font-size:1.05rem}.menu .opp small{color:var(--muted)}
.ogrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px;margin:10px 0 16px}
.rules{font-size:.88rem;color:var(--muted);line-height:1.55}.rules b{color:var(--text)}
/* Spielfeld */
#game{display:none}
.cbook{display:flex;flex-wrap:wrap;gap:10px}.cbook .cell{width:calc(var(--cw)*1.0);font-size:.7rem;color:var(--muted);text-align:center}.cbook .card{margin:0 auto 4px;cursor:default}body.ingame #menu{display:none}body.ingame #game{display:block}
.hdr{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.hdr .sp{flex:1}
.scale{flex:1;min-width:200px;max-width:420px}
.scale .track{position:relative;height:16px;border-radius:9px;background:linear-gradient(90deg,#c2342d55,#222 45%,#222 55%,#39ff1455);border:1px solid var(--border)}
.scale .zero{position:absolute;left:50%;top:-3px;bottom:-3px;width:2px;background:var(--muted)}
.scale .mk{position:absolute;top:-4px;width:20px;height:22px;margin-left:-10px;border-radius:6px;background:var(--accent2);box-shadow:0 0 10px var(--accent2);transition:left .35s}
.scale .lb{display:flex;justify-content:space-between;font-size:.72rem;color:var(--muted);margin-top:3px}
.stat{padding:5px 10px;border-radius:10px;background:var(--card);border:1px solid var(--border);font-size:.9rem;white-space:nowrap}
.stat b{font-variant-numeric:tabular-nums}
.table{background:radial-gradient(ellipse at 50% 40%,#3a2616,#1a0f08 70%);border:2px solid #5a3a1c;border-radius:16px;padding:10px;box-shadow:inset 0 0 60px rgba(0,0,0,.6)}
.row{display:grid;grid-template-columns:repeat(4,var(--cw));gap:8px;justify-content:center;margin:5px 0}
.row.q{opacity:.75}
.row.q .slot{height:calc(var(--ch)*.62)}
.row.q .card{transform:scale(.62);transform-origin:top center}
.slot{width:var(--cw);height:var(--ch);border-radius:10px;border:2px solid rgba(201,162,78,.6);position:relative;display:grid;place-items:center;background:radial-gradient(ellipse at 50% 40%,rgba(62,40,22,.9),rgba(14,8,4,.96));box-shadow:inset 0 0 16px rgba(0,0,0,.85),0 0 0 1px rgba(0,0,0,.6)}
#ob .slot{border-color:rgba(181,82,58,.7)}#oq .slot{border-color:rgba(138,132,120,.55)}
.slot::before{content:"";position:absolute;inset:5px;border:1px solid rgba(201,162,78,.28);border-radius:6px;pointer-events:none}
.slot::after{content:"🐾";position:absolute;inset:0;display:grid;place-items:center;font-size:calc(var(--cw)*.4);opacity:.07;pointer-events:none}
.slot .card{z-index:1}
.slot.tgt{border-color:var(--accent2);box-shadow:0 0 12px var(--accent2);cursor:pointer;animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.6}}
.mid{height:2px;background:linear-gradient(90deg,transparent,#8a6a3a,transparent);margin:6px 0}
.card{width:var(--cw);height:var(--ch);border-radius:8px;background:linear-gradient(160deg,var(--par),var(--par2));border:2px solid #4a3820;position:relative;color:var(--ink);font-family:Georgia,serif;box-shadow:0 3px 8px rgba(0,0,0,.5);transition:transform .2s,box-shadow .2s}
.card .nm{position:absolute;left:4px;right:4px;top:3px;font-size:calc(var(--cw)*.115);font-weight:700;text-align:center;line-height:1.05;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .art{position:absolute;left:6px;right:6px;top:calc(var(--cw)*.24);height:calc(var(--ch)*.45);background:radial-gradient(circle,#efe3c4,#c9b68a);border:1px solid #6a5636;border-radius:4px;display:grid;place-items:center;font-size:calc(var(--cw)*.5);filter:sepia(.7) contrast(1.1) saturate(.8)}
.card .cost{position:absolute;right:3px;top:calc(var(--cw)*.22);font-size:calc(var(--cw)*.14);line-height:1;text-align:right;z-index:2;text-shadow:0 0 2px #fff}
.card .atk,.card .hp{position:absolute;bottom:3px;font:900 calc(var(--cw)*.27)/1 Georgia,serif;text-shadow:0 0 2px #efe3c4}
.card .atk{left:6px}.card .hp{right:6px}.card .hp.dmg{color:#b5261f}
.card .sg{position:absolute;left:0;right:0;bottom:calc(var(--cw)*.05);text-align:center;font-size:calc(var(--cw)*.2);letter-spacing:1px}
.card.opp{background:linear-gradient(160deg,#cdbb92,#a8946a)}
.card.sel{transform:translateY(-14px);box-shadow:0 0 16px var(--accent2),0 3px 8px rgba(0,0,0,.5)}
.card.sac{outline:3px solid var(--blood);box-shadow:0 0 14px var(--blood)}
.card.ok{cursor:pointer}
.card.sub{opacity:.55;filter:saturate(.6) hue-rotate(160deg)}
.card.hit{animation:hit .3s}.card.atk-a{animation:lunge .35s}
@keyframes hit{25%{transform:translateX(-5px) rotate(-3deg);filter:brightness(1.6)}75%{transform:translateX(5px) rotate(3deg)}}
@keyframes lunge{40%{transform:translateY(-16px) scale(1.06)}}
.hand{display:flex;gap:8px;justify-content:center;padding:14px 4px 4px;overflow-x:auto;min-height:calc(var(--ch) + 22px)}
.hand .card{flex:none;cursor:pointer}
.piles{display:flex;gap:10px;justify-content:center;margin:6px 0}
.pile{padding:8px 12px;border-radius:10px;background:var(--card);border:1px solid var(--border);color:var(--text);cursor:pointer;font:inherit;font-size:.85rem}
.pile:disabled{opacity:.4;cursor:default}.pile.on{border-color:var(--accent2);box-shadow:0 0 10px var(--accent2)}
.bar{display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap;margin-top:6px}
.bell{font-size:1rem;padding:10px 22px}
.msg{min-height:1.5em;text-align:center;color:var(--text);margin:6px 0;font-size:.95rem}
#info{min-height:2.6em;text-align:center;font-size:.82rem;color:var(--muted);margin-top:4px}
#ov{position:fixed;inset:0;display:none;place-items:center;background:rgba(5,5,10,.72);z-index:50;padding:16px}
#ov.show{display:grid}
#ov .box{background:var(--card);border:1px solid var(--border);border-top:3px solid var(--accent);border-radius:16px;padding:22px 26px;text-align:center;max-width:360px}
#ov h2{margin:0 0 6px}#ov p{margin:0 0 14px;color:var(--muted)}

/* Kampagne */
#camp{display:none}body.incamp #menu{display:none}body.incamp #camp{display:block}body.ingame #camp{display:none}
.cmap{display:flex;flex-direction:column;gap:12px}
.area{border-radius:14px;border:1px solid var(--border);border-top:3px solid var(--c);background:var(--card);padding:12px 14px}
.area.lock{opacity:.45}
.area h3{margin:0 0 8px;font-size:1.05rem}
.nodes{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.nd{min-width:96px;padding:8px 10px;border-radius:10px;border:2px solid var(--border);text-align:center;font-size:.82rem;background:var(--card-hover);color:var(--text)}
.nd b{display:block;font-size:1.3rem}
.nd.done{opacity:.5;border-color:#39ff14}.nd.cur{border-color:var(--accent2);box-shadow:0 0 12px var(--accent2)}.nd.boss b{color:#ff8a00}
.ar{color:var(--muted)}
.cbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:8px 0}
.mrow{display:flex;gap:10px;flex-wrap:wrap}
#mapc{display:block;width:100%;image-rendering:pixelated;border:3px solid #5a3a1c;border-radius:10px;background:#000;cursor:default}
#cm3d{display:none;height:min(62vh,540px);border-radius:14px;overflow:hidden;border:3px solid #5a3a1c;background:#0b0705;position:relative}
body.v3 #cm3d{display:block}body.v3 #mapc{display:none}
#mapinfo{min-height:2.6em;margin-top:8px;color:var(--muted);text-align:center;font-size:.9rem}
#t3d{display:none;position:relative;height:min(58vh,540px);border-radius:16px;overflow:hidden;border:2px solid #5a3a1c;background:#0b0705}
body.v3 #t3d{display:block}body.v3 #t2d{display:none}
#bossInfo{display:none;margin:0 0 8px;padding:8px 12px;border-radius:10px;background:#3a1a10;border:1px solid #ff8a00;color:#ffd9b0;font-size:.85rem}
#bossInfo b{color:#ff8a00}
#pk{position:fixed;inset:0;display:none;place-items:center;background:rgba(5,5,10,.8);z-index:60;padding:12px;overflow:auto}
#pk.show{display:grid}
#pk .box{background:var(--card);border:1px solid var(--border);border-top:3px solid var(--accent);border-radius:16px;padding:18px;text-align:center;max-width:min(96vw,640px);max-height:94vh;overflow:auto}
#pk h2{margin:0 0 4px}#pk p{margin:0 0 12px;color:var(--muted);font-size:.9rem}
#pk .cs{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
#pk .cs .card{cursor:pointer}#pk .cs .card:hover{transform:translateY(-6px);box-shadow:0 0 16px var(--accent2)}
#pk .opts{display:flex;flex-direction:column;gap:8px;margin-top:10px}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><a class="back" id="back" href="../">← Spiele</a><h1>Hüttenduell</h1></div>

  <div id="menu" class="menu">
    <div class="panel">
      <h2 id="kT"></h2>
      <p class="rules" id="kP"></p>
      <div class="mrow" id="kBtns"></div>
    </div>
    <div class="panel">
      <h2 id="mT"></h2>
      <p class="rules" id="rules"></p>
      <div class="ogrid" id="ogrid"></div>
    </div>
    <div class="panel"><h2 id="cbT"></h2><p class="rules" id="cbP"></p><div class="cbook" id="cbook"></div></div>
  </div>

  <div id="camp">
    <div class="panel">
      <h2 id="cT"></h2>
      <div class="cbar"><span class="stat" id="cCan"></span><button class="btn alt" id="cDeck"></button><button class="btn alt" id="cm3">🧊 3D</button><button class="btn alt" id="cExit"></button></div>
      <div id="mapwrap"><canvas id="mapc" width="384" height="240"></canvas><div id="cm3d"></div></div>
      <div id="mapinfo"></div>
      <div class="mrow" style="margin-top:10px"><button class="btn" id="cGo"></button></div>
    </div>
  </div>

  <div id="game">
    <div class="hdr">
      <div class="scale"><div class="track"><div class="zero"></div><div class="mk" id="mk"></div></div><div class="lb"><span id="lbO"></span><span id="lbY"></span></div></div>
      <span class="stat">🦴 <b id="bones">0</b></span>
      <span class="stat" id="turnS"></span>
      <button class="btn alt" id="b3d" title="2D / 3D">🧊 3D</button>
      <button class="btn alt" id="bMenu">☰</button>
    </div>
    <div id="bossInfo"></div>
    <div id="t3d"></div>
    <div class="table" id="t2d">
      <div class="row q" id="oq"></div>
      <div class="row" id="ob"></div>
      <div class="mid"></div>
      <div class="row" id="pb"></div>
    </div>
    <div class="msg" id="msg"></div>
    <div class="piles"><button class="pile" id="dDeck"></button><button class="pile" id="dSide"></button></div>
    <div class="hand" id="hand"></div>
    <div class="bar"><button class="btn bell" id="bell">🔔 Angriff</button></div>
    <div id="info"></div>
  </div>
</div>
<div id="pk"><div class="box"><h2 id="pkT"></h2><p id="pkP"></p><div class="cs" id="pkC"></div><div class="opts" id="pkO"></div></div></div>
<div id="ov"><div class="box"><h2 id="ovT"></h2><p id="ovP"></p><button class="btn" id="ovB"></button> <button class="btn alt" id="ovM"></button></div></div>
<script src="engine.js"></script>
<script>
(function () {
'use strict';
const T = (d, e) => (window.SITE && SITE.T) ? SITE.T(d, e) : d, $ = id => document.getElementById(id), sleep = ms => new Promise(r => setTimeout(r, ms));
const store = { get(k) { try { return JSON.parse(localStorage.getItem(k) || 'null'); } catch (e) { return null; } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }, del(k) { try { localStorage.removeItem(k); } catch (e) {} } };
// ---------- Gegner und Gebiete ----------
const OPP = [
  { id: 'koehler', n: 'Der Köhler', icon: '🪓', c: '#39ff14', diff: 1, d: ['stoat', 'stoat', 'wolf_cub', 'wolf_cub', 'frog', 'frog', 'porcupine', 'mole', 'wolf', 'adder', 'raven_egg', 'warren', 'otter', 'tadpole', 'opossum', 'skink', 'goat'], t: 'Einfach: kleine Waldtiere, wenig Druck.' },
  { id: 'hexe', n: 'Die Moorhexe', icon: '🧙', c: '#a06bff', diff: 2, d: ['adder', 'adder', 'bat', 'bat', 'rattler', 'coyote', 'raven', 'raven', 'mantis', 'mantis_god', 'wolf', 'hound', 'ouro', 'packrat', 'cat', 'cockroach', 'ant', 'ant', 'ant_queen', 'kingfisher'], t: 'Mittel: Gift, Flieger und Knochen-Karten.' },
  { id: 'hirsch', n: 'Der Hirschkönig', icon: '🦌', c: '#ff8a00', diff: 3, d: ['elk', 'elk', 'elk_fawn', 'grizzly', 'grizzly', 'ox', 'vulture', 'hound', 'wolf', 'wolf', 'raven', 'mantis_god', 'bat', 'rattler', 'direwolf', 'shark', 'beaver', 'mole_man'], t: 'Schwer: große Tiere, schnelle Läufer.' }
];
const T1 = ['stoat', 'wolf_cub', 'frog', 'adder', 'porcupine', 'mole', 'mantis', 'warren', 'goat', 'cat', 'otter', 'tadpole', 'raven_egg', 'ant', 'skink', 'opossum', 'elk_fawn'];
const T2 = ['raven', 'bat', 'wolf', 'hound', 'packrat', 'coyote', 'beaver', 'kingfisher', 'ant_queen', 'cockroach', 'elk', 'mantis_god'];
const T3 = ['grizzly', 'rattler', 'direwolf', 'shark', 'ouro', 'mole_man', 'vulture', 'ox'];
const AREAS = [
  { id: 'wald', n: 'Nebelwald', icon: '🌲', c: '#39ff14', pool: T1.concat(T1, T2), foes: [
    { n: 'Der Wilderer', icon: '🏹', diff: 1, d: ['stoat', 'stoat', 'wolf_cub', 'frog', 'frog', 'porcupine', 'mole', 'warren', 'adder', 'opossum', 'skink', 'raven_egg'] },
    { n: 'Die Pilzsammlerin', icon: '🍄', diff: 1, d: ['stoat', 'wolf_cub', 'wolf_cub', 'tadpole', 'otter', 'mantis', 'goat', 'cat', 'ant', 'ant', 'elk_fawn', 'wolf'] },
    { n: 'Der Holzfäller', icon: '🪓', diff: 1, d: ['stoat', 'beaver', 'wolf_cub', 'frog', 'porcupine', 'mole', 'wolf', 'adder', 'warren', 'goat', 'skink', 'opossum'] }
  ], elites: [
    { n: 'Der Eber', icon: '🐗', diff: 2, d: ['grizzly', 'wolf', 'wolf', 'stoat', 'porcupine', 'porcupine', 'hound', 'elk_fawn', 'mole', 'mantis', 'raven', 'warren'] },
    { n: 'Die Wolfsmutter', icon: '🐺', diff: 2, d: ['wolf', 'wolf', 'wolf_cub', 'wolf_cub', 'wolf_cub', 'direwolf', 'hound', 'stoat', 'frog', 'raven', 'goat', 'cat'] }
  ], boss: { n: 'Der Hirschkönig', icon: '🦌', diff: 2, boss: 'pack', win: 7, d: ['elk', 'elk', 'elk_fawn', 'elk_fawn', 'wolf', 'wolf', 'stoat', 'raven', 'hound', 'grizzly', 'porcupine', 'mole'] } },
  { id: 'moor', n: 'Irrlichtmoor', icon: '🌫️', c: '#a06bff', pool: T2.concat(T2, T3, T1), foes: [
    { n: 'Der Torfstecher', icon: '⛏️', diff: 2, d: ['adder', 'adder', 'frog', 'tadpole', 'otter', 'kingfisher', 'raven', 'mole', 'beaver', 'wolf', 'bat', 'cockroach'] },
    { n: 'Das Irrlicht', icon: '🔥', diff: 2, d: ['bat', 'bat', 'raven', 'kingfisher', 'mantis', 'mantis_god', 'coyote', 'ant_queen', 'ant', 'ant', 'hound', 'packrat'] },
    { n: 'Der Fährmann', icon: '🛶', diff: 2, d: ['otter', 'otter', 'kingfisher', 'shark', 'tadpole', 'frog', 'beaver', 'wolf', 'raven', 'adder', 'cat', 'packrat'] }
  ], elites: [
    { n: 'Die Nebelmutter', icon: '🌫️', diff: 3, d: ['kingfisher', 'kingfisher', 'shark', 'otter', 'bat', 'bat', 'raven', 'ant_queen', 'ant', 'ant', 'mantis_god', 'cat'] },
    { n: 'Der Sumpfriese', icon: '🐊', diff: 3, d: ['shark', 'grizzly', 'adder', 'adder', 'rattler', 'beaver', 'mole_man', 'hound', 'wolf', 'cockroach', 'ouro', 'raven'] }
  ], boss: { n: 'Die Moorhexe', icon: '🧙', diff: 2, boss: 'curse', win: 7, d: ['adder', 'adder', 'adder', 'bat', 'rattler', 'coyote', 'raven', 'raven', 'cat', 'cat', 'ouro', 'mantis_god', 'wolf'] } },
  { id: 'gruft', n: 'Knochengruft', icon: '💀', c: '#ff8a00', pool: T3.concat(T3, T2), foes: [
    { n: 'Der Totengräber', icon: '⚰️', diff: 3, d: ['adder', 'cockroach', 'cockroach', 'rattler', 'bat', 'bat', 'ouro', 'wolf', 'hound', 'direwolf', 'packrat', 'cat'] },
    { n: 'Die Grabwächterin', icon: '🗿', diff: 3, d: ['mole_man', 'mole_man', 'grizzly', 'ox', 'direwolf', 'vulture', 'shark', 'beaver', 'hound', 'raven', 'wolf', 'mantis_god'] },
    { n: 'Der Leichenfledderer', icon: '🦇', diff: 3, d: ['bat', 'bat', 'vulture', 'raven', 'raven', 'coyote', 'cockroach', 'rattler', 'adder', 'wolf', 'packrat', 'mantis'] }
  ], elites: [
    { n: 'Der Knochenriese', icon: '🦴', diff: 3, d: ['grizzly', 'grizzly', 'ox', 'ox', 'direwolf', 'rattler', 'rattler', 'cockroach', 'ouro', 'vulture', 'hound', 'wolf'] },
    { n: 'Die Schattenwölfin', icon: '🐺', diff: 3, d: ['direwolf', 'direwolf', 'wolf', 'wolf', 'bat', 'bat', 'mantis_god', 'mantis_god', 'raven', 'ouro', 'cockroach', 'hound'] }
  ], boss: { n: 'Der Knochenfürst', icon: '👑', diff: 3, boss: 'necro', win: 7, d: ['rattler', 'rattler', 'cockroach', 'cockroach', 'bat', 'bat', 'adder', 'grizzly', 'ouro', 'direwolf', 'vulture', 'mantis_god', 'ox'] } }
];
const STARTER = ['stoat', 'wolf_cub', 'frog', 'adder', 'raven', 'elk_fawn', 'porcupine', 'mole', 'mantis', 'warren', 'wolf', 'hound', 'cat', 'goat', 'otter'];
const KEY = 'hd-camp-v2';
let G = null, opp = null, ui = { sel: null, sac: [] }, busy = false, done = false, camp = null, fightNode = null, v3on = false;

// ---------- Kartenelemente ----------
function costHtml(c) { let s = ''; for (let i = 0; i < (c.cost.b || 0); i++) s += '🩸'; if (c.cost.o) s += (s ? '<br>' : '') + '🦴' + (c.cost.o > 1 ? '×' + c.cost.o : ''); return s; }
function cardEl(c, cls) {
  const d = document.createElement('div'); d.className = 'card ' + (cls || '') + (c.sub ? ' sub' : ''); d.dataset.uid = c.uid;
  d.innerHTML = '<div class="nm">' + c.n + '</div><div class="cost">' + costHtml(c) + '</div><div class="art">' + c.art + '</div><div class="atk">' + c.atk + '</div><div class="hp' + (c.hp < c.max ? ' dmg' : '') + '">' + c.hp + '</div><div class="sg">' + c.sig.map(s => HD.SIG[s][1]).join('') + (c.lives > 1 ? '×' + c.lives : '') + '</div>';
  return d;
}
const deckCard = x => HD.make(x);
function chooser(title, text, cards, opts) {      // Auswahl-Fenster: cards = [{x, label}] -> Promise<Index|-1>
  return new Promise(res => {
    $('pkT').textContent = title; $('pkP').textContent = text; const C = $('pkC'), O = $('pkO'); C.innerHTML = ''; O.innerHTML = '';
    cards.forEach((x, i) => { const c = deckCard(x), e = cardEl(c, 'ok'); e.onclick = () => { $('pk').classList.remove('show'); res(i); }; e.onmouseenter = () => info(c); C.appendChild(e); });
    (opts || []).forEach(o => { const b = document.createElement('button'); b.className = 'btn' + (o.alt ? ' alt' : ''); b.textContent = o.t; b.onclick = () => { $('pk').classList.remove('show'); res(o.v); }; O.appendChild(b); });
    $('pk').classList.add('show');
  });
}

// ---------- Menü ----------
function paintMenu() {

    await chooser('🗺️ ' + T('Gebiet geschafft!', 'Region cleared!'), T('Du betrittst: ', 'You enter: ') + AREAS[camp.a].icon + ' ' + AREAS[camp.a].n, [], [{ t: T('Weiter', 'Continue'), v: 1 }]);
    camp.map = genMap(camp.a);
  }
  save(); showCamp();
}
async function campfire() {
  const o = await chooser('🔥 ' + T('Lagerfeuer', 'Campfire'), T('Wähle eine Hilfe. Du darfst nur eine nutzen.', 'Choose one help. You may use only one.'), [], [
    { t: '🕯️ ' + T('Rasten: eine Kerze entzünden (höchstens 3)', 'Rest: light a candle (max 3)'), v: 'rest' }, { t: '❤️ ' + T('Stärken: eine Karte erhält +1 Leben', 'Strengthen: a card gets +1 health'), v: 'hp' },
    { t: '⚔️ ' + T('Schärfen: eine Karte erhält +1 Angriff', 'Sharpen: a card gets +1 attack'), v: 'atk' }, { t: '🗑️ ' + T('Aussortieren: eine Karte aus dem Deck entfernen', 'Cull: remove a card from the deck'), v: 'cull' }]);
  if (o === 'rest') { camp.c = Math.min(3, camp.c + 1); return; }
  const i = await chooser(o === 'hp' ? T('Welche Karte stärken?', 'Which card?') : o === 'atk' ? T('Welche Karte schärfen?', 'Which card?') : T('Welche Karte entfernen?', 'Which card?'), '', camp.deck, [{ t: T('Abbrechen', 'Cancel'), v: -1, alt: true }]);
  if (i < 0) return campfire();
  if (o === 'hp') camp.deck[i].h++; else if (o === 'atk') camp.deck[i].a++; else if (camp.deck.length > 8) camp.deck.splice(i, 1); else { alert(T('Das Deck braucht mindestens 8 Karten.', 'The deck needs at least 8 cards.')); return campfire(); }
}
async function reward(up) {
  const pool = up ? T3.concat(T2, T3) : AREAS[camp.a].pool.slice(), pick = [];
  while (pick.length < 3) { const id = pool[Math.floor(Math.random() * pool.length)]; if (pick.indexOf(id) < 0) pick.push(id); }
  const i = await chooser(up ? T('Beute des Elitegegners', 'Elite loot') : T('Belohnung', 'Reward'), T('Wähle eine neue Karte für dein Deck.', 'Choose a new card for your deck.'), pick.map(id => ({ id, a: 0, h: 0 })), [{ t: T('Keine nehmen', 'Take none'), v: -1, alt: true }]);
  if (i >= 0) camp.deck.push({ id: pick[i], a: 0, h: 0 });
}
async function trade() {
  const i = await chooser('🪙 ' + T('Händler', 'Trader'), T('Gib eine Karte ab und erhalte eine zufällige stärkere.', 'Give a card and receive a random stronger one.'), camp.deck, [{ t: T('Nicht tauschen', 'No deal'), v: -1, alt: true }]);
  if (i < 0) return;
  const old = HD.CARDS[camp.deck[i].id], pw = old.atk + old.hp, pool = T2.concat(T3).filter(id => HD.CARDS[id].atk + HD.CARDS[id].hp >= pw && id !== old.id), id = (pool.length ? pool : T2)[Math.floor(Math.random() * (pool.length ? pool.length : T2.length))];
  camp.deck[i] = { id, a: 0, h: 0 };
  await chooser('🪙 ' + T('Der Händler grinst …', 'The trader grins …'), T('Du erhältst: ', 'You receive: ') + HD.CARDS[id].n, [{ id, a: 0, h: 0 }], [{ t: 'OK', v: 1 }]);
}

// ---------- Spielstart ----------
function startDuel(o, deck) {
  opp = o; done = false; busy = false; ui = { sel: null, sac: [] };
  G = HD.newGame({ decks: [deck, o.d.map(id => ({ id, a: 0, h: 0 }))], npc: true, boss: o.boss || null, win: o.win || 5 });
  HD.fillQueue(G, 1, o.diff);
  if (o.boss === 'curse') HD.fillQueue(G, 1, o.diff);
  document.body.classList.add('ingame'); $('back').onclick = e => { e.preventDefault(); $('bMenu').onclick(); };
  const bi = $('bossInfo'); if (o.boss) { bi.style.display = 'block'; bi.innerHTML = '👑 <b>' + o.n + '</b> · ' + HD.BOSS[o.boss][0] + ': ' + HD.BOSS[o.boss][1] + ' ' + T('Sieg ab ', 'Win at ') + o.win + T(' Punkten Vorsprung.', ' points lead.'); } else bi.style.display = 'none';
  beginTurn(); render();
  if (v3on && window.V3 && V3.ready) { V3.attach($('t3d')); V3.setMode('board'); V3.show(true); setTimeout(() => { V3.resize(); render(); }, 60); }
}
function toMenu() {
  document.body.classList.remove('ingame'); $('ov').classList.remove('show'); $('back').onclick = null; G = null; done = true;
  if (camp) showCamp(); else paintMenu();
}
function beginTurn() { HD.startTurn(G, 0); ui = { sel: null, sac: [] }; say(T('Du bist dran: Ziehe eine Karte.', 'Your turn: draw a card.')); }
function say(t) { $('msg').textContent = t; }

// ---------- Darstellung ----------
function slotEl(row, l, c, cls) { const s = document.createElement('div'); s.className = 'slot'; s.dataset.l = l; s.dataset.row = row; if (c) s.appendChild(cardEl(c, cls)); return s; }
function targets() {
  const P = G.p[0], c = ui.sel != null ? P.hand[ui.sel] : null, r = [];
  if (!c || G.turn !== 0 || G.phase !== 'main' || busy) return r;
  const need = c.cost.b || 0; let got = 0; ui.sac.forEach(l => got += HD.has(P.board[l], 'worthy') ? 3 : 1);
  if (got < need) return r;
  for (let l = 0; l < 4; l++) if (!HD.check(G, 0, ui.sel, l, ui.sac)) r.push(l);
  return r;
}
function render() {
  if (!G) return; HD.refresh(G);
  const P = G.p[0], O = G.p[1], tg = targets(), c = ui.sel != null ? P.hand[ui.sel] : null;
  const needSac = c && (c.cost.b || 0) > 0 && tg.length === 0;
  const fillRow = (id, row, arr, cls, mine) => { const el = $(id); el.innerHTML = ''; for (let l = 0; l < 4; l++) { const s = slotEl(row, l, arr[l], cls); if (mine) { if (tg.indexOf(l) >= 0) s.classList.add('tgt'); const cd = s.firstChild; if (cd) { if (ui.sac.indexOf(l) >= 0) cd.classList.add('sac'); if (needSac) cd.classList.add('ok'); } } el.appendChild(s); } };
  fillRow('oq', 'oq', O.queue, 'opp', false); fillRow('ob', 'ob', O.board, 'opp', false); fillRow('pb', 'pb', P.board, '', true);
  const h = $('hand'); h.innerHTML = ''; P.hand.forEach((cd, i) => { const e = cardEl(cd, 'ok' + (i === ui.sel ? ' sel' : '')); e.dataset.i = i; h.appendChild(e); });
  const d = HD.diff(G); $('mk').style.left = (50 + d * (45 / G.win)) + '%';
  $('lbO').textContent = opp.n + ' · ' + O.dmg; $('lbY').textContent = T('Du', 'You') + ' · ' + P.dmg;
  $('bones').textContent = P.bones;
  const my = G.turn === 0 && G.over === null && !busy;
  $('dDeck').textContent = '🌲 ' + T('Wald', 'Forest') + ' (' + P.deck.length + ')'; $('dSide').textContent = '🐿️ ' + T('Eichhörnchen', 'Squirrel') + ' (' + P.side.length + ')';
  const canDraw = my && G.phase === 'draw' && !P.drew; $('dDeck').disabled = !(canDraw && P.deck.length); $('dSide').disabled = !(canDraw && P.side.length);
  $('dDeck').classList.toggle('on', canDraw); $('dSide').classList.toggle('on', canDraw);
  $('bell').disabled = !(my && G.phase === 'main');
  $('turnS').textContent = T('Runde ', 'Round ') + G.n;
  if (v3on && window.V3 && V3.ready) V3.sync({ G, tg, sac: ui.sac, opp });
}
function flash(s, l, cls) { const el = document.querySelector('.slot[data-row="' + (s === 0 ? 'pb' : 'ob') + '"][data-l="' + l + '"] .card'); if (el) el.classList.add(cls); }
async function hook(ev) {
  render();
  if (v3on && V3.ready) V3.fx(ev); else if (ev.k === 'atk') flash(ev.s, ev.l, 'atk-a'); else if (ev.k === 'hit') flash(ev.s, ev.l, 'hit');
  await sleep(ev.k === 'atk' ? 300 : ev.k === 'play' ? 160 : 380);
  if (ev.k === 'die' || ev.k === 'scale') render();
}

// ---------- 3D ----------
let libP = null;
const loadJs = src => new Promise((ok, no) => { const s = document.createElement('script'); s.src = src; s.onload = ok; s.onerror = () => no(new Error(src)); document.head.appendChild(s); });
async function set3d(on) {
  try { localStorage.setItem('hd-3d', on ? '1' : '0'); } catch (e) {}
  const camping = document.body.classList.contains('incamp') && !document.body.classList.contains('ingame'), gaming = document.body.classList.contains('ingame');
  if (!on) { v3on = false; document.body.classList.remove('v3'); if (window.V3 && V3.ready) V3.show(false); $('b3d').textContent = '🧊 3D'; if (camping) showCamp(); else render(); return; }
  try {
    if (!window.THREE) await loadJs('https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js');
    if (!window.V3) await loadJs('view3d.js?v=' + Date.now());
    if (!V3.ready) V3.init($('t3d'), { onSlot: (row, l) => { if (row === 'pb') slotAction(l); }, onHover: k => { if (camp && inCamp()) setInfo(k); } });
    v3on = true; document.body.classList.add('v3'); $('b3d').textContent = '▦ 2D';
    if (camping) showCamp(); else if (gaming) { V3.attach($('t3d')); V3.setMode('board'); V3.show(true); render(); }
  } catch (e) { v3on = false; document.body.classList.remove('v3'); say(T('3D konnte nicht geladen werden (Internet?). Es bleibt bei 2D.', '3D could not be loaded. Staying in 2D.')); if (camping) showCamp(); }
}
$('b3d').onclick = () => set3d(!v3on);
addEventListener('resize', () => { if (v3on && window.V3) V3.resize(); });

// ---------- Eingabe ----------
function pileDraw(from) { if (busy || G.turn !== 0 || G.phase !== 'draw') return; const c = HD.draw(G, 0, from); if (c) { say(T('Spiele Karten aus und läute dann die Klingel.', 'Play cards, then ring the bell.')); render(); } }
$('dDeck').onclick = () => pileDraw('deck'); $('dSide').onclick = () => pileDraw('side');
$('hand').addEventListener('click', e => {
  const el = e.target.closest('.card'); if (!el || busy || G.phase !== 'main') return; const i = +el.dataset.i;
  info(G.p[0].hand[i]); ui = { sel: ui.sel === i ? null : i, sac: [] }; render();
  const c = ui.sel != null ? G.p[0].hand[ui.sel] : null;
  if (c) { if ((c.cost.o || 0) > G.p[0].bones) say(T('Dafür fehlen Knochen 🦴.', 'Not enough bones 🦴.')); else if ((c.cost.b || 0) > 0) say(T('Wähle ', 'Choose ') + c.cost.b + T(' Karte(n) als Opfer 🩸.', ' card(s) to sacrifice 🩸.')); else say(T('Wähle eine freie Bahn.', 'Choose an empty lane.')); }
});
async function slotAction(l) {
  if (busy || !G || G.turn !== 0 || ui.sel == null) return;
  const P = G.p[0], c = P.hand[ui.sel], tg = targets();
  if (tg.indexOf(l) >= 0) { busy = true; const idx = ui.sel, sac = ui.sac.slice(); ui = { sel: null, sac: [] }; await HD.play(G, 0, idx, l, sac, hook); busy = false; say(T('Weiter ausspielen oder die Klingel läuten.', 'Play more cards or ring the bell.')); render(); return; }
  if (P.board[l] && (c.cost.b || 0) > 0) { const k = ui.sac.indexOf(l); if (k >= 0) ui.sac.splice(k, 1); else ui.sac.push(l); info(P.board[l]); render(); if (targets().length) say(T('Wähle die Bahn für die neue Karte.', 'Choose the lane for the new card.')); }
}
$('pb').addEventListener('click', e => { const slot = e.target.closest('.slot'); if (slot) slotAction(+slot.dataset.l); });
function info(c) { $('info').innerHTML = c ? '<b>' + c.n + '</b> ' + c.atk + '/' + c.hp + (c.sig.length ? ' · ' + c.sig.map(s => HD.SIG[s][1] + ' <b>' + HD.SIG[s][0] + '</b>: ' + HD.SIG[s][2]).join(' · ') : '') : ''; }
document.addEventListener('mouseover', e => { const el = e.target.closest('.card'); if (!el || !G) return; const u = +el.dataset.uid; let c = null; G.p.forEach(p => [].concat(p.hand, p.board, p.queue).forEach(x => { if (x && x.uid === u) c = x; })); if (c) info(c); });
$('bell').onclick = async () => {
  if (busy || G.turn !== 0 || G.phase !== 'main') return; busy = true; ui = { sel: null, sac: [] }; render(); say(T('Angriff!', 'Attack!'));
  await HD.attack(G, 0, hook); if (finish()) return;
  HD.endTurn(G, 0); render(); await sleep(300);
  await npcTurn(); if (finish()) return;
  busy = false; beginTurn(); render();
};
async function npcTurn() {
  say(opp.n + T(' ist am Zug …', ' is playing …')); HD.startTurn(G, 1); await sleep(450);
  if (G.boss) { const n0 = G.p[0].board.filter(Boolean).length; HD.bossTurn(G); if (G.boss === 'curse') say('🧙 ' + HD.BOSS.curse[0] + '!'); render(); await sleep(600); }
  HD.advanceQueue(G, 1); render(); await sleep(450);
  await HD.attack(G, 1, hook); if (G.over !== null) return;
  HD.endTurn(G, 1); HD.fillQueue(G, 1, opp.diff); render();
}
function finish() {
  if (G.over === null) return false; busy = true; render(); done = true;
  const win = G.over === 0; $('ovT').textContent = win ? T('Gewonnen! 🎉', 'You win! 🎉') : T('Verloren …', 'You lost …');
  $('ovP').textContent = win ? T('Die Waage kippt auf deine Seite.', 'The scale tips to your side.') : T('Die Waage kippt zum Gegner.', 'The scale tips to your opponent.');
  if (fightNode && camp) {
    if (!win) { camp.c--; save(); $('ovP').textContent += ' ' + (camp.c > 0 ? T('Eine Kerze erlischt. Noch ', 'A candle goes out. ') + camp.c + T(' übrig.', ' left.') : T('Die letzte Kerze erlischt: Die Kampagne ist zu Ende.', 'The last candle goes out: the campaign is over.')); }
    $('ovB').textContent = win ? T('Weiter', 'Continue') : (camp.c > 0 ? T('Nochmal versuchen', 'Try again') : T('Kampagne beenden', 'End campaign'));
    $('ovM').style.display = win || camp.c <= 0 ? 'none' : '';
  } else { $('ovB').textContent = T('Nochmal', 'Again'); $('ovM').style.display = ''; }
  $('ovM').textContent = T('Zur Karte', 'To the map'); $('ov').classList.add('show'); return true;
}
$('ovB').onclick = async () => {
  $('ov').classList.remove('show');
  if (fightNode && camp) {
    const win = G.over === 0;
    if (win) { await reward(fightNode.t !== 'fight'); await completeNode(); return; }
    if (camp.c <= 0) { store.del(KEY); camp = null; fightNode = null; G = null; document.body.classList.remove('incamp'); toMenu(); return; }
    startDuel(opp, camp.deck.slice()); return;
  }
  startDuel(opp, STARTER.map(id => ({ id, a: 0, h: 0 })));
};
$('ovM').onclick = () => toMenu();
$('bMenu').onclick = () => { if (!done && !confirm(T('Kampf abbrechen? In der Kampagne geht dabei keine Kerze verloren.', 'Abort the fight? No candle is lost in the campaign.'))) return; fightNode = fightNode && camp ? fightNode : null; toMenu(); };
if (window.SITE && SITE.guard) SITE.guard(() => !!G && !done);
paintMenu(); paintBook();
let want3 = true; try { want3 = localStorage.getItem('hd-3d') !== '0'; } catch (e) {}
if (want3) set3d(true);
window.__hdReady = true;
window.HDUI = { get G() { return G; }, get camp() { return camp; }, startDuel, set3d, AREAS };
})();
</script>
