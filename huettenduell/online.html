<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Hüttenduell online</title>
<link rel="stylesheet" href="../common.css">
<link rel="stylesheet" href="hd.css">
<script src="../theme.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.2/peerjs.min.js"></script>
<script>window.Peer||document.write('<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"><\/script>')</script>
<script src="../net-config.js"></script>
<script src="../net.js"></script>
<script src="../mplobby.js"></script>
<script src="../hostkit.js"></script>
<style>
.wrap{max-width:1300px}
#ohand{display:flex;gap:4px;justify-content:center;min-height:22px;margin:0 0 4px}
#ohand i{width:16px;height:23px;border-radius:3px;background:linear-gradient(160deg,#6a4a2a,#3a2410);border:1px solid #1a0f06;display:block}
.hdr .stat.turn{border-color:#ffd23f;color:#ffd23f}
.ps{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 8px;border-radius:10px;border:2px solid transparent}
.ps.turn{border-color:#ffd23f;background:rgba(255,210,63,.12)}.ps small{color:var(--muted)}.ps b{font-size:1.2rem}
body #game:not([hidden]){display:block}
#t2d.myturn,#t3d.myturn{border-color:#ffd23f;box-shadow:0 0 0 3px rgba(255,210,63,.35)}
#dkOv{position:fixed;inset:0;z-index:960;display:none;place-items:center;background:rgba(5,5,10,.82);padding:12px}
#dkOv.show{display:grid}
#dkOv .box{background:var(--card);border:1px solid var(--border);border-top:3px solid var(--accent);border-radius:16px;padding:20px;text-align:center;max-width:420px}
#dkOv .box h2{margin:0 0 6px}#dkOv .box p{margin:0 0 12px;color:var(--muted);font-size:.9rem}#dkOv .box .btn{display:block;width:100%;margin-top:8px}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><a class="back" href="../">← Spiele</a><h1 id="ttl"></h1></div>
  <div id="setup" class="panel"></div>
  <div id="game" hidden>
    <div class="hk-layout">
      <div class="hk-main">
        <div id="hkBanner"></div>
        <div id="hkStatus"></div>
        <div class="hdr">
          <div class="scale"><div class="track"><div class="zero"></div><div class="mk" id="mk"></div></div><div class="lb"><span id="lbO"></span><span id="lbY"></span></div></div>
          <span class="stat">🦴 <b id="bones">0</b></span>
          <button class="btn alt" id="b3d">🧊 3D</button>
        </div>
        <div id="t3d"></div>
        <div class="table" id="t2d">
          <div class="row q" id="oq"></div>
          <div class="row" id="ob"></div>
          <div class="mid"></div>
          <div class="row" id="pb"></div>
        </div>
        <div id="ohand"></div>
        <div class="msg" id="msg"></div>
        <div class="piles"><button class="pile" id="dDeck"></button><button class="pile" id="dSide"></button></div>
        <div class="hand" id="hand"></div>
        <div class="bar"><button class="btn bell" id="bell">🔔</button></div>
        <div id="items"></div>
        <div id="info"></div>
      </div>
      <div class="hk-side">
        <div class="panel"><div id="scores"></div><div id="sinfo" style="margin-top:8px;color:var(--muted);font-size:.88rem"></div></div>
        <div class="panel"><div id="hkLog"></div></div>
        <details class="panel rules"><summary><b id="rulesT"></b></summary><div id="rulesSide"></div></details>
        <div style="display:flex;gap:8px"><button class="btn alt" id="snd" style="flex:1"></button><button class="btn alt" id="again" style="flex:1"></button></div>
      </div>
    </div>
  </div>
</div>
<div id="dkOv"><div class="box"><h2 id="dkT"></h2><p id="dkP"></p><div id="dkB"></div></div></div>
<script src="engine.js"></script>
<script>
const $ = id => document.getElementById(id);
const T = (d, e) => SITE.T(d, e), L2 = HK.L2, esc = HK.esc, tx = HK.tx;
const TT = 'Hüttenduell'; document.title = TT + ' online'; $('ttl').textContent = TT + ' · ' + T('Mehrspieler', 'Multiplayer');
const STARTER = ['stoat', 'wolf_cub', 'frog', 'adder', 'raven', 'elk_fawn', 'porcupine', 'mole', 'mantis', 'warren', 'wolf', 'hound', 'cat', 'goat', 'otter'];
const RULES = () => `<ul>
<li>${T('Zwei Spieler, je vier Bahnen. Jede Runde ziehst du eine Karte aus dem Wald oder ein Eichhörnchen.', 'Two players, four lanes each. Each turn you draw a card from the forest or a squirrel.')}</li>
<li>${T('Karten kosten Opfer 🩸 (eigene Karten vom Feld) oder Knochen 🦴 (entstehen, wenn Karten sterben).', 'Cards cost sacrifices 🩸 (your cards on the field) or bones 🦴 (created when cards die).')}</li>
<li>${T('Mit der Klingel 🔔 greifen alle deine Karten an: Gegenüber trifft eine Karte, sonst geht der Schaden auf die Waage.', 'The bell 🔔 makes all your cards attack: the card opposite is hit, otherwise the damage goes to the scale.')}</li>
<li>${T('Wer die Waage um die eingestellte Punktzahl (5) auf seine Seite bringt, verliert das gegnerische Leben: Jeder hat zwei Leben (Kerzen). Dann beginnt eine neue Runde: Das Feld wird geräumt (ohne Knochen), Hand und Knochen bleiben, beide ziehen 3 Karten und 1 Eichhörnchen, der Verlierer erhält den Großen Rauch und beginnt.', 'Whoever tips the scale by the chosen number of points (5) takes a life from the other: everyone has two lives (candles). Then a new round starts: the field is cleared (no bones), hand and bones stay, both draw 3 cards and 1 squirrel, the loser gets the Great Smoke and starts.')}</li>
<li>${T('Im ersten Zug jedes Spielers (und nach einem verlorenen Leben) zählen höchstens 3 Punkte auf der Waage.', 'In each player’s first turn (and after a lost life) at most 3 points count on the scale.')}</li>
<li>${T('Wer genau 4 Punkte im Rückstand ist, erhält einen Gegenstand (Zange, Schere, Sanduhr, Harpyienfächer, Angelhaken, Elsternlupe, Flaschen, Sparschwein). Gegenstände benutzt du jederzeit in deinem Zug.', 'Whoever is behind by exactly 4 gets an item (pliers, scissors, hourglass, harpy fan, fish hook, magpie lens, bottles, piggy bank). Use items any time on your turn.')}</li></ul>`;
$('setup').innerHTML = `<h2>🕯️ ${T('Hüttenduell: Duell', 'Hut Duel: duel')}</h2>
<p style="margin:0 0 10px;color:var(--muted)">${T('Das Opfer-Kartenspiel für zwei Spieler. Gegen den Computer oder online. Jeder wählt vor dem Start sein Deck.', 'The sacrifice card game for two. Against the computer or online. Everyone chooses a deck before the start.')}</p>
<div class="row"><label for="nopp">${T('Computer-Gegner', 'Computer opponent')}</label><select id="nopp"><option value="1" selected>1</option></select></div>
<div class="row"><label for="win">${T('Sieg bei Vorsprung', 'Win at lead')}</label><select id="win"><option value="3">3</option><option value="5" selected>5</option><option value="7">7</option></select></div>
<div class="row"><button class="btn" id="start">${T('Spielen', 'Play')}</button><button class="btn alt" id="online">🌐 ${T('Online spielen', 'Play online')}</button><button class="btn alt" id="rejoinBtn" hidden>↩ ${T('Wieder ins laufende Spiel', 'Back into the running game')}</button><a class="btn alt" href="./" style="text-decoration:none">🗺️ ${T('Zur Kampagne', 'To the campaign')}</a></div>
<details class="rules" style="margin-top:14px"><summary><b>${T('Regeln', 'Rules')}</b></summary>${RULES()}</details>`;
$('rulesT').textContent = T('Regeln', 'Rules'); $('rulesSide').innerHTML = RULES(); $('again').textContent = T('Zur Auswahl', 'Back to menu'); $('bell').textContent = '🔔 ' + T('Angriff', 'Attack');
const readOpts = () => ({ win: +$('win').value });
let K, V = null, inp = null, sel = null, sac = [], v3on = false, hintTxt = '';

// ---------- Decks ----------
function cleanDeck(d) {
  if (!Array.isArray(d) || d.length < 8 || d.length > 40) return null; const out = [], SIGS = HD.SIG;
  for (const x of d) {
    const o = typeof x === 'string' ? { id: x } : x; if (!o || typeof o.id !== 'string' || !HD.CARDS[o.id]) return null;
    const a = Math.max(0, Math.min(3, o.a | 0)), h = Math.max(0, Math.min(3, o.h | 0));
    if (o.id === 'death') { const dc = o.dc; if (!dc || typeof dc.n !== 'string' || !Array.isArray(dc.sig) || dc.sig.length > 2 || dc.sig.some(k => !SIGS[k] || k === 'fledge') || !(dc.atk >= 0 && dc.atk <= 4) || !(dc.hp >= 1 && dc.hp <= 7)) return null; out.push({ id: 'death', a, h, dc: { n: dc.n.slice(0, 40), atk: dc.atk | 0, hp: dc.hp | 0, sig: dc.sig.slice(), art: String(dc.art || '💀').slice(0, 8), cost: { b: Math.max(0, Math.min(3, (dc.cost && dc.cost.b) | 0)), o: Math.max(0, Math.min(6, (dc.cost && dc.cost.o) | 0)) } } }); }
    else if (HD.TOKENS[o.id]) return null; else out.push({ id: o.id, a, h });
  }
  return out;
}
const starterDeck = () => STARTER.map(id => ({ id, a: 0, h: 0 }));
function randomDeck() { const ids = Object.keys(HD.CARDS).filter(i => !HD.TOKENS[i]); return HK.shuffle(ids).slice(0, 15).map(id => ({ id, a: 0, h: 0 })); }
function pickDeck() {
  return new Promise(res => {
    let cd = null; try { cd = JSON.parse(localStorage.getItem('hd-camp-v2') || 'null'); } catch (e) {}
    $('dkT').textContent = T('Dein Deck', 'Your deck'); $('dkP').textContent = T('Wähle das Deck für dieses Duell.', 'Choose the deck for this duel.'); const B = $('dkB'); B.innerHTML = '';
    const add = (t, f) => { const b = document.createElement('button'); b.className = 'btn'; b.textContent = t; b.onclick = () => { $('dkOv').classList.remove('show'); res({ deck: f() }); }; B.appendChild(b); };
    add('🃏 ' + T('Standard-Deck', 'Standard deck') + ' (' + STARTER.length + ')', starterDeck);
    if (cd && cd.deck && cd.deck.length >= 8) add('🗺️ ' + T('Mein Kampagnen-Deck', 'My campaign deck') + ' (' + cd.deck.length + ')', () => cd.deck);
    add('🎲 ' + T('Zufallsdeck (15 Karten)', 'Random deck (15 cards)'), randomDeck);
    $('dkOv').classList.add('show');
  });
}

// ---------- Regeln (Host) ----------
function view(g, s) {
  const names = g.seats.map(x => x.name), log = K.logFor(s);
  if (!g.p || g.p.length < 2) return { wait: true, me: s, names, log, over: null };
  const me = s < 0 ? 0 : s, op = 1 - me;
  const strip = (P, own) => ({ deck: new Array(P.deck.length).fill(0), side: new Array(P.side.length).fill(0), hand: own ? P.hand : P.hand.map(() => 0), board: P.board, queue: P.queue, bones: P.bones, dmg: P.dmg, drew: P.drew, lives: P.lives, items: own ? P.items : P.items.map(() => 0), first: P.first });
  return { p: [strip(g.p[me], s >= 0), strip(g.p[op], false)], cur: g.turn, n: g.n, phase: g.phase, over: g.over === null ? null : (g.over === me ? 0 : 1), win: g.win, names: [names[me], names[op]], types: [g.seats[me].type, g.seats[op].type], me: s, mySeat: me, log };
}
function valid(spec, a, g, p) {
  if (spec.k === 'deck') return !!(a && cleanDeck(a.deck));
  if (spec.k !== 'turn' || !a) return false;
  if (a.t === 'draw') return g.turn === p && g.phase === 'draw' && !g.p[p].drew && (a.from === 'deck' || a.from === 'side');
  if (a.t === 'play') return Number.isInteger(a.i) && Number.isInteger(a.lane) && Array.isArray(a.sac) && a.sac.every(Number.isInteger) && new Set(a.sac).size === a.sac.length && !HD.check(g, p, a.i, a.lane, a.sac);
  if (a.t === 'end') return g.turn === p && g.phase === 'main';
  if (a.t === 'item') {
    const id = g.p[p].items[a.idx]; if (!id || g.turn !== p || (g.phase !== 'main' && g.phase !== 'draw')) return false; const k = HD.ITEMS[id][3], O = g.p[1 - p];
    if (k === 'e') return Number.isInteger(a.l) && !!O.board[a.l];
    if (k === 'h') return Number.isInteger(a.l) && Number.isInteger(a.to) && !!O.board[a.l] && a.to >= 0 && a.to < 4 && !g.p[p].board[a.to];
    return true;
  }
  return false;
}
async function chooseDecks() {
  const g = K.G, mine = starterDeck();
  const decks = await Promise.all(g.seats.map((s, q) => s.type === 'cpu' ? Promise.resolve(randomDeck()) : K.ask(q, { k: 'deck' }, () => mine).then(a => (a && a.deck && cleanDeck(a.deck)) || cleanDeck(a) || mine)));
  const ng = HD.newGame({ decks, npc: false, win: g.opts.win, lives: 2 });
  g.p = ng.p; g.n = 0; g.over = null; g.win = ng.win; g.turn = 0; g.boss = null; g.itemPile = ng.itemPile; g.lastDiff = 0; g.npc = false; HD.startTurn(g, HK.rnd(2));
  K.say(-1, L2('Die Karten sind gemischt. ' + K.nm(g.turn) + ' beginnt.', 'The cards are shuffled. ' + K.nm(g.turn) + ' starts.')); K.push();
}
async function main() {
  const g = K.G; HD.sync(g);
  const hook = async ev => { K.fx({ k: 'ev', ev }); K.push(); await K.sleep(ev.k === 'atk' ? 300 : ev.k === 'play' ? 160 : 380); };
  while (!HD.matchOver(g)) {
    if (g.over !== null) { await nextRound(); continue; }
    const p = g.turn;
    if (g.phase !== 'attack') {
      for (let guard = 0; guard < 120 && g.over === null; guard++) {
        K.snap('turn'); K.push();
        if (g.seats[p].type === 'cpu') { await K.sleep(600); await HD.botPlay(g, p, hook); break; }
        const a = await K.ask(p, { k: 'turn', st: g.phase }, () => ({ t: 'bot' }));
        if (!a || a.t === 'bot') { await HD.botPlay(g, p, hook); break; }
        if (a.t === 'draw') { HD.draw(g, p, a.from); K.say(p, L2(K.nm(p) + ' zieht eine Karte.', K.nm(p) + ' draws a card.'), L2('Du ziehst eine Karte.', 'You draw a card.')); K.sfx('take'); continue; }
        if (a.t === 'play') { const c = g.p[p].hand[a.i]; const nm = c ? c.n : '?'; await HD.play(g, p, a.i, a.lane, a.sac, hook); K.say(p, L2(K.nm(p) + ' spielt ' + nm + '.', K.nm(p) + ' plays ' + nm + '.'), L2('Du spielst ' + nm + '.', 'You play ' + nm + '.')); K.sfx('lay'); continue; }
        if (a.t === 'item') { const id = g.p[p].items[a.idx], nm = id ? HD.ITEMS[id][0] : '?'; HD.useItem(g, p, a.idx, a); K.say(p, L2(K.nm(p) + ' benutzt ' + nm + '.', K.nm(p) + ' uses ' + nm + '.'), L2('Du benutzt ' + nm + '.', 'You use ' + nm + '.')); K.sfx('lay'); continue; }
        break;
      }
      if (g.over === null) { K.say(-1, L2(K.nm(p) + ' läutet die Klingel.', K.nm(p) + ' rings the bell.')); await HD.attack(g, p, hook); }
    }
    if (g.over !== null) continue;
    HD.endTurn(g, p); const nx = 1 - p;
    if (g.p[nx].skip) { g.p[nx].skip = false; K.say(-1, L2(K.nm(nx) + ' muss aussetzen (Sanduhr).', K.nm(nx) + ' has to skip (hourglass).')); HD.startTurn(g, p); } else HD.startTurn(g, nx);
    K.push();
  }
  const w = g.over; K.push(); K.sfx('win');
  const again = await K.vote(q => ({ ico: '🏆', title: q === w ? L2('Du hast gewonnen!', 'You won!') : L2(g.seats[w].name + ' gewinnt!', g.seats[w].name + ' wins!'), html: L2('Beide Kerzen von ' + esc(g.seats[1 - w].name) + ' sind erloschen.<br><br><b>Abstimmung:</b> Noch eine Partie?', esc(g.seats[1 - w].name) + ' has no candles left.<br><br><b>Vote:</b> play again?'), btns: [L2('Nochmal spielen', 'Play again'), L2('Beenden', 'Quit')] }));
  if (again) startGame(g.seats.map(s => ({ type: s.type, name: s.name, seat: s.seat, orig: s.orig, away: s.away })), g.opts); else K.exit(false);
}
async function nextRound() {
  const g = K.G, w = g.over, l = 1 - w; K.sfx('bad'); K.push();
  await K.dlgAll(q => ({ ico: '🕯️', title: q === l ? L2('Eine Kerze erlischt', 'A candle goes out') : q === w ? L2('Du gewinnst die Runde!', 'You win the round!') : L2(g.seats[l].name + ' verliert ein Leben', g.seats[l].name + ' loses a life'), html: L2(esc(g.seats[l].name) + ' hat noch <b>' + g.p[l].lives + '</b> Kerze(n). Neue Runde: ' + esc(g.seats[l].name) + ' beginnt und erhält den Großen Rauch.', esc(g.seats[l].name) + ' has <b>' + g.p[l].lives + '</b> candle(s) left. New round: ' + esc(g.seats[l].name) + ' starts and gets the Great Smoke.'), btns: [L2('Weiter', 'Continue')] }), 0);
  HD.newRound(g); K.say(-1, L2('Neue Runde. ' + K.nm(g.turn) + ' beginnt.', 'New round. ' + K.nm(g.turn) + ' starts.')); K.push();
}
function startGame(seats, opts) {
  K.reset(); K.G = { seats, opts, log: [], p: [], turn: 0, n: 0, phase: 'draw', over: null, win: opts.win }; K.push();
  K.run(async () => { await chooseDecks(); await main(); });
}

// ---------- Anzeige ----------
const costHtml = c => { let s = ''; for (let i = 0; i < (c.cost.b || 0); i++) s += '🩸'; if (c.cost.o) s += (s ? '<br>' : '') + '🦴' + (c.cost.o > 1 ? '×' + c.cost.o : ''); return s; };
function cardEl(c, cls) {
  const d = document.createElement('div'); d.className = 'card ' + (cls || '') + (c.sub ? ' sub' : ''); d.dataset.uid = c.uid;
  d.innerHTML = '<div class="nm">' + esc(c.n) + '</div><div class="cost">' + costHtml(c) + '</div><div class="art">' + c.art + '</div><div class="atk">' + c.atk + '</div><div class="hp' + (c.hp < c.max ? ' dmg' : '') + '">' + c.hp + '</div><div class="sg">' + c.sig.map(s => HD.SIG[s][1]).join('') + (c.lives > 1 ? '×' + c.lives : '') + '</div>';
  return d;
}
function slotEl(row, l, c, cls) { const s = document.createElement('div'); s.className = 'slot'; s.dataset.l = l; s.dataset.row = row; if (c) s.appendChild(cardEl(c, cls)); return s; }
const pseudo = v => ({ p: v.p, turn: 0, phase: v.phase, over: null, win: v.win });
let itm = null;      // gewählter Gegenstand mit Ziel: { idx, l }
function itemTargets() {
  if (!itm || !V || V.wait) return { o: [], p: [] }; const id = V.p[0].items[itm.idx]; if (!id) return { o: [], p: [] }; const k = HD.ITEMS[id][3], o = [], p = [];
  if (k === 'e' || (k === 'h' && itm.l == null)) V.p[1].board.forEach((c, l) => { if (c) o.push(l); }); if (k === 'h' && itm.l != null) V.p[0].board.forEach((c, l) => { if (!c) p.push(l); }); return { o, p };
}
function paintItems() {
  const el = $('items'); const P = V.p[0], can = myTurn();
  el.innerHTML = P.items.length ? '<span class="il">' + T('Gegenstände', 'Items') + ':</span>' + P.items.map((id, i) => id ? '<button class="itm' + (itm && itm.idx === i ? ' on' : '') + '" data-i="' + i + '"' + (can ? '' : ' disabled') + ' title="' + HD.ITEMS[id][2] + '">' + HD.ITEMS[id][1] + ' ' + HD.ITEMS[id][0] + '</button>' : '').join('') : '';
}
$('items').addEventListener('click', e => {
  const b = e.target.closest('.itm'); if (!b || !myTurn()) return; const i = +b.dataset.i, id = V.p[0].items[i], k = HD.ITEMS[id][3];
  if (k) { itm = itm && itm.idx === i ? null : { idx: i, l: null }; hintTxt = itm ? (k === 'h' ? T('Wähle die gegnerische Karte, die du dir holst.', 'Choose the enemy card to take.') : T('Wähle das Ziel.', 'Choose the target.')) : ''; sel = null; sac = []; K.apply(); return; }
  answer({ t: 'item', idx: i });
});
function oppSlotAction(l) {
  if (!itm || !myTurn()) return; const t = itemTargets(); if (t.o.indexOf(l) < 0) return; const id = V.p[0].items[itm.idx];
  if (HD.ITEMS[id][3] === 'h') { itm.l = l; hintTxt = T('Wähle eine freie Bahn auf deiner Seite.', 'Choose an empty lane on your side.'); K.apply(); return; }
  const a = { t: 'item', idx: itm.idx, l }; answer(a);
}
$('ob').addEventListener('click', e => { const sl = e.target.closest('.slot'); if (sl) oppSlotAction(+sl.dataset.l); });
const myTurn = () => !!(V && !V.wait && inp && V.cur === V.mySeat && V.over === null);
function targets() {
  if (!myTurn() || sel == null || inp.st !== 'main') return []; const P = V.p[0], c = P.hand[sel], r = []; if (!c) return r;
  const need = c.cost.b || 0; let got = 0; sac.forEach(l => got += HD.has(P.board[l], 'worthy') ? 3 : 1); if (got < need) return r;
  const Gv = pseudo(V); for (let l = 0; l < 4; l++) if (!HD.check(Gv, 0, sel, l, sac)) r.push(l); return r;
}
function render(v, prev) {
  V = v; $('setup').hidden = true; $('game').hidden = false;
  if (v.wait) { $('hkBanner').className = ''; $('hkBanner').textContent = T('⏳ Die Decks werden gewählt …', '⏳ Decks are being chosen …'); $('hkLog').innerHTML = v.log.slice(0, 50).map(l => `<div>${esc(tx(l))}</div>`).join(''); return; }
  HD.refresh({ p: v.p });
  const P = v.p[0], O = v.p[1], mine = myTurn(), tg = targets(), c = sel != null ? P.hand[sel] : null, needSac = c && (c.cost.b || 0) > 0 && tg.length === 0 && mine;
  const fillRow = (id, row, arr, cls, own) => { const el = $(id); el.innerHTML = ''; for (let l = 0; l < 4; l++) { const s = slotEl(row, l, arr[l], cls); if (own) { if (tg.indexOf(l) >= 0) s.classList.add('tgt'); const cd = s.firstChild; if (cd) { if (sac.indexOf(l) >= 0) cd.classList.add('sac'); if (needSac) cd.classList.add('ok'); } } el.appendChild(s); } };
  fillRow('oq', 'oq', O.queue, 'opp', false); fillRow('ob', 'ob', O.board, 'opp', false); fillRow('pb', 'pb', P.board, '', true);
  $('hand').innerHTML = ''; P.hand.forEach((cd, i) => { if (!cd) return; const e = cardEl(cd, 'ok' + (i === sel ? ' sel' : '')); e.dataset.i = i; $('hand').appendChild(e); });
  $('ohand').innerHTML = O.hand.map(() => '<i></i>').join('');
  const d = P.dmg - O.dmg; $('mk').style.left = (50 + d * (45 / v.win)) + '%'; $('lbO').textContent = v.names[1] + ' · ' + O.dmg; $('lbY').textContent = (v.me < 0 ? v.names[0] : T('Du', 'You')) + ' · ' + P.dmg; $('bones').textContent = P.bones;
  const canDraw = mine && inp.st === 'draw'; $('dDeck').textContent = '🌲 ' + T('Wald', 'Forest') + ' (' + P.deck.length + ')'; $('dSide').textContent = '🐿️ ' + T('Eichhörnchen', 'Squirrel') + ' (' + P.side.length + ')';
  $('dDeck').disabled = !(canDraw && P.deck.length); $('dSide').disabled = !(canDraw && P.side.length); $('dDeck').classList.toggle('on', canDraw); $('dSide').classList.toggle('on', canDraw); $('bell').disabled = !(mine && inp.st === 'main');
  const b = $('hkBanner');
  if (v.over !== null) { b.className = ''; b.textContent = v.over === 0 ? (v.me < 0 ? '🏆 ' + v.names[0] + T(' gewinnt!', ' wins!') : T('🏆 Du gewinnst!', '🏆 You win!')) : '🏆 ' + v.names[1] + T(' gewinnt!', ' wins!'); }
  else if (mine) { b.className = 'me'; b.textContent = inp.st === 'draw' ? T('▶ DU BIST DRAN: Ziehe eine Karte', '▶ YOUR TURN: draw a card') : T('▶ DU BIST DRAN: Karten ausspielen, dann Klingel', '▶ YOUR TURN: play cards, then ring the bell'); }
  else { b.className = ''; const who = v.cur === v.mySeat ? v.names[0] : v.names[1]; b.textContent = T('⏳ ' + who + ' ist dran', '⏳ ' + who + "'s turn"); }
  document.title = mine ? T('▶ Du bist dran! – ', '▶ Your turn! – ') + TT : TT + ' online';
  if (mine && !(prev && !prev.wait && prev.cur === v.cur && inp && prev.phase === v.phase && 0)) {}
  $('hkStatus').textContent = hintTxt || (v.log[0] ? tx(v.log[0]) : '');
  $('hkLog').innerHTML = v.log.slice(1, 50).map(l => `<div>${esc(tx(l))}</div>`).join('');
  $('scores').innerHTML = [[0, P], [1, O]].map(([i, Q]) => `<div class="ps${(i === 0) === (v.cur === v.mySeat) && v.over === null ? ' turn' : ''}"><span>${i === 0 && v.me >= 0 ? T('Du', 'You') : esc(v.names[i])}${v.types[i] === 'cpu' ? ' 🤖' : ''}<br><small>${Q.hand.length} ${T('Handkarten', 'cards in hand')} · 🦴 ${Q.bones}${Q.items.length ? ' · 🎒 ' + Q.items.length : ''} · ${'🕯️'.repeat(Math.max(0, Q.lives))}</small></span><b>${Q.dmg}</b></div>`).join('');
  $('sinfo').textContent = T('Runde ', 'Round ') + v.n + T(' · Sieg ab ', ' · win at ') + v.win;
  paintItems(); { const it = itemTargets(); [...$('ob').children].forEach(sl => { if (it.o.indexOf(+sl.dataset.l) >= 0) sl.classList.add('tgt'); }); [...$('pb').children].forEach(sl => { if (it.p.indexOf(+sl.dataset.l) >= 0) sl.classList.add('tgt'); }); }
  $('t2d').classList.toggle('myturn', mine); $('t3d').classList.toggle('myturn', mine);
  if (v3on && window.V3 && V3.ready) { const it = itemTargets(); V3.sync({ G: pseudo(v), tg: tg.concat(it.p), tgo: it.o, sac, opp: { icon: '🧑' } }); }
}
function fx(d) {
  if (!d || d.k !== 'ev' || !V || V.wait) return; const ev = d.ev, s = V.me < 0 ? (ev.s === 0 ? 0 : 1) : (ev.s === V.me ? 0 : 1), e2 = Object.assign({}, ev, { s });
  if (v3on && window.V3 && V3.ready) V3.fx(e2); else { const el = document.querySelector('.slot[data-row="' + (s === 0 ? 'pb' : 'ob') + '"][data-l="' + ev.l + '"] .card'); if (el) el.classList.add(ev.k === 'atk' ? 'atk-a' : ev.k === 'hit' ? 'hit' : ''); }
}
// ---------- Eingabe ----------
function ui(spec) {
  return new Promise(res => {
    if (spec.k === 'deck') { pickDeck().then(res); return; }
    if (spec.k === 'turn') { inp = { res, st: spec.st }; sel = null; sac = []; hintTxt = ''; K.apply(); } else res(null);
  });
}
function answer(a) { if (!inp) return; const r = inp.res; inp = null; sel = null; sac = []; itm = null; hintTxt = ''; K.apply(); r(a); }
$('dDeck').onclick = () => { if (inp && inp.st === 'draw') answer({ t: 'draw', from: 'deck' }); };
$('dSide').onclick = () => { if (inp && inp.st === 'draw') answer({ t: 'draw', from: 'side' }); };
$('bell').onclick = () => { if (inp && inp.st === 'main') answer({ t: 'end' }); };
$('hand').addEventListener('click', e => {
  const el = e.target.closest('.card'); if (!el || !inp || inp.st !== 'main') return; const i = +el.dataset.i; sel = sel === i ? null : i; sac = []; K.apply();
  const c = sel != null ? V.p[0].hand[sel] : null; if (c) { hintTxt = (c.cost.o || 0) > V.p[0].bones ? T('Dafür fehlen Knochen 🦴.', 'Not enough bones 🦴.') : (c.cost.b || 0) > 0 ? T('Wähle ' + c.cost.b + ' Karte(n) als Opfer 🩸.', 'Choose ' + c.cost.b + ' card(s) to sacrifice 🩸.') : T('Wähle eine freie Bahn.', 'Choose an empty lane.'); K.apply(); }
});
function slotAction(l) {
  if (itm && itm.l != null && myTurn()) { if (itemTargets().p.indexOf(l) >= 0) answer({ t: 'item', idx: itm.idx, l: itm.l, to: l }); return; }
  if (!myTurn() || inp.st !== 'main' || sel == null) return; const P = V.p[0], c = P.hand[sel];
  if (targets().indexOf(l) >= 0) { answer({ t: 'play', i: sel, lane: l, sac: sac.slice() }); return; }
  if (P.board[l] && (c.cost.b || 0) > 0) { const k = sac.indexOf(l); if (k >= 0) sac.splice(k, 1); else sac.push(l); hintTxt = targets().length ? T('Wähle die Bahn für die neue Karte.', 'Choose the lane for the new card.') : ''; K.apply(); }
}
$('pb').addEventListener('click', e => { const s = e.target.closest('.slot'); if (s) slotAction(+s.dataset.l); });
function info(c) { $('info').innerHTML = c ? '<b>' + esc(c.n) + '</b> ' + c.atk + '/' + c.hp + (c.sig.length ? ' · ' + c.sig.map(s => HD.SIG[s][1] + ' <b>' + HD.SIG[s][0] + '</b>: ' + HD.SIG[s][2]).join(' · ') : '') : ''; }
document.addEventListener('mouseover', e => { const el = e.target.closest('.card'); if (!el || !V || V.wait) return; const u = +el.dataset.uid; let c = null; V.p.forEach(p => [].concat(p.hand, p.board, p.queue).forEach(x => { if (x && x.uid === u) c = x; })); if (c) info(c); });
// ---------- 3D ----------
const loadJs = src => new Promise((ok, no) => { const s = document.createElement('script'); s.src = src; s.onload = ok; s.onerror = () => no(new Error(src)); document.head.appendChild(s); });
async function set3d(on) {
  try { localStorage.setItem('hd-3d', on ? '1' : '0'); } catch (e) {}
  if (!on) { v3on = false; document.body.classList.remove('v3'); if (window.V3 && V3.ready) V3.show(false); $('b3d').textContent = '🧊 3D'; if (V) K.apply(); return; }
  try {
    if (!window.THREE) await loadJs('https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js');
    if (!window.V3) await loadJs('view3d.js?v=' + Date.now());
    if (!V3.ready) V3.init($('t3d'), { onSlot: (row, l) => { if (row === 'pb') slotAction(l); else if (row === 'ob') oppSlotAction(l); } });
    v3on = true; document.body.classList.add('v3'); $('b3d').textContent = '▦ 2D'; V3.attach($('t3d')); V3.setMode('board'); V3.show(true); setTimeout(() => { V3.resize(); if (V) K.apply(); }, 60);
  } catch (e) { v3on = false; document.body.classList.remove('v3'); }
}
$('b3d').onclick = () => set3d(!v3on); addEventListener('resize', () => { if (v3on && window.V3) V3.resize(); });
K = HK.init({
  spectators: true, prefix: 'hdl-v1-', title: L2('Hüttenduell', 'Hut Duel'), minPlayers: 2, timeoutMs: 120000,
  seats: [{ name: '1', color: '#c9a24e' }, { name: '2', color: '#b5523a' }], cpuNames: ['Moorgeist', 'Der Köhler'],
  view, valid, render, ui, fx,
  cancelUi() { inp = null; K.apply(); },
  start: s => startGame(s, readOpts()),
  resume() { K.run(async () => { if (!K.G.p || K.G.p.length < 2) await chooseDecks(); await main(); }); },
  onGame() { $('setup').hidden = true; $('game').hidden = false; document.body.classList.add('ingame'); let w = true; try { w = localStorage.getItem('hd-3d') !== '0'; } catch (e) {} if (w && !v3on) set3d(true); },
  onSetup() { inp = null; sel = null; sac = []; $('game').hidden = true; $('setup').hidden = false; document.body.classList.remove('ingame'); document.title = TT + ' online'; }
});
K.sndBtn($('snd'));
$('start').onclick = () => K.startLocal(+$('nopp').value);
$('again').onclick = () => K.exit(true);
</script>
