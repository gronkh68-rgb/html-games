<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Puzzle</title>
<link rel="stylesheet" href="../common.css">
<script src="../theme.js"></script>
<style>
html,body{overscroll-behavior:none}
.wrap{max-width:1300px}
body{-webkit-tap-highlight-color:transparent}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.gal button{padding:0;border:3px solid transparent;border-radius:12px;overflow:hidden;background:var(--bg);cursor:pointer;position:relative;aspect-ratio:3/2;color:#fff;font:600 .75rem system-ui}
.gal button canvas,.gal button img{width:100%;height:100%;display:block;object-fit:cover}
.gal button span{position:absolute;left:0;right:0;bottom:0;padding:3px 6px;background:rgba(0,0,0,.55);text-align:left}
.gal button.sel{border-color:var(--accent2);box-shadow:0 0 0 2px rgba(39,211,195,.35)}
.gal .up{display:grid;place-items:center;background:var(--card-hover);color:var(--text);font-size:1.6rem;gap:2px}
.gal .up small{font-size:.72rem;color:var(--muted)}
.opts{display:flex;gap:8px;flex-wrap:wrap}
.opt{font:inherit;font-weight:600;color:var(--text);background:var(--bg);border:2px solid var(--border);border-radius:12px;padding:8px 14px;cursor:pointer;transition:transform .12s,border-color .12s}
.opt:hover{transform:translateY(-2px)}
.opt.sel{border-color:var(--accent2);background:var(--card-hover)}
.opt.shape{display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 8px;font-size:.78rem}
.opt.shape canvas{width:80px;height:60px;border-radius:6px;background:#2a2f4f}
.opt small{display:block;font-weight:400;color:var(--muted);font-size:.7rem}
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.bar .grow{flex:1}
.bar .btn{padding:7px 12px;font-size:.85rem}
.pill{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:6px 12px;font-weight:700;font-variant-numeric:tabular-nums}
.prog{flex:1;min-width:90px;height:10px;border-radius:6px;background:var(--card);border:1px solid var(--border);overflow:hidden}
.prog b{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .4s}
#stage{position:relative;width:100%;height:calc(100vh - 150px);min-height:380px;border-radius:16px;overflow:hidden;border:2px solid var(--border);background:#14172a;touch-action:none;user-select:none;-webkit-user-select:none}
#stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#fx{pointer-events:none}
#hint{position:absolute;left:0;right:0;bottom:10px;text-align:center;color:rgba(255,255,255,.7);font-size:.8rem;pointer-events:none;text-shadow:0 1px 4px #000;padding:0 10px}
#loading{position:absolute;inset:0;display:grid;place-items:center;background:rgba(10,12,24,.7);color:#fff;font-weight:700}
@media (max-width:700px){#stage{height:calc(100vh - 190px)}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><a class="back" href="../">← Spiele</a><h1>Puzzle</h1></div>

  <div id="setup">
    <div class="panel"><h2>1 · Bild wählen</h2><div class="gal" id="gal"></div><input type="file" id="file" accept="image/*" hidden></div>
    <div class="panel"><h2>2 · Anzahl der Teile</h2><div class="opts" id="cntOpts"></div></div>
    <div class="panel"><h2>3 · Form der Teile</h2><div class="opts" id="shapeOpts"></div></div>
    <div class="panel"><h2>4 · Ansicht</h2>
      <div class="opts" id="modeOpts"><button class="opt" data-m="2d">🖼️ 2D<small>flach, schnell</small></button><button class="opt" data-m="3d">🧊 3D<small>Tisch mit Schatten, Kamera drehbar</small></button></div>
    </div>
    <button class="btn" id="start" style="font-size:1.1rem;padding:14px 28px">Puzzle starten</button>
  </div>

  <div id="game" hidden>
    <div class="bar">
      <button class="btn alt" id="bBack">← Auswahl</button>
      <span class="pill" id="time">00:00</span>
      <span class="pill" id="cnt">0 / 0</span>
      <div class="prog"><b id="prog"></b></div>
      <button class="btn alt" id="bView">2D / 3D</button>
      <button class="btn alt" id="bPrev">👁 Vorschau</button>
      <button class="btn alt" id="bScatter">🔀 Neu verteilen</button>
      <button class="btn alt" id="bFit">⤢ Ansicht</button>
      <button class="btn alt" id="bSnd">🔊</button>
    </div>
    <div id="stage">
      <canvas id="c2"></canvas>
      <canvas id="c3" hidden></canvas>
      <canvas id="fx"></canvas>
      <div id="hint"></div>
      <div id="loading" hidden>Puzzle wird gebaut …</div>
    </div>
  </div>
</div>

<div class="overlay" id="win" hidden><div class="box"><h2>🎉 Geschafft!</h2><p id="winTxt"></p><div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap"><button class="btn" id="again">Nochmal</button><button class="btn alt" id="newp">Neues Puzzle</button></div></div></div>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
