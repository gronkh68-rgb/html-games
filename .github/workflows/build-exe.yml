name: Windows-EXE bauen
on:
  workflow_dispatch:
  push:
    tags: ['exe-*']
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    defaults: { run: { working-directory: desktop } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install
      - run: npm run dist
      - uses: actions/upload-artifact@v4
        with: { name: HTML-Games-exe, path: desktop/dist/HTML-Games.exe }
      - name: Release mit Download-Link veröffentlichen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: exe-${{ github.run_number }}
          name: HTML Games Windows-EXE (Build ${{ github.run_number }})
          body: Lädt beim Start immer die aktuelle Version von GitHub Pages. Nur bei einer Änderung am Fenster selbst (desktop/) braucht es eine neue EXE.
          files: desktop/dist/HTML-Games.exe
