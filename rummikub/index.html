                                    }
                                    runTiles.push(uniqueTiles[i]);
                                }
                                
                                if (isConsecutive && runTiles.length >= 2) {
                                    // Add joker at end if possible
                                    const lastNum = runTiles[runTiles.length - 1].number;
                                    if (lastNum < 13) {
                                        groups.push({ tiles: [...runTiles, jokers[0]], type: 'run', points: calculatePoints([...runTiles, jokers[0]]) });
                                    }
                                    // Add joker at start if possible
                                    const firstNum = runTiles[0].number;
                                    if (firstNum > 1) {
                                        groups.push({ tiles: [jokers[0], ...runTiles], type: 'run', points: calculatePoints([jokers[0], ...runTiles]) });
                                    }
                                }
                            }
                        }
                    }
                }
            }
            
            return groups;
        }
        
        function findAdditions(hand, table) {
            const additions = [];
            
            for (let gi = 0; gi < table.length; gi++) {
                const group = table[gi];
                if (!isValidGroup(group)) continue;
                
                const nonJokers = group.filter(t => !t.isJoker);
                if (nonJokers.length === 0) continue;
                
                const colors = [...new Set(nonJokers.map(t => t.color))];
                const numbers = [...new Set(nonJokers.map(t => t.number))];
                
                for (const tile of hand) {
                    if (tile.isJoker) continue;
                    
                    if (numbers.length === 1 && group.length < 4) {
                        if (tile.number === numbers[0] && !colors.includes(tile.color)) {
                            additions.push({ tile, groupIndex: gi });
                        }
                    }
                    
                    if (colors.length === 1 && tile.color === colors[0]) {
                        const nums = nonJokers.map(t => t.number).sort((a, b) => a - b);
                        const min = nums[0];
                        const max = nums[nums.length - 1];
                        
                        if ((tile.number === min - 1 && min > 1) || 
                            (tile.number === max + 1 && max < 13)) {
                            additions.push({ tile, groupIndex: gi });
                        }
                    }
                }
            }
            
            return additions;
        }
        
        // Find tiles that can be "borrowed" from table groups
        function findBorrowableTiles(table) {
            const borrowable = [];
            
            for (let gi = 0; gi < table.length; gi++) {
                const group = table[gi];
                if (!isValidGroup(group) || group.length <= 3) continue;
                
                const nonJokers = group.filter(t => !t.isJoker);
                if (nonJokers.length === 0) continue;
                
                const colors = [...new Set(nonJokers.map(t => t.color))];
                const numbers = [...new Set(nonJokers.map(t => t.number))];
                
                // For sets (4 tiles), can borrow any one
                if (numbers.length === 1 && group.length === 4) {
                    for (const tile of nonJokers) {
                        borrowable.push({ tile, groupIndex: gi, type: 'set' });
                    }
                }
                
                // For runs, can borrow from ends
                if (colors.length === 1 && group.length > 3) {
                    const sorted = nonJokers.sort((a, b) => a.number - b.number);
                    // Can take first or last
                    borrowable.push({ tile: sorted[0], groupIndex: gi, type: 'run-start' });
                    borrowable.push({ tile: sorted[sorted.length - 1], groupIndex: gi, type: 'run-end' });
                }
            }
            
            return borrowable;
        }
        
        // Check if hand tile + borrowed tile can form something useful
        function findBorrowCombos(hand, table) {
            const combos = [];
            const borrowable = findBorrowableTiles(table);
            
            for (const borrow of borrowable) {
                const borrowedTile = borrow.tile;
                
                // Check if borrowed tile + hand tiles can form a new group
                for (const handTile of hand) {
                    if (handTile.isJoker) continue;
                    
                    // Try to form a set
                    if (handTile.number === borrowedTile.number && handTile.color !== borrowedTile.color) {
                        // Need one more for a set
                        const thirdTile = hand.find(t => 
                            !t.isJoker && 
                            t.id !== handTile.id && 
                            t.number === handTile.number && 
                            t.color !== handTile.color && 
                            t.color !== borrowedTile.color
                        );
                        
                        if (thirdTile) {
                            combos.push({
                                borrow,
                                handTiles: [handTile, thirdTile],
                                newGroup: [borrowedTile, handTile, thirdTile],
                                points: calculatePoints([handTile, thirdTile])
                            });
                        }
                    }
                    
                    // Try to form a run
                    if (handTile.color === borrowedTile.color) {
                        const diff = Math.abs(handTile.number - borrowedTile.number);
                        if (diff === 1 || diff === 2) {
                            // Look for third tile to complete run
                            let neededNum;
                            if (diff === 1) {
                                // Need one on either end
                                neededNum = handTile.number > borrowedTile.number 
                                    ? handTile.number + 1 
                                    : borrowedTile.number + 1;
                                if (neededNum > 13) {
                                    neededNum = Math.min(handTile.number, borrowedTile.number) - 1;
                                }
                            } else {
                                // Need middle
                                neededNum = Math.min(handTile.number, borrowedTile.number) + 1;
                            }
                            
                            const thirdTile = hand.find(t =>
                                !t.isJoker &&
                                t.id !== handTile.id &&
                                t.color === handTile.color &&
                                t.number === neededNum
                            );
                            
                            if (thirdTile) {
                                const newGroup = [borrowedTile, handTile, thirdTile].sort((a, b) => a.number - b.number);
                                if (isValidGroup(newGroup)) {
                                    combos.push({
                                        borrow,
                                        handTiles: [handTile, thirdTile],
                                        newGroup,
                                        points: calculatePoints([handTile, thirdTile])
                                    });
                                }
                            }
                        }
                    }
                }
                
                // Check if borrowed tile can extend a potential group in hand
                const handGroups = findValidGroups(hand);
                for (const hg of handGroups) {
                    // Would adding borrowed tile make it possible to play?
                    const combined = [...hg.tiles, borrowedTile];
                    if (isValidGroup(combined) && combined.length > hg.tiles.length) {
                        combos.push({
                            borrow,
                            handTiles: hg.tiles,
                            newGroup: sortGroup(combined),
                            points: calculatePoints(hg.tiles)
                        });
                    }
                }
            }
            
            return combos;
        }
        
        // ============ KI-HELFER ============

        // Schwierigkeit als Verhaltensprofil statt als reiner Zufall.
        function aiProfile(diff) {
            if (diff === 'easy') {
                return { maxPlays: 2, cover: 1, borrow: false, split: false,
                         skipChance: 0.35, conserve: true, endgame: false };
            }
            if (diff === 'medium') {
                return { maxPlays: 5, cover: 2, borrow: true, split: false,
                         skipChance: 0.10, conserve: true, endgame: false };
            }
            return { maxPlays: 99, cover: 3, borrow: true, split: true,
                     skipChance: 0, conserve: true, endgame: true, rearrange: true };
        }

        function countJokers(tiles) {
            let n = 0;
            for (const t of tiles) if (t.isJoker) n++;
            return n;
        }

        function realTileCount(hand) {
            return hand.filter(t => !t.separator).length;
        }

        // Wie stark haengt dieser Stein noch mit der restlichen Hand zusammen?
        // Hoher Wert = Stein wird fuer eigene Kombis gebraucht, nicht verschenken.
        function tileSynergy(tile, hand) {
            if (tile.isJoker) return 99;
            let s = 0;
            for (const other of hand) {
                if (other.separator || other.isJoker || other.id === tile.id) continue;
                if (other.number === tile.number && other.color !== tile.color) {
                    s += 2;
                } else if (other.color === tile.color) {
                    const d = Math.abs(other.number - tile.number);
                    if (d === 1) s += 2;
                    else if (d === 2) s += 1;
                }
            }
            return s;
        }

        // Waehlt aus ueberlappenden Kandidaten eine ueberschneidungsfreie Menge,
        // die scoreFn maximiert. scoreFn darf -Infinity liefern (= unzulaessig).
        function selectDisjointGroups(candidates, maxGroups, scoreFn) {
            const list = candidates.slice(0, 40);
            let best = null;
            let bestScore = -Infinity;
            const usedIds = new Set();
            const chosen = [];

            function rec(startIdx) {
                if (chosen.length > 0) {
                    const s = scoreFn(chosen);
                    if (s > bestScore) {
                        bestScore = s;
                        best = chosen.slice();
                    }
                }
                if (chosen.length >= maxGroups) return;
                for (let i = startIdx; i < list.length; i++) {
                    const g = list[i];
                    let clash = false;
                    for (const t of g.tiles) {
                        if (usedIds.has(t.id)) { clash = true; break; }
                    }
                    if (clash) continue;
                    for (const t of g.tiles) usedIds.add(t.id);
                    chosen.push(g);
                    rec(i + 1);
                    chosen.pop();
                    for (const t of g.tiles) usedIds.delete(t.id);
                }
            }

            rec(0);
            return bestScore === -Infinity ? null : best;
        }

        // Findet Runs auf dem Tisch, die mit einem Handstein geteilt werden koennen.
        // Bsp: Tisch rot 3-4-5-6-7, Hand rot 5  =>  3-4-5 + 5-6-7
        function findSplits(hand, table) {
            const out = [];
            for (let gi = 0; gi < table.length; gi++) {
                const group = table[gi];
                if (group.length < 5) continue;
                if (group.some(t => t.isJoker)) continue;

                const colors = new Set(group.map(t => t.color));
                if (colors.size !== 1) continue;

                const nums = group.map(t => t.number).sort((a, b) => a - b);
                let consecutive = true;
                for (let i = 1; i < nums.length; i++) {
                    if (nums[i] !== nums[i - 1] + 1) { consecutive = false; break; }
                }
                if (!consecutive) continue;

                const min = nums[0];
                const max = nums[nums.length - 1];

                for (const tile of hand) {
                    if (tile.separator || tile.isJoker) continue;
                    if (tile.color !== group[0].color) continue;
                    // Beide Teile muessen nach dem Split >= 3 Steine haben
                    if (tile.number < min + 2 || tile.number > max - 2) continue;
                    out.push({ tile, groupIndex: gi, splitAt: tile.number });
                }
            }
            return out;
        }

        // Liefert alle Stein-IDs, die seit dem Snapshot neu auf dem Tisch liegen.
        function collectNewTableIds(beforeIds) {
            const ids = [];
            for (const g of state.table) {
                for (const t of g) {
                    if (!beforeIds.has(t.id)) ids.push(t.id);
                }
            }
            return ids;
        }

        // ============ UMBAU-SUCHE (KI "Schwer") ============
        // Verteilt ALLE Tischsteine plus beliebige Handsteine neu auf gueltige
        // Gruppen (Runs/Saetze, inkl. Joker-Tausch) und maximiert die Zahl der
        // dabei abgelegten Handsteine. Tischsteine bleiben immer auf dem Tisch,
        // Tisch-Joker muessen wieder in einer Gruppe landen.
        // Rueckgabe: { table: [[Stein,...],...], placed: [Stein,...] } oder null.
        function findRearrangement(table, hand, budget = 120000, maxMs = 600) {
            const NT = 52;
            const typeOf = t => COLORS.indexOf(t.color) * 13 + (t.number - 1);

            const tTiles = Array.from({ length: NT }, () => []);
            const hTiles = Array.from({ length: NT }, () => []);
            const tJok = [], hJok = [];
            for (const g of table) for (const t of g) (t.isJoker ? tJok : tTiles[typeOf(t)]).push(t);
            for (const t of hand) {
                if (t.separator) continue;
                (t.isJoker ? hJok : hTiles[typeOf(t)]).push(t);
            }
            const handCount = hand.filter(t => !t.separator).length;
            if (handCount === 0) return null;

            const tRem = new Int8Array(NT), hRem = new Int8Array(NT);
            for (let t = 0; t < NT; t++) { tRem[t] = tTiles[t].length; hRem[t] = hTiles[t].length; }
            const S = { tJ: tJok.length, hJ: hJok.length };

            // Signaturen der bestehenden Gruppen (zum Bevorzugen unveraenderter Gruppen)
            const origSigs = new Set();
            for (const g of table) {
                const ty = g.filter(t => !t.isJoker).map(typeOf).sort((a, b) => a - b);
                origSigs.add(ty.join(',') + '|' + (g.length - ty.length));
            }

            const avail = t => tRem[t] + hRem[t];

            function enumerate(anchor) {
                const c = Math.floor(anchor / 13), n = (anchor % 13) + 1;
                const availJ = S.tJ + S.hJ;
                const out = [];

                const push = (kind, types, j, slots) => {
                    const size = types.length + j;
                    if (j * 2 >= size) return;           // nicht zur Haelfte Joker
                    let handUse = 0;
                    for (const t of types) if (tRem[t] <= 0) handUse++;
                    const sig = types.slice().sort((a, b) => a - b).join(',') + '|' + j;
                    const pri = (origSigs.has(sig) ? 1000000 : 0) + handUse * 1000 + size;
                    out.push({ kind, types, j, slots, pri });
                };

                // Runs, die den Anker enthalten
                for (let s = Math.max(1, n - 12); s <= n; s++) {
                    for (let e = Math.max(n, s + 2); e <= Math.min(13, s + 12); e++) {
                        const slots = [], optional = [];
                        let missing = 0, ok = true;
                        for (let p = s; p <= e; p++) {
                            const ti = c * 13 + p - 1;
                            if (p === n) slots.push(ti);
                            else if (avail(ti) > 0) { slots.push(ti); optional.push(slots.length - 1); }
                            else { slots.push(-1); missing++; if (missing > availJ) { ok = false; break; } }
                        }
                        if (!ok) continue;
                        push('run', slots.filter(x => x >= 0), missing, slots);
                        if (availJ - missing >= 1) {
                            for (const i of optional) {
                                const s2 = slots.slice(); s2[i] = -1;
                                push('run', s2.filter(x => x >= 0), missing + 1, s2);
                            }
                        }
                    }
                }

                // Saetze, die den Anker enthalten
                const others = [];
                for (let c2 = 0; c2 < 4; c2++) if (c2 !== c && avail(c2 * 13 + n - 1) > 0) others.push(c2);
                const m = others.length;
                for (let mask = 0; mask < (1 << m); mask++) {
                    const cols = [c];
                    for (let b = 0; b < m; b++) if (mask & (1 << b)) cols.push(others[b]);
                    cols.sort((a, b) => a - b);
                    const have = cols.length;
                    for (let j = Math.max(0, 3 - have); j <= Math.min(availJ, 4 - have); j++) {
                        push('set', cols.map(cc => cc * 13 + n - 1), j, null);
                    }
                }

                out.sort((a, b) => b.pri - a.pri);
                return out;
            }

            function apply(g) {
                let gain = 0;
                const rec = [];
                for (const t of g.types) {
                    if (tRem[t] > 0) { tRem[t]--; rec.push(0); }
                    else { hRem[t]--; rec.push(1); gain += 100; }
                }
                for (let k = 0; k < g.j; k++) {
                    if (S.tJ > 0) { S.tJ--; rec.push(2); }
                    else { S.hJ--; rec.push(3); gain += 30; }
                }
                return { gain, rec };
            }
            function undo(g, rec) {
                let i = 0;
                for (const t of g.types) { if (rec[i++] === 0) tRem[t]++; else hRem[t]++; }
                for (let k = 0; k < g.j; k++) { if (rec[i++] === 2) S.tJ++; else S.hJ++; }
            }

            const memo = new Map();
            let nodes = 0, aborted = false;
            const tStart = Date.now();

            function keyStr() {
                let k = '';
                for (let t = 0; t < NT; t++) k += String.fromCharCode(48 + tRem[t] * 3 + hRem[t]);
                return k + S.tJ + S.hJ;
            }
            function pickAnchor() {
                for (let t = 0; t < NT; t++) if (tRem[t] > 0) return { t, must: true };
                for (let t = 0; t < NT; t++) if (hRem[t] > 0) return { t, must: false };
                return null;
            }

            function solve() {
                if (aborted) return -Infinity;
                if ((++nodes > budget) || ((nodes & 1023) === 0 && Date.now() - tStart > maxMs)) {
                    aborted = true;
                    return -Infinity;
                }
                const key = keyStr();
                const cached = memo.get(key);
                if (cached) return cached.score;

                let best = -Infinity, choice = null;
                const a = pickAnchor();
                if (!a) {
                    best = S.tJ > 0 ? -Infinity : 0;
                } else {
                    const groups = enumerate(a.t);
                    for (let i = 0; i < groups.length; i++) {
                        const g = groups[i];
                        const ap = apply(g);
                        const v = solve();
                        undo(g, ap.rec);
                        if (v > -Infinity && ap.gain + v > best) { best = ap.gain + v; choice = { i }; }
                        if (aborted) break;
                    }
                    if (!a.must && !aborted) {
                        // Handstein bleibt liegen
                        hRem[a.t]--;
                        const v = solve();
                        hRem[a.t]++;
                        if (v > best) { best = v; choice = { skip: true }; }
                    }
                }
                memo.set(key, { score: best, choice });
                return best;
            }

            const root = solve();
            if (!(root > 0)) return null;

            // --- Loesung rekonstruieren ---
            const groupsOut = [];
            const placed = [];
            let guard = 0;
            while (guard++ < 200) {
                const m = memo.get(keyStr());
                if (!m || !m.choice) break;
                const a = pickAnchor();
                if (!a) break;
                if (m.choice.skip) { hRem[a.t]--; continue; }
                const g = enumerate(a.t)[m.choice.i];
                const ap = apply(g);
                let ri = 0;
                const typeTiles = g.types.map(t => {
                    const src = ap.rec[ri++];
                    const tile = src === 0 ? tTiles[t].shift() : hTiles[t].shift();
                    if (src === 1) placed.push(tile);
                    return tile;
                });
                const jokTiles = [];
                for (let k = 0; k < g.j; k++) {
                    const src = ap.rec[ri++];
                    const tile = src === 2 ? tJok.shift() : hJok.shift();
                    if (src === 3) placed.push(tile);
                    jokTiles.push(tile);
                }
                let arranged;
                if (g.kind === 'run') {
                    let ti = 0, ji = 0;
                    arranged = g.slots.map(sl => (sl >= 0 ? typeTiles[ti++] : jokTiles[ji++]));
                } else {
                    arranged = [...typeTiles, ...jokTiles];
                }
                groupsOut.push(arranged);
            }

            // --- Sicherheitspruefung ---
            const beforeIds = new Set();
            for (const g of table) for (const t of g) beforeIds.add(t.id);
            const afterIds = new Set();
            for (const g of groupsOut) {
                if (!isValidGroup(g)) return null;
                for (const t of g) { if (afterIds.has(t.id)) return null; afterIds.add(t.id); }
            }
            for (const id of beforeIds) if (!afterIds.has(id)) return null;
            if (placed.length === 0) return null;
            for (const t of placed) if (!afterIds.has(t.id) || beforeIds.has(t.id)) return null;
            if (afterIds.size !== beforeIds.size + placed.length) return null;

            // Bestehende Gruppen an ihrer Position lassen, neue hinten anhaengen
            const keyOf = g => g.map(t => t.id).sort((a, b) => a - b).join(',');
            const newByKey = new Map();
            for (const g of groupsOut) newByKey.set(keyOf(g), g);
            const result = [], usedKeys = new Set();
            for (const g of table) {
                const k = keyOf(g);
                if (newByKey.has(k) && !usedKeys.has(k)) { result.push(g); usedKeys.add(k); }
            }
            for (const g of groupsOut) {
                const k = keyOf(g);
                if (usedKeys.has(k)) continue;
                result.push(g);
            }
            return { table: result, placed, nodes, aborted };
        }

        async function doAITurn(playerIndex) {
            log(`KI ${playerIndex} denkt...`);
            state.aiThinking = true;

            const prof = aiProfile(state.aiDifficulty);

            // Tischzustand vor dem Zug merken (fuer die blaue Markierung)
            const tableBeforeIds = new Set();
            for (const g of state.table) for (const t of g) tableBeforeIds.add(t.id);

            render();
            await sleep(600 + Math.random() * 800);

            // Endspiel: hat ein Gegner fast keine Steine mehr? Dann alles abwerfen.
            let dumpMode = false;
            if (prof.endgame) {
                for (let i = 0; i < state.hands.length; i++) {
                    if (i === playerIndex) continue;
                    if (realTileCount(state.hands[i]) <= 3) { dumpMode = true; break; }
                }
            }

            let playedAny = false;
            let plays = 0;
            const finish = () => {
                state.playedTileIds = collectNewTableIds(tableBeforeIds);
                state.aiThinking = false;
                if (state.gameMode === 'online-host') broadcastGameState();
                render();
            };
            // true = KI hat gewonnen, Zug sofort beenden
            const checkWin = () => {
                if (realTileCount(state.hands[playerIndex]) > 0) return false;
                state.winner = playerIndex;
                finish();
                return true;
            };

            // Einmaliger Aussetzer statt Wuerfeln in jeder Runde
            const lazy = !dumpMode && Math.random() < prof.skipChance;

            while (!lazy && plays < prof.maxPlays) {
                let didSomething = false;

                // --- Strategie 0 (nur Schwer): kompletter Umbau des Tisches ---
                if (prof.rearrange && state.initialMeldMade[playerIndex] && state.table.length > 0) {
                    const rr = findRearrangement(state.table, state.hands[playerIndex]);
                    if (rr) {
                        const realPlaced = rr.placed.filter(t => !t.isJoker).length;
                        const handLeft = realTileCount(state.hands[playerIndex]);
                        // Einen einzelnen Joker nur verschenken, wenn es sich lohnt
                        if (realPlaced > 0 || dumpMode || handLeft <= 4) {
                            const placedIds = new Set(rr.placed.map(t => t.id));
                            state.hands[playerIndex] = state.hands[playerIndex].filter(t => t.separator || !placedIds.has(t.id));
                            state.table = rr.table;
                            playedAny = true;
                            log(`KI baut um: ${rr.placed.length} Steine gelegt (${rr.nodes} Knoten${rr.aborted ? ', Limit' : ''})`);
                            render();
                            await sleep(600);
                            if (checkWin()) return;
                            plays++;
                            continue;
                        }
                    }
                }

                // --- Strategie 1: Gruppen direkt aus der Hand legen ---
                const hand = state.hands[playerIndex].filter(t => !t.separator);
                const candidates = findValidGroups(hand);

                if (!state.initialMeldMade[playerIndex]) {
                    // Erstablage: >= 30 Punkte, nur aus der Hand, moeglichst
                    // wenige Steine und moeglichst ohne Joker ausgeben.
                    const combo = selectDisjointGroups(candidates, 3, sel => {
                        let pts = 0, tiles = 0, jok = 0;
                        for (const g of sel) {
                            pts += g.points;
                            tiles += g.tiles.length;
                            jok += countJokers(g.tiles);
                            // Keine Gruppe darf zur Haelfte aus Jokern bestehen
                            if (countJokers(g.tiles) * 2 >= g.tiles.length) return -Infinity;
                        }
                        if (pts < 30) return -Infinity;
                        return 1000 - tiles * 10 - jok * 120;
                    });

                    if (combo) {
                        let total = 0;
                        for (const g of combo) {
                            total += g.points;
                            state.hands[playerIndex] = state.hands[playerIndex].filter(
                                t => !g.tiles.some(x => x.id === t.id)
                            );
                            state.table.push(sortGroup([...g.tiles]));
                        }
                        state.initialMeldMade[playerIndex] = true;
                        playedAny = true;
                        didSomething = true;
                        log(`KI macht Erstablage mit ${total} Punkten`);
                        render();
                        await sleep(400);
                        if (checkWin()) return;
                    }
                } else {
                    // Ziel ist die leere Hand: moeglichst viele Steine legen,
                    // Joker aber zurueckhalten.
                    const combo = selectDisjointGroups(candidates, prof.cover, sel => {
                        let tiles = 0, jok = 0, pts = 0;
                        for (const g of sel) {
                            tiles += g.tiles.length;
                            jok += countJokers(g.tiles);
                            pts += g.points;
                            // Keine Gruppe darf zur Haelfte aus Jokern bestehen
                            if (countJokers(g.tiles) * 2 >= g.tiles.length) return -Infinity;
                        }
                        const jokerCost = dumpMode ? 15 : 80;
                        return tiles * 100 - jok * jokerCost + pts * 0.1;
                    });

                    if (combo) {
                        for (const g of combo) {
                            const stillThere = g.tiles.every(t =>
                                state.hands[playerIndex].some(h => h.id === t.id)
                            );
                            if (!stillThere || !isValidGroup(g.tiles)) continue;

                            state.hands[playerIndex] = state.hands[playerIndex].filter(
                                t => !g.tiles.some(x => x.id === t.id)
                            );
                            state.table.push(sortGroup([...g.tiles]));
                            playedAny = true;
                            didSomething = true;
                            render();
                            await sleep(320);
                            if (checkWin()) return;
                        }
                    }
                }

                // --- Strategie 2: An bestehende Gruppen anlegen (erst nach Erstablage) ---
                if (state.initialMeldMade[playerIndex] && state.table.length > 0) {
                    const handNow = state.hands[playerIndex].filter(t => !t.separator);
                    const additions = findAdditions(handNow, state.table);

                    // Steine, die eigene Kombis zerstoeren wuerden, zuletzt anfassen
                    additions.sort((a, b) =>
                        tileSynergy(a.tile, handNow) - tileSynergy(b.tile, handNow)
                    );

                    for (const add of additions) {
                        const tile = state.hands[playerIndex].find(t => t.id === add.tile.id);
                        if (!tile) continue;
                        // Einen Joker einzeln zu verschenken lohnt nur,
                        // wenn die Hand ohnehin fast leer ist.
                        if (tile.isJoker && !dumpMode &&
                            realTileCount(state.hands[playerIndex]) > 4) continue;

                        // Steine mit hohem Kombi-Potenzial aufheben
                        if (prof.conserve && !dumpMode) {
                            const rest = state.hands[playerIndex].filter(t => !t.separator);
                            if (rest.length > 5 && tileSynergy(tile, rest) >= 4) continue;
                        }

                        const target = state.table[add.groupIndex];
                        if (!target) continue;
                        const newGroup = [...target, tile];
                        if (!isValidGroup(newGroup)) continue;

                        state.hands[playerIndex] = state.hands[playerIndex].filter(t => t.id !== tile.id);
                        state.table[add.groupIndex] = sortGroup(newGroup);
                        playedAny = true;
                        didSomething = true;
                        render();
                        await sleep(250);
                        if (checkWin()) return;
                    }
                }

                // --- Strategie 3: Run auf dem Tisch teilen (nur schwer) ---
                if (prof.split && state.initialMeldMade[playerIndex] && state.table.length > 0) {
                    const handNow = state.hands[playerIndex].filter(t => !t.separator);
                    const splits = findSplits(handNow, state.table);

                    for (const sp of splits) {
                        const tile = state.hands[playerIndex].find(t => t.id === sp.tile.id);
                        if (!tile) continue;
                        const group = state.table[sp.groupIndex];
                        if (!group) continue;

                        const left = group.filter(t => t.number <= sp.splitAt);
                        const right = group.filter(t => t.number > sp.splitAt);
                        const rightWithTile = [tile, ...right];

                        if (left.length < 3 || rightWithTile.length < 3) continue;
                        if (!isValidGroup(left) || !isValidGroup(rightWithTile)) continue;

                        state.hands[playerIndex] = state.hands[playerIndex].filter(t => t.id !== tile.id);
                        state.table[sp.groupIndex] = sortGroup(left);
                        state.table.push(sortGroup(rightWithTile));

                        log(`KI teilt Run bei ${sp.splitAt}`);
                        playedAny = true;
                        didSomething = true;
                        render();
                        await sleep(350);
                        if (checkWin()) return;
                        break; // Tisch hat sich geaendert, neu bewerten
                    }
                }

                // --- Strategie 4: Stein vom Tisch borgen (mittel/schwer) ---
                if (prof.borrow && state.initialMeldMade[playerIndex] && state.table.length > 0) {
                    const handNow = state.hands[playerIndex].filter(t => !t.separator);
                    const combos = findBorrowCombos(handNow, state.table);
                    combos.sort((a, b) =>
                        (b.newGroup.length - countJokers(b.newGroup) * 3) -
                        (a.newGroup.length - countJokers(a.newGroup) * 3)
                    );

                    for (const combo of combos) {
                        const allAvailable = combo.handTiles.every(t =>
                            state.hands[playerIndex].some(h => h.id === t.id)
                        );
                        if (!allAvailable) continue;
                        // Joker darf mitspielen, die neue Gruppe darf aber
                        // nicht zur Haelfte aus Jokern bestehen.
                        if (countJokers(combo.newGroup) * 2 >= combo.newGroup.length) continue;

                        const borrowGroup = state.table[combo.borrow.groupIndex];
                        if (!borrowGroup || !borrowGroup.some(t => t.id === combo.borrow.tile.id)) continue;

                        const newSourceGroup = borrowGroup.filter(t => t.id !== combo.borrow.tile.id);
                        if (newSourceGroup.length > 0 && !isValidGroup(newSourceGroup)) continue;
                        if (!isValidGroup(combo.newGroup)) continue;

                        log(`KI borgt ${combo.borrow.tile.number} von Gruppe ${combo.borrow.groupIndex}`);

                        if (newSourceGroup.length === 0) {
                            state.table.splice(combo.borrow.groupIndex, 1);
                        } else {
                            state.table[combo.borrow.groupIndex] = sortGroup(newSourceGroup);
                        }

                        state.hands[playerIndex] = state.hands[playerIndex].filter(
                            t => !combo.handTiles.some(h => h.id === t.id)
                        );
                        state.table.push(sortGroup(combo.newGroup));

                        playedAny = true;
                        didSomething = true;
                        render();
                        await sleep(350);
                        if (checkWin()) return;
                        break; // Tisch hat sich geaendert, neu bewerten
                    }
                }

                if (!didSomething) break;
                plays++;
            }

            if (playedAny) {
                state.passCount = 0;
            } else if (state.pool.length > 0) {
                state.hands[playerIndex].push(state.pool.pop());
                state.passCount = 0;
                log('KI zieht');
            } else {
                state.passCount++;
                log('KI passt');
            }
            checkStalemate();

            state.playedTileIds = collectNewTableIds(tableBeforeIds);
            state.aiThinking = false;
            state.currentPlayer = (state.currentPlayer + 1) % state.players.length;

            if (state.gameMode === 'online-host') broadcastGameState();

            if (state.playerTypes[state.currentPlayer] === 'human') {
                saveTurnStart();
            }

            render();
            await sleep(200);
            checkForAITurn();
        }
        
        function checkForAITurn() {
            if (state.winner !== null || state.aiThinking) return;
            // Im Online-Spiel rechnet nur der Host die Bots, sonst wuerde
            // jeder Client einen eigenen, abweichenden Zug erzeugen.
            if (state.gameMode && state.gameMode.startsWith('online') && !state.isHost) return;
            if (state.playerTypes[state.currentPlayer] === 'ai') {
                doAITurn(state.currentPlayer);
            }
        }
        
        function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

        // ============ DRAG & DROP ============
        
        function startDrag(e, tile, source) {
            if (state.currentPlayer !== state.myIndex || state.aiThinking) return;
            
            state.draggedTile = tile;
            state.dragSource = source;
            
            const preview = document.createElement('div');
            preview.className = `tile ${tile.isJoker ? 'joker' : 'normal'} ${tile.isJoker ? '' : COLOR_CLASSES[tile.color]} drag-preview`;
            preview.textContent = tile.isJoker ? '★' : tile.number;
            preview.style.left = e.clientX - 16 + 'px';
            preview.style.top = e.clientY - 22 + 'px';
            document.body.appendChild(preview);
            state.dragPreview = preview;
            
            e.target.classList.add('dragging');
        }

        // ============ TAP-TO-MOVE (Mobile) ============
        
        function handleTileTap(tile, source) {
            if (state.currentPlayer !== state.myIndex || state.aiThinking) return;
            
            // If no tile selected, select this one
            if (!state.selectedForMove) {
                state.selectedForMove = { tile, source };
                render();
                return;
            }
            
            // If same tile tapped, deselect
            if (state.selectedForMove.tile.id === tile.id) {
                state.selectedForMove = null;
                render();
                return;
            }
            
            // Different tile tapped - if from same location, switch selection
            state.selectedForMove = { tile, source };
            render();
        }
        
        function handleTargetTap(target) {
            if (!state.selectedForMove) return;
            if (state.currentPlayer !== state.myIndex || state.aiThinking) return;
            
            // Use existing handleDrop logic
            state.draggedTile = state.selectedForMove.tile;
            state.dragSource = state.selectedForMove.source;
            
            handleDrop(target);
            state.selectedForMove = null;
        }
        
        function handleHandAreaTap() {
            if (!state.selectedForMove) return;
            if (state.selectedForMove.source.type === 'hand') {
                // Deselect if already in hand
                state.selectedForMove = null;
                render();
                return;
            }
            handleTargetTap({ type: 'hand' });
        }
        
        function handleTouchDropZone(groupIndex, position) {
            if (!state.selectedForMove) return;
            if (state.currentPlayer !== state.myIndex || state.aiThinking) return;
            
            const tile = state.selectedForMove.tile;
            const source = state.selectedForMove.source;
            
            // Clear drawn tile highlight when moved
            if (tile.id === state.drawnTileId) {
                state.drawnTileId = null;
            }
            
            // Check initial meld restrictions
            if (!state.initialMeldMade[state.myIndex]) {
                if (source.type === 'table' && !isOwnNewTile(tile.id)) {
                    showMessage('Erst rauskommen!');
                    state.selectedForMove = null;
                    render();
                    return;
                }
                const numGroupsAtStart = state.turnStartState && state.turnStartState.table ? state.turnStartState.table.length : 0;
                if (groupIndex < numGroupsAtStart) {
                    showMessage('Erst rauskommen! (Nutze "+ Neu")');
                    state.selectedForMove = null;
                    render();
                    return;
                }
            }
            
            // Remove from source
            if (source.type === 'hand') {
                state.hands[state.myIndex] = removeFromHand(tile.id);
            } else if (source.type === 'table') {
                state.table[source.groupIndex] = state.table[source.groupIndex].filter(t => t.id !== tile.id);
                if (state.table[source.groupIndex].length === 0) {
                    state.table.splice(source.groupIndex, 1);
                    if (groupIndex > source.groupIndex) groupIndex--;
                }
            }
            
            // Insert at specific position
            state.table[groupIndex].splice(position, 0, tile);
            
            if (source.type === 'hand') {
                state.hasPlayedThisTurn = true;
            }
            
            state.selectedForMove = null;
            updatePlayedFlag();
            render();
        }

        function onDrag(e) {
            if (state.dragPreview) {
                state.dragPreview.style.left = e.clientX - 16 + 'px';
                state.dragPreview.style.top = e.clientY - 22 + 'px';
            }
        }

        function endDrag(cancelled = false) {
            // If drag was cancelled (not dropped on valid target), restore tile to source
            if (cancelled && state.draggedTile && state.dragSource) {
                // Tile should still be in original position - don't do anything
                // This prevents tile loss from drag cancellation
            }
            
            if (state.dragPreview) {
                state.dragPreview.remove();
                state.dragPreview = null;
            }
            document.querySelectorAll('.dragging').forEach(el => el.classList.remove('dragging'));
            document.querySelectorAll('.drag-over').forEach(el => el.classList.remove('drag-over'));
            state.draggedTile = null;
            state.dragSource = null;
            render();
        }

        function handleDrop(target) {
            if (!state.draggedTile || !state.dragSource) return;
            
            const tile = state.draggedTile;
            const source = state.dragSource;
            
            // Clear drawn tile highlight when moved
            if (tile.id === state.drawnTileId) {
                state.drawnTileId = null;
            }
            
            // REGEL: Vor Erstablage darf man NUR eigene neue Gruppen bilden
            if (!state.initialMeldMade[state.myIndex]) {
                // Nicht erlaubt: Von Tisch nehmen
                if (source.type === 'table' && !isOwnNewTile(tile.id)) {
                    showMessage('Erst rauskommen!');
                    endDrag();
                    return;
                }
                // Prüfen ob Zielgruppe schon bei Zugbeginn existierte (= fremde Gruppe)
                if ((source.type === 'hand' || source.type === 'table') && target.type === 'table') {
                    const numGroupsAtStart = state.turnStartState && state.turnStartState.table ? state.turnStartState.table.length : 0;
                    // Wenn Zielgruppe eine "alte" Gruppe ist, blockieren
                    if (target.groupIndex < numGroupsAtStart) {
                        showMessage('Erst rauskommen! (Nutze "+ Neu")');
                        endDrag();
                        return;
                    }
                }
            }
            
            // Remove from source
            if (source.type === 'hand') {
                state.hands[state.myIndex] = removeFromHand(tile.id);
            } else if (source.type === 'table') {
                state.table[source.groupIndex] = state.table[source.groupIndex].filter(t => t.id !== tile.id);
                if (state.table[source.groupIndex].length === 0) {
                    state.table.splice(source.groupIndex, 1);
                    if (target.type === 'table' && target.groupIndex > source.groupIndex) {
                        target.groupIndex--;
                    }
                }
            }
            
            // Add to target
            if (target.type === 'hand') {
                state.hands[state.myIndex].push(tile);
                reapplySorting();
            } else if (target.type === 'table') {
                const group = state.table[target.groupIndex];
                const split = shouldSplitGroup(group, tile);
                
                if (split) {
                    state.table.splice(target.groupIndex, 1, split.group1, split.group2);
                } else {
                    state.table[target.groupIndex].push(tile);
                    state.table[target.groupIndex] = sortGroup(state.table[target.groupIndex]);
                }
                if (source.type === 'hand') {
                    state.hasPlayedThisTurn = true;
                }
            } else if (target.type === 'newGroup') {
                state.table.push([tile]);
                if (source.type === 'hand') {
                    state.hasPlayedThisTurn = true;
                }
            }
            
            updatePlayedFlag();
            endDrag();
        }

        // ============ NETWORKING ============
        
        function initPeer(id = null) {
            return meteredReady.then(() => initPeerNow(id));
        }

        function initPeerNow(id = null) {
            return new Promise((resolve, reject) => {
                const config = peerOptions();
                
                log('Initializing peer' + (id ? ` with ID: ${id}` : ''));
                
                let peer;
                try {
                    peer = id ? new Peer(id, config) : new Peer(config);
                } catch (e) {
                    log('Peer creation failed: ' + e);
                    reject(new Error('PeerJS nicht verfügbar'));
                    return;
                }
                
                let resolved = false;
                
                peer.on('open', pid => { 
                    if (resolved) { log('Signalserver wieder verbunden (ID ' + pid + ')'); return; }
                    resolved = true;
                    log('Peer connected with ID: ' + pid);
                    state.peerId = pid; 
                    state.connectionStatus = 'connected'; 
                    resolve(peer); 
                });
                
                peer.on('disconnected', () => {
                    if (peer.destroyed) return;
                    log('Peer disconnected, reconnecting...');
                    state.connectionStatus = 'connecting';
                    try { peer.reconnect(); } catch (e) { log('reconnect failed: ' + e); }
                });

                peer.on('error', err => {
                    log('Peer error: ' + err.type + ' - ' + err);
                    if (resolved) {
                        // Host nicht erreichbar, nachdem der Peer schon offen war
                        if (err.type === 'peer-unavailable' && state.peer === peer && state.screen === 'lobby' && state.gameMode === 'online-join') {
                            log('Host per P2P nicht gefunden, versuche Relay');
                            startRelayJoin(state.gameId, 'Host nicht per P2P erreichbar');
                        }
                        return;
                    }
                    resolved = true;
                    state.connectionStatus = 'error';
                    peer.destroy();
                    reject(new Error(
                        err.type === 'unavailable-id' ? 'Code vergeben' : 
                        err.type === 'peer-unavailable' ? 'Nicht gefunden' : 
                        err.type === 'network' ? 'Netzwerkfehler' :
                        err.type === 'server-error' ? 'Server nicht erreichbar' :
                        'Verbindungsfehler: ' + err.type
                    ));
                });
                
                setTimeout(() => { 
                    if (!resolved) { 
                        resolved = true;
                        log('Peer connection timeout');
                        peer.destroy(); 
                        reject(new Error('Timeout - Server nicht erreichbar')); 
                    } 
                }, 8000);
            });
        }

        // state.slots ist index-gleich mit state.players:
        // null = Host oder Bot, sonst die Verbindung des jeweiligen Spielers.
        // Damit bleibt die Zuordnung korrekt, auch wenn Bots dazwischen sitzen.
        function playerIndexOfConn(conn) {
            return state.slots.indexOf(conn);
        }

        // Verbindungsliste neu aufbauen und allen Clients ihren aktuellen
        // Index mitteilen (der sich durch Bots/Abgaenge verschiebt).
        function syncLobby() {
            state.connections = state.slots.filter(s => s);
            if (state.isPublic) updatePublicGame(state.gameId, state.players.length);
            for (let i = 0; i < state.slots.length; i++) {
                const c = state.slots[i];
                if (c && c.open) {
                    c.send({
                        type: 'joined', index: i,
                        players: state.players, playerTypes: state.playerTypes
                    });
                }
            }
            render();
        }

        function addLobbyBot() {
            if (!state.isHost || state.screen !== 'waiting') return;
            if (state.players.length >= 4) { showMessage('Lobby ist voll!'); return; }
            const n = state.playerTypes.filter(t => t === 'ai').length + 1;
            state.players.push('Bot ' + n);
            state.playerTypes.push('ai');
            state.slots.push(null);
            syncLobby();
        }

        function removeLobbyBot() {
            if (!state.isHost || state.screen !== 'waiting') return;
            let idx = -1;
            for (let i = state.playerTypes.length - 1; i >= 0; i--) {
                if (state.playerTypes[i] === 'ai') { idx = i; break; }
            }
            if (idx < 0) return;
            state.players.splice(idx, 1);
            state.playerTypes.splice(idx, 1);
            state.slots.splice(idx, 1);
            syncLobby();
        }

        function broadcast(data) { state.connections.forEach(c => c && c.open && c.send(data)); }

        // Sendet an den Host. Gibt false zurueck, wenn keine Verbindung offen ist.
        function sendToHost(payload) {
            const conn = state.connections[0];
            if (!conn || !conn.open) {
                showMessage('Keine Verbindung zum Host!');
                return false;
            }
            try {
                conn.send(payload);
                return true;
            } catch (err) {
                showMessage('Senden fehlgeschlagen!');
                return false;
            }
        }

        // Zustand aus Sicht eines Spielers: fremde Haende und der Pool werden
        // nur als Platzhalter (Anzahl) uebertragen, damit niemand spicken kann.
        function viewFor(idx, type) {
            const hands = state.hands.map((h, i) => {
                const real = h.filter(t => !t.separator);
                return i === idx ? real : real.map(() => ({ hidden: true }));
            });
            return {
                type, yourIndex: idx,
                players: state.players,
                playerTypes: state.playerTypes,
                currentPlayer: state.currentPlayer,
                pool: state.pool.map(() => ({ hidden: true })),
                hands,
                table: state.table,
                initialMeldMade: state.initialMeldMade,
                winner: state.winner,
                playedTileIds: state.playedTileIds,
                passCount: state.passCount
            };
        }

        function sendStateToSlot(i, type = 'gameState') {
            const c = state.slots[i];
            if (c && c.open) {
                try { c.send(viewFor(i, type)); } catch (err) { log('send failed: ' + err); }
            }
        }

        function broadcastGameState(type = 'gameState') {
            for (let i = 0; i < state.slots.length; i++) sendStateToSlot(i, type);
            render();
        }

        function setupConnection(conn, isHost = false) {
            log('Setting up connection, isHost: ' + isHost);
            watchConn(conn, isHost ? 'Eingehend ' + String(conn.peer).slice(0, 8) : 'Zum Host');

            conn.on('open', () => {
                log('Connection opened');
                if (!isHost) {
                    log('Sending join request');
                    conn.send({ type: 'join', name: state.playerName });
                }
            });

            conn.on('data', data => {
                if (!data || typeof data.type !== 'string') return;
                log('Received data: ' + data.type);
                try {
                    handleData(data, conn);
                } catch (err) {
                    log('handleData error: ' + err);
                }
            });

            conn.on('close', () => {
                log('Connection closed');
                if (state.isHost) {
                    const idx = playerIndexOfConn(conn);
                    if (idx < 0) return;
                    if (state.screen === 'waiting') {
                        state.players.splice(idx, 1);
                        state.playerTypes.splice(idx, 1);
                        state.slots.splice(idx, 1);
                        syncLobby();
                    } else {
                        // Spiel laeuft: Platz wird von einem Bot gehalten, bis der Spieler zurueckkehrt
                        state.slots[idx] = null;
                        state.connections = state.slots.filter(s => s);
                        if (state.screen === 'game' && state.winner === null) {
                            const orig = state.players[idx];
                            state.dropped[idx] = orig;
                            state.players[idx] = orig + ' 🤖';
                            state.playerTypes[idx] = 'ai';
                            showMessage(orig + ' hat die Verbindung verloren');
                            broadcastGameState();
                            if (state.currentPlayer === idx) setTimeout(() => checkForAITurn(), 400);
                        }
                    }
                } else if (state.gameMode === 'online-join' && state.connections[0] === conn) {
                    if (state.screen === 'ended') return;
                    newGame();
                    state.error = 'Verbindung zum Host verloren';
                    render();
                }
            });

            conn.on('error', err => {
                log('Connection error: ' + err);
            });
        }

        function rejectJoin(conn, reason) {
            try { conn.send({ type: 'reject', reason }); } catch (e) {}
            setTimeout(() => { try { conn.close(); } catch (e) {} }, 500);
        }

        function handleJoin(data, conn) {
            if (!state.isHost) return;
            if (state.slots.includes(conn)) return;
            const name = cleanName(data.name);

            if (state.screen === 'waiting') {
                if (state.players.length >= 4) { rejectJoin(conn, 'Lobby ist voll'); return; }
                let unique = name, n = 2;
                while (state.players.some(p => p.toLowerCase() === unique.toLowerCase())) {
                    unique = name.slice(0, 10) + ' ' + (n++);
                }
                state.players.push(unique);
                state.playerTypes.push('human');
                state.slots.push(conn);
                syncLobby();
                return;
            }

            if (state.screen === 'game' && state.winner === null) {
                // Rueckkehr eines getrennten Spielers (ueber gleichen Namen)
                const idx = state.players.findIndex((p, i) =>
                    state.dropped[i] && state.dropped[i].toLowerCase() === name.toLowerCase());
                if (idx < 0) { rejectJoin(conn, 'Spiel läuft bereits'); return; }
                if (state.aiThinking && state.currentPlayer === idx) {
                    rejectJoin(conn, 'Bitte gleich nochmal versuchen');
                    return;
                }
                state.players[idx] = state.dropped[idx];
                delete state.dropped[idx];
                state.playerTypes[idx] = 'human';
                state.slots[idx] = conn;
                state.connections = state.slots.filter(s => s);
                broadcastGameState();
                sendStateToSlot(idx, 'gameStart');
                return;
            }

            rejectJoin(conn, 'Spiel ist bereits beendet');
        }

        function handleData(data, conn) {
            switch (data.type) {
                case 'join':
                    handleJoin(data, conn);
                    break;
                case 'reject':
                    if (!state.isHost && state.screen === 'lobby') {
                        state.error = String(data.reason || 'Beitritt abgelehnt');
                        state.message = '';
                        state.connections = [];
                        closeRelay();
                        if (state.peer) { try { state.peer.destroy(); } catch (e) {} }
                        state.peer = null;
                        render();
                    }
                    break;
                case 'invalid':
                    if (!state.isHost) showMessage(String(data.reason || 'Ungültiger Zug'));
                    break;
                case 'joined':
                    if (state.isHost) break;
                    state.myIndex = data.index;
                    state.players = data.players;
                    state.playerTypes = data.playerTypes;
                    state.screen = 'waiting';
                    state.error = '';
                    state.message = '';
                    render();
                    break;
                case 'playerList':
                    if (state.isHost) break;
                    state.players = data.players;
                    state.playerTypes = data.playerTypes;
                    render();
                    break;
                case 'gameStart':
                case 'gameState': {
                    if (state.isHost) break;
                    if (typeof data.yourIndex === 'number') state.myIndex = data.yourIndex;
                    const wasMyTurn = state.screen === 'game' && state.currentPlayer === state.myIndex;
                    log('Received game state update, currentPlayer: ' + data.currentPlayer + ', myIndex: ' + state.myIndex);

                    // Zwischen-Update waehrend meines eigenen Zugs (z.B. ein Mitspieler faellt aus):
                    // meine laufenden Aenderungen am Tisch nicht ueberschreiben.
                    if (data.type === 'gameState' && wasMyTurn && data.currentPlayer === state.myIndex && data.winner === null) {
                        state.players = data.players;
                        state.playerTypes = data.playerTypes;
                        state.pool = data.pool;
                        for (let i = 0; i < data.hands.length; i++) {
                            if (i !== state.myIndex) state.hands[i] = data.hands[i];
                        }
                        render();
                        break;
                    }

                    state.players = data.players;
                    state.playerTypes = data.playerTypes;
                    state.currentPlayer = data.currentPlayer;
                    state.pool = data.pool;
                    state.hands = mergeHands(data.hands);
                    reapplySorting();
                    state.table = data.table;
                    state.initialMeldMade = data.initialMeldMade;
                    state.winner = data.winner;
                    state.playedTileIds = data.playedTileIds || [];
                    state.passCount = data.passCount || 0;
                    state.selectedForMove = null;
                    state.message = '';
                    state.error = '';

                    if (data.type === 'gameStart' || state.screen !== 'game') {
                        state.screen = state.winner !== null ? 'ended' : 'game';
                    }

                    // Always reset turn state when receiving update
                    state.hasPlayedThisTurn = false;
                    state.selectedTiles = [];

                    // Save turn start when it becomes our turn
                    if (state.currentPlayer === state.myIndex) {
                        saveTurnStart();
                    }

                    if (state.winner !== null) state.screen = 'ended';
                    render();
                    break;
                }
                case 'action':
                    if (state.isHost) handlePlayerAction(data, conn);
                    break;
            }
        }

        // Prueft den Zug eines Clients gegen den Host-Zustand. Der Client darf
        // nur seine eigene Hand und den Tisch senden; alle Steine werden anhand
        // der IDs aus dem Host-Zustand uebernommen (keine gefaelschten Steine).
        function validateTurn(idx, data) {
            const bad = reason => ({ error: reason });
            if (!data || !Array.isArray(data.table) || !Array.isArray(data.hand)) return bad('Ungültige Daten');

            const canon = new Map();
            const oldTableIds = new Set();
            for (const g of state.table) for (const t of g) { canon.set(t.id, t); oldTableIds.add(t.id); }
            const oldHand = state.hands[idx].filter(t => !t.separator);
            const oldHandIds = new Set();
            for (const t of oldHand) { canon.set(t.id, t); oldHandIds.add(t.id); }

            const seen = new Set();
            const take = t => {
                if (!t || typeof t.id !== 'number' || !canon.has(t.id) || seen.has(t.id)) return null;
                seen.add(t.id);
                return canon.get(t.id);
            };

            const newTable = [];
            for (const g of data.table) {
                if (!Array.isArray(g)) return bad('Ungültige Daten');
                const ng = [];
                for (const t of g) {
                    const c = take(t);
                    if (!c) return bad('Ungültiger Stein');
                    ng.push(c);
                }
                if (ng.length > 0) newTable.push(ng);
            }
            const newHand = [];
            for (const t of data.hand) {
                const c = take(t);
                if (!c) return bad('Ungültiger Stein');
                newHand.push(c);
            }
            if (seen.size !== canon.size) return bad('Steine fehlen');

            for (const t of newHand) if (oldTableIds.has(t.id)) return bad('Tisch-Steine müssen zurück!');
            if (newHand.length >= oldHand.length) return bad('Nichts gelegt');

            for (let i = 0; i < newTable.length; i++) {
                if (!isValidGroup(newTable[i])) return bad(`Gruppe ${i + 1} ungültig!`);
            }

            let meld = state.initialMeldMade[idx];
            if (!meld) {
                const key = g => g.map(t => t.id).sort((a, b) => a - b).join(',');
                const newKeys = new Set(newTable.map(key));
                for (const g of state.table) {
                    if (!newKeys.has(key(g))) return bad('Erst rauskommen!');
                }
                let pts = 0;
                for (const g of newTable) {
                    const values = groupTileValues(g);
                    for (const t of g) if (oldHandIds.has(t.id)) pts += values.get(t.id) || 0;
                }
                if (pts < 30) return bad(`Erstablage: 30+ (${pts})`);
                meld = true;
            }
            return { ok: true, table: newTable, hand: newHand, meld };
        }

        function handlePlayerAction(data, conn) {
            const playerIndex = playerIndexOfConn(conn);
            if (playerIndex < 0) return;
            if (state.screen !== 'game' || state.winner !== null) return;
            if (playerIndex !== state.currentPlayer) return;

            switch (data.action) {
                case 'draw':
                    if (state.pool.length > 0) {
                        state.hands[playerIndex].push(state.pool.pop());
                        state.passCount = 0;
                    } else {
                        state.passCount++;
                        checkStalemate();
                    }
                    state.currentPlayer = (state.currentPlayer + 1) % state.players.length;
                    break;
                case 'endTurn': {
                    const r = validateTurn(playerIndex, data);
                    if (!r.ok) {
                        try { conn.send({ type: 'invalid', reason: r.error }); } catch (e) {}
                        sendStateToSlot(playerIndex, 'gameStart');
                        return;
                    }
                    const newPlayedIds = [];
                    const oldTableIds = new Set();
                    for (const g of state.table) for (const t of g) oldTableIds.add(t.id);
                    for (const g of r.table) for (const t of g) if (!oldTableIds.has(t.id)) newPlayedIds.push(t.id);
                    state.playedTileIds = newPlayedIds;

                    state.hands[playerIndex] = r.hand;
                    state.table = r.table;
                    state.initialMeldMade[playerIndex] = r.meld;
                    state.passCount = 0;
                    if (r.hand.length === 0) state.winner = playerIndex;
                    else state.currentPlayer = (state.currentPlayer + 1) % state.players.length;
                    break;
                }
                default:
                    return;
            }
            broadcastGameState();
            if (state.winner === null) {
                if (state.currentPlayer === state.myIndex) {
                    reapplySorting();
                    saveTurnStart();
                    render();
                }
                setTimeout(() => checkForAITurn(), 300);
            }
        }

        function saveTurnStart() {
            // Keep separators for proper undo
            state.turnStartState = {
                hands: JSON.parse(JSON.stringify(state.hands)),
                table: JSON.parse(JSON.stringify(state.table))
            };
            state.hasPlayedThisTurn = false;
        }

        // ============ GAME SETUP ============

        function startAIGame() {
            const name = ((document.getElementById('playerName') || {}).value || '').trim() || 'Spieler';
            const aiCount = parseInt(((document.getElementById('aiCount') || {}).value) || '1');
            
            state.gameMode = 'ai';
            state.playerName = name;
            state.players = [name];
            state.playerTypes = ['human'];
            state.myIndex = 0;
            state.isHost = true;
            
            const aiNames = ['🤖 Bot 1', '🤖 Bot 2', '🤖 Bot 3'];
            for (let i = 0; i < aiCount; i++) {
                state.players.push(aiNames[i]);
                state.playerTypes.push('ai');
            }
            
            initGame();
        }
        
        function initGame() {
            // Remove from public games when starting
            if (state.isHost && state.isPublic) removePublicGame(state.gameId);
            
            const tiles = shuffle(generateTileSet());
            const hands = [];
            let idx = 0;
            for (let i = 0; i < state.players.length; i++) {
                hands.push(tiles.slice(idx, idx + 14));
                idx += 14;
            }
            state.pool = tiles.slice(idx);
            state.hands = hands;
            state.table = [];
            state.currentPlayer = 0;
            state.initialMeldMade = new Array(state.players.length).fill(false);
            state.winner = null;
            state.screen = 'game';
            state.hasPlayedThisTurn = false;
            state.selectedTiles = [];
            reapplySorting();
            saveTurnStart();
            
            state.passCount = 0;
            state.dropped = {};
            state.playedTileIds = [];
            if (state.gameMode === 'online-host' && state.isHost) {
                broadcastGameState('gameStart');
            }
            
            render();
            setTimeout(() => checkForAITurn(), 400);
        }

        async function createOnlineGame(isPublic = true) {
            if (typeof Peer === 'undefined') {
                state.error = 'Multiplayer nicht verfügbar - PeerJS konnte nicht geladen werden. Bitte Seite neu laden.';
                render();
                return;
            }
            const name = ((document.getElementById('playerName') || {}).value || '').trim();
            if (!name) { state.error = 'Name!'; render(); return; }
            state.playerName = name;
            state.gameMode = 'online-host';
            state.isPublic = isPublic;
            state.error = '';
            state.message = 'Verbinde...';
            render();
            try {
                if (state.peer) { try { state.peer.destroy(); } catch (e) {} state.peer = null; }
                let gameId = '', lastErr = null;
                for (let attempt = 0; attempt < 4; attempt++) {
                    gameId = 'RK' + generateGameId();
                    try {
                        state.peer = await initPeer(gameId);
                        lastErr = null;
                        break;
                    } catch (e) {
                        lastErr = e;
                        if (e.message !== 'Code vergeben') break;
                    }
                }
                if (lastErr) throw lastErr;
                state.gameId = gameId;
                state.passCount = 0;
                state.dropped = {};
                state.isHost = true;
                state.myIndex = 0;
                state.players = [name];
                state.playerTypes = ['human'];
                state.slots = [null];
                state.connections = [];
                state.screen = 'waiting';
                log('Host bereit, Code ' + gameId + (isPublic ? ' (öffentlich)' : ' (privat)'));
                state.peer.on('connection', c => { log('Host: eingehende Verbindung'); setupConnection(c, true); });
                try {
                    state.relayHost = new RelayHost(gameId, c => { log('Host: eingehende Relay-Verbindung'); setupConnection(c, true); });
                    state.relayHost.start().then(() => log('Relay bereit (Fallback ohne WebRTC)')).catch(e => log('Relay nicht verfügbar: ' + e.message));
                } catch (e) { log('Relay-Start fehlgeschlagen: ' + e.message); }
                if (isPublic) registerPublicGame(gameId, name, 1);
                state.message = '';
                render();
            } catch (e) {
                state.error = e.message;
                state.message = '';
                render();
            }
        }

        async function joinOnlineGame(gameId = null) {
            const name = ((document.getElementById('playerName') || {}).value || '').trim();
            let code = gameId || ((document.getElementById('gameCode') || {}).value || '').trim().toUpperCase();
            if (!name) { state.error = 'Name!'; render(); return; }
            if (!code) { state.error = 'Code!'; render(); return; }
            if (code.length < 8) code = 'RK' + code;
            closeRelay();
            state.playerName = name;
            state.gameId = code;
            state.gameMode = 'online-join';
            state.error = '';
            state.message = 'Verbinde...';
            render();
            if (state.peer) { try { state.peer.destroy(); } catch (e) {} state.peer = null; }
            state.connections = [];

            // Erzwungener Relay-Modus oder PeerJS fehlt: direkt ueber den Relay
            if (relayForced() || typeof Peer === 'undefined') {
                startRelayJoin(code, relayForced() ? 'erzwungen' : 'PeerJS fehlt');
                setTimeout(() => relayJoinTimeout(code), 15000);
                return;
            }

            try {
                log('Beitritt: verbinde zum Signalserver…');
                const peer = await initPeer();
                state.peer = peer;
                log('Beitritt: suche Host ' + code);
                const conn = peer.connect(code, { reliable: true });
                state.connections = [conn];
                setupConnection(conn, false);
                // P2P nicht rechtzeitig offen -> Relay probieren
                setTimeout(() => {
                    if (state.gameId === code && state.screen === 'lobby' && !conn.open) startRelayJoin(code, 'P2P nicht rechtzeitig');
                }, 7000);
                setTimeout(() => relayJoinTimeout(code, peer), 16000);
            } catch (e) {
                log('Beitritt P2P fehlgeschlagen: ' + e.message);
                startRelayJoin(code, 'Signalserver: ' + e.message);
                setTimeout(() => relayJoinTimeout(code), 15000);
            }
        }

        function relayJoinTimeout(code, peer) {
            if (state.gameId !== code || state.screen !== 'lobby' || !state.message) return;
            state.error = 'Nicht gefunden';
            state.message = '';
            state.connections = [];
            closeRelay();
            if (peer) { state.peer = null; try { peer.destroy(); } catch (e) {} }
            render();
        }

        function startOnlineGame() {
            if (!state.isHost || state.players.length < 2) return;
            initGame();
        }

        // ============ GAME ACTIONS ============

        function drawTile() {
            if (state.hasPlayedThisTurn) { showMessage('Erst beenden!'); return; }

            if (state.isHost || state.gameMode === 'ai') {
                // Aenderungen am Tisch verwerfen (nichts aus der Hand gelegt, aber evtl. umgebaut)
                if (state.turnStartState) {
                    state.hands[state.myIndex] = JSON.parse(JSON.stringify(state.turnStartState.hands[state.myIndex]));
                    state.table = JSON.parse(JSON.stringify(state.turnStartState.table));
                }
                let drawnTile = null;
                if (state.pool.length > 0) {
                    drawnTile = state.pool.pop();
                    state.hands[state.myIndex].push(drawnTile);
                    reapplySorting();
                    state.passCount = 0;
                } else {
                    state.passCount++;
                    showMessage('Pool leer – du passt');
                    checkStalemate();
                }
                state.currentPlayer = (state.currentPlayer + 1) % state.players.length;
                state.hasPlayedThisTurn = false;
                state.selectedTiles = [];
                state.drawnTileId = drawnTile ? drawnTile.id : null;

                if (state.gameMode === 'online-host') broadcastGameState();
                
                // Save turn start for next player if human
                if (state.playerTypes[state.currentPlayer] === 'human' && state.currentPlayer === state.myIndex) {
                    reapplySorting();
                    saveTurnStart();
                }
                
                render();
