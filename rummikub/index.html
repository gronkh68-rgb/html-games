                setTimeout(() => checkForAITurn(), 300);
            } else {
                // Client
                if (!sendToHost({ type: 'action', action: 'draw' })) return;
            }
        }

        function endTurn() {
            // Check if any tiles from table are now in hand (not allowed!)
            const startTableTileIds = new Set();
            for (const group of state.turnStartState.table) {
                for (const tile of group) {
                    startTableTileIds.add(tile.id);
                }
            }
            
            const stolenTiles = state.hands[state.myIndex].filter(t => startTableTileIds.has(t.id));
            if (stolenTiles.length > 0) {
                showMessage('Tisch-Steine müssen zurück!');
                return;
            }
            
            // Validate all groups
            for (let i = 0; i < state.table.length; i++) {
                if (!isValidGroup(state.table[i])) {
                    showMessage(`Gruppe ${i+1} ungültig!`);
                    return;
                }
            }
            
            // Check initial meld
            if (!state.initialMeldMade[state.myIndex] && state.hasPlayedThisTurn) {
                let points = 0;
                const startHand = state.turnStartState.hands[state.myIndex];
                for (const group of state.table) {
                    const values = groupTileValues(group);
                    for (const tile of group) {
                        if (startHand.some(t => t.id === tile.id)) {
                            points += values.get(tile.id) || 0;
                        }
                    }
                }
                if (points < 30) {
                    showMessage(`Erstablage: 30+ (${points})`);
                    return;
                }
                state.initialMeldMade[state.myIndex] = true;
            }
            
            const isAuthority = state.isHost || state.gameMode === 'ai';
            const wonNow = state.hands[state.myIndex].filter(t => !t.separator).length === 0;

            reapplySorting();
            if (isAuthority) {
                state.passCount = 0;
                if (wonNow) {
                    state.winner = state.myIndex;
                    if (state.gameMode === 'online-host') broadcastGameState();
                    render();
                    return;
                }
                state.currentPlayer = (state.currentPlayer + 1) % state.players.length;
                state.hasPlayedThisTurn = false;
                state.selectedTiles = [];
                
                if (state.gameMode === 'online-host') broadcastGameState();
                
                // Save turn start for next player if human
                if (state.playerTypes[state.currentPlayer] === 'human' && state.currentPlayer === state.myIndex) {
                    reapplySorting();
                    saveTurnStart();
                }
                
                render();
                setTimeout(() => checkForAITurn(), 300);
            } else {
                // Client - send current state to host
                // Nur eigene Hand + Tisch senden; der Host prueft alles nach
                sendToHost({
                    type: 'action',
                    action: 'endTurn',
                    hand: state.hands[state.myIndex].filter(t => !t.separator),
                    table: state.table
                });
            }
        }

        function undoTurn() {
            if (!state.turnStartState) return;
            
            // Only restore MY hand and table to start of MY turn
            state.hands[state.myIndex] = JSON.parse(JSON.stringify(state.turnStartState.hands[state.myIndex]));
            state.table = JSON.parse(JSON.stringify(state.turnStartState.table));
            state.hasPlayedThisTurn = false;
            state.selectedTiles = [];
            state.selectedForMove = null;
            state.playedTileIds = [];
            reapplySorting();
            
            // NO broadcast for undo - it's a local action during your turn
            // The actual game state only changes when you end your turn
            
            render();
            showMessage('Zurück');
        }

        function sortMyHand(method) {
            // Toggle: if same method clicked, turn off sorting
            if (state.sortMode === method) {
                state.sortMode = 'none';
            } else {
                state.sortMode = method;
            }
            localStorage.setItem('rummikub-sort-mode', state.sortMode);
            applySorting(true);
        }
        
        function toggleSeparators() {
            state.showSeparators = !state.showSeparators;
            localStorage.setItem('rummikub-separators', state.showSeparators);
            applySorting(true);
        }
        
        // Sortiert die eigene Hand neu. doRender=false fuer interne Aufrufe.
        function applySorting(doRender) {
            if (state.myIndex < 0 || !state.hands[state.myIndex]) return;
            let hand = state.hands[state.myIndex].filter(t => !t.separator);

            if (state.sortMode === 'number') {
                hand = sortHandByNumber(hand);
            } else if (state.sortMode === 'color') {
                hand = sortHandByColor(hand);
            }

            if (!state.showSeparators) {
                hand = hand.filter(t => !t.separator);
            }

            state.hands[state.myIndex] = hand;
            if (doRender) render();
        }

        // Vor der Erstablage darf man nur eigene, in diesem Zug neu gelegte Steine bewegen
        function isOwnNewTile(tileId) {
            const start = state.turnStartState && state.turnStartState.table ? state.turnStartState.table : [];
            for (const g of start) for (const t of g) if (t.id === tileId) return false;
            return true;
        }

        // Entfernt doppelte / fuehrende / abschliessende Trennstriche
        function normalizeSeparators(hand) {
            const out = [];
            for (const t of hand) {
                if (t.separator) {
                    if (out.length === 0 || out[out.length - 1].separator) continue;
                }
                out.push(t);
            }
            while (out.length > 0 && out[out.length - 1].separator) out.pop();
            return out;
        }

        // Stein aus der eigenen Hand nehmen, Trennstriche bleiben erhalten
        function removeFromHand(tileId) {
            return normalizeSeparators(state.hands[state.myIndex].filter(t => t.separator || t.id !== tileId));
        }

        // "Schon etwas gelegt?" ergibt sich aus der Hand: fehlt ein Stein vom Zugbeginn?
        // (Stein legen und zurueckholen => wieder ziehen erlaubt)
        function updatePlayedFlag() {
            const start = state.turnStartState && state.turnStartState.hands && state.turnStartState.hands[state.myIndex];
            if (!start) return;
            const cur = new Set(state.hands[state.myIndex].filter(t => !t.separator).map(t => t.id));
            state.hasPlayedThisTurn = start.some(t => !t.separator && !cur.has(t.id));
        }

        function reapplySorting() {
            if (state.sortMode === 'none') return;
            applySorting(false);
        }

        // Uebernimmt fremde Haende 1:1, behaelt aber die lokale Reihenfolge
        // (Sortierung + Trennstriche) der eigenen Hand bei.
        function mergeHands(incoming) {
            if (state.myIndex < 0 || !incoming || !incoming[state.myIndex]) return incoming;

            const local = state.hands[state.myIndex] || [];
            const incomingIds = new Set(incoming[state.myIndex].map(t => t.id));
            const seen = new Set();
            const merged = [];

            // 1. Lokale Reihenfolge beibehalten, nur noch vorhandene Steine
            for (const t of local) {
                if (t.separator) { merged.push(t); continue; }
                if (incomingIds.has(t.id) && !seen.has(t.id)) {
                    merged.push(t);
                    seen.add(t.id);
                }
            }
            // 2. Neue Steine (z.B. gezogen) hinten anhaengen
            for (const t of incoming[state.myIndex]) {
                if (!seen.has(t.id)) {
                    merged.push(t);
                    seen.add(t.id);
                }
            }

            const result = incoming.slice();
            result[state.myIndex] = merged;
            return result;
        }

        function showMessage(msg) {
            state.message = msg;
            render();
            setTimeout(() => { state.message = ''; render(); }, 2000);
        }

        function leaveGame() {
            closeRelay();
            if (state.isHost && state.isPublic) removePublicGame(state.gameId);
            if (state.peer) state.peer.destroy();
            newGame();
        }

        function newGame() {
            closeRelay();
            if (state.peer) state.peer.destroy();
            state = {
                screen: 'lobby', gameMode: null, aiDifficulty: state.aiDifficulty, aiCount: state.aiCount,
                peer: null, peerId: null, connections: [], slots: [], isHost: false, isPublic: true, gameId: '',
                playerName: state.playerName, myIndex: -1, players: [], playerTypes: [],
                currentPlayer: 0, pool: [], hands: [], table: [], selectedTiles: [],
                initialMeldMade: [], hasPlayedThisTurn: false, playedTileIds: [], passCount: 0, dropped: {},
                sortMode: state.sortMode, showSeparators: state.showSeparators, drawnTileId: null, turnStartState: null,
                winner: null, message: '', error: '', connectionStatus: 'disconnected',
                draggedTile: null, dragSource: null, dragPreview: null, aiThinking: false,
                showSettings: false, tileScale: state.tileScale, publicGames: [],
                touchMode: state.touchMode, selectedForMove: null
            };
            refreshPublicGames();
            render();
        }

        function copyCode() {
            navigator.clipboard.writeText(state.gameId.replace('RK', '')).then(() => showMessage('Kopiert!'));
        }

        function savePlayerName() {
            const nameEl = document.getElementById('playerName');
            if (nameEl && nameEl.value) state.playerName = nameEl.value;
        }
        
        function setAIDifficulty(d) { 
            savePlayerName();
            state.aiDifficulty = d; 
            render(); 
        }
        
        function toggleSettings() { state.showSettings = !state.showSettings; render(); }
        
        function setTileScale(scale) {
            state.tileScale = parseFloat(scale);
            applyTileScale();
            render();
        }

        // ============ RENDER ============

        function renderTile(tile, draggable = false, source = null) {
            if (tile.separator) {
                return '<div class="hand-separator"></div>';
            }
            const isSelected = state.selectedForMove && state.selectedForMove.tile ? state.selectedForMove.tile.id === tile.id : false;
            const isRecent = state.playedTileIds.includes(tile.id) || (state.drawnTileId === tile.id);
            const cls = `tile ${tile.isJoker ? 'joker' : 'normal'} ${tile.isJoker ? '' : COLOR_CLASSES[tile.color]} ${!draggable ? 'disabled' : ''} ${isSelected ? 'selected' : ''} ${isRecent ? 'recent' : ''}`;
            return `<div class="${cls}" data-id="${tile.id}" data-source='${source ? JSON.stringify(source) : ""}' ${draggable && !state.touchMode ? 'draggable="true"' : ''}>${tile.isJoker ? '★' : tile.number}</div>`;
        }
        
        function renderGroupWithDropZones(group, groupIndex, isMyTurn) {
            // If touch mode and a tile is selected, show drop zones
            const showDropZones = state.touchMode && state.selectedForMove && isMyTurn;
            
            if (!showDropZones) {
                return group.map((t, ti) => renderTile(t, isMyTurn, { type: 'table', groupIndex, tileIndex: ti })).join('');
            }
            
            // Render with drop zones between tiles
            let html = '<div class="touch-drop-zone" data-group="' + groupIndex + '" data-pos="0">+</div>';
            group.forEach((t, ti) => {
                html += renderTile(t, isMyTurn, { type: 'table', groupIndex, tileIndex: ti });
                html += '<div class="touch-drop-zone" data-group="' + groupIndex + '" data-pos="' + (ti + 1) + '">+</div>';
            });
            return html;
        }

        function render() {
            const app = document.getElementById('app');
            
            if (state.screen === 'lobby') {
                app.innerHTML = `
                    <div class="lobby">
                        <div class="lobby-card">
                            <div class="logo"><h1>RUMMIKUB</h1><p>Version 20</p></div>
                            
                            <div class="mode-section">
                                <h3>🤖 Singleplayer</h3>
                                <div class="input-group"><input type="text" id="playerName" placeholder="Dein Name" value="${esc(state.playerName)}" maxlength="12"></div>
                                <div style="font-size:0.75rem;color:#78350f;margin-bottom:0.3rem;">Schwierigkeit:</div>
                                <div class="ai-options">
                                    <div class="ai-option ${state.aiDifficulty === 'easy' ? 'selected' : ''}" onclick="setAIDifficulty('easy')"><span class="emoji">😊</span><span class="label">Leicht</span></div>
                                    <div class="ai-option ${state.aiDifficulty === 'medium' ? 'selected' : ''}" onclick="setAIDifficulty('medium')"><span class="emoji">🤔</span><span class="label">Mittel</span></div>
                                    <div class="ai-option ${state.aiDifficulty === 'hard' ? 'selected' : ''}" onclick="setAIDifficulty('hard')"><span class="emoji">😈</span><span class="label">Schwer</span></div>
                                </div>
                                <div class="input-group"><select id="aiCount" onchange="savePlayerName(); state.aiCount = parseInt(this.value);"><option value="1" ${state.aiCount === 1 ? 'selected' : ''}>1 Bot</option><option value="2" ${state.aiCount === 2 ? 'selected' : ''}>2 Bots</option><option value="3" ${state.aiCount === 3 ? 'selected' : ''}>3 Bots</option></select></div>
                                <button class="btn btn-solo" onclick="startAIGame()">🎮 Spiel starten</button>
                            </div>
                            
                            <div class="divider"><span>🌐 Multiplayer</span></div>
                            
                            <div class="mode-section" id="multiplayerSection">
                                <div class="games-browser">
                                    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:0.5rem;">
                                        <span style="font-size:0.8rem;color:#78350f;font-weight:600;">Offene Spiele</span>
                                        <button class="btn btn-small btn-gray" onclick="state.playerName = (document.getElementById('playerName') || {}).value || state.playerName; refreshPublicGames(); discoveryTick(); render();">🔄</button>
                                    </div>
                                    <div class="games-list">${gamesListHtml()}</div>
                                </div>
                                
                                <button class="btn btn-primary" onclick="createOnlineGame(true)" ${state.message ? 'disabled' : ''}>🌍 Öffentliches Spiel</button>
                                <button class="btn btn-secondary" onclick="createOnlineGame(false)" ${state.message ? 'disabled' : ''}>🔒 Privates Spiel</button>
                                
                                <div class="input-group" style="margin-top:0.5rem"><input type="text" id="gameCode" class="game-code-input" placeholder="PRIVATER CODE" maxlength="8"></div>
                                <button class="btn btn-gray" onclick="joinOnlineGame()">Mit Code beitreten</button>
                            </div>
                            
                            ${state.error ? `<div class="message error">${esc(state.error)}</div>` : ''}
                            ${state.message ? `<div class="message info"><span class="loading loading-dark"></span>${esc(state.message)}</div>` : ''}
                        </div>
                    </div>`;
            } else if (state.screen === 'waiting') {
                app.innerHTML = `
                    <div class="lobby">
                        <div class="lobby-card">
                            <div class="logo"><h1>RUMMIKUB</h1><p>Version 20</p></div>
                            <div class="game-code-display" onclick="copyCode()"><span>${state.isPublic ? '🌍' : '🔒'} ${esc(state.gameId.replace('RK', ''))}</span><p class="copy-hint">${state.isPublic ? 'Öffentlich – ' : ''}Code teilen, Klicken zum Kopieren</p></div>
                            <div class="waiting-room">
                                <h3>Spieler (${state.players.length}/4)</h3>
                                <div class="player-list">
                                    ${state.players.map((p, i) => `
                                        <div class="player-item">
                                            <div class="player-avatar ${state.playerTypes[i] === 'ai' ? 'ai' : ''}">${state.playerTypes[i] === 'ai' ? '🤖' : i + 1}</div>
                                            <span class="player-name ${i === state.myIndex ? 'me' : ''}">${esc(p)} ${i === state.myIndex ? '(Du)' : ''}</span>
                                            ${i === 0 ? '👑' : ''}
                                        </div>
                                    `).join('')}
                                </div>
                            </div>
                            ${state.isHost ? `
                                <div class="input-group" style="display:flex;gap:0.4rem;">
                                    <button class="btn btn-gray btn-small" onclick="addLobbyBot()" ${state.players.length >= 4 ? 'disabled' : ''}>🤖 Bot +</button>
                                    <button class="btn btn-gray btn-small" onclick="removeLobbyBot()" ${!state.playerTypes.includes('ai') ? 'disabled' : ''}>🤖 Bot −</button>
                                </div>
                                <div class="ai-options">
                                    <div class="ai-option ${state.aiDifficulty === 'easy' ? 'selected' : ''}" onclick="setAIDifficulty('easy')"><span class="emoji">😊</span><span class="label">Leicht</span></div>
                                    <div class="ai-option ${state.aiDifficulty === 'medium' ? 'selected' : ''}" onclick="setAIDifficulty('medium')"><span class="emoji">🤔</span><span class="label">Mittel</span></div>
                                    <div class="ai-option ${state.aiDifficulty === 'hard' ? 'selected' : ''}" onclick="setAIDifficulty('hard')"><span class="emoji">😈</span><span class="label">Schwer</span></div>
                                </div>
                            ` : ''}
                            ${state.isHost ? `<button class="btn btn-primary" onclick="startOnlineGame()" ${state.players.length < 2 ? 'disabled' : ''}>${state.players.length < 2 ? 'Warte auf Spieler...' : '🎮 Spiel starten!'}</button>` : '<div class="connecting"><span class="loading loading-dark"></span>Warte auf Host...</div>'}
                            <button class="btn btn-gray" onclick="leaveGame()">← Zurück</button>
                        </div>
                    </div>`;
            } else if (state.screen === 'game' || state.screen === 'ended') {
                const myHand = state.hands[state.myIndex] || [];
                const isMyTurn = state.currentPlayer === state.myIndex && !state.aiThinking;
                const currentName = state.players[state.currentPlayer];
                
                app.innerHTML = `
                    <div class="game-container">
                        <div class="game-header">
                            <div class="players-bar">
                                ${state.players.map((p, i) => `<div class="player-chip ${i === state.currentPlayer ? 'active' : 'inactive'} ${i === state.myIndex ? 'me' : ''} ${state.playerTypes[i] === 'ai' ? 'ai' : ''}">${esc(p)} (${(state.hands[i] || []).filter(t => !t.separator).length})</div>`).join('')}
                            </div>
                            <div style="display:flex;gap:0.3rem;align-items:center;">
                                ${state.gameMode && state.gameMode.startsWith('online') && state.gameId ? `<span class="info-badge" style="cursor:pointer;font-family:monospace;" onclick="copyCode()" title="Spielcode kopieren">🔑 ${esc(state.gameId.replace('RK', ''))}</span>` : ''}
                                <span class="info-badge">Pool: ${state.pool.length}</span>
                                <button class="settings-btn" onclick="openTable3D()" title="3D-Ansicht" style="font-size:0.75rem;font-weight:800;">3D</button>
                                <button class="settings-btn" onclick="toggleSettings()">⚙️</button>
                            </div>
                        </div>
                        
                        <div class="turn-indicator ${isMyTurn ? 'my-turn' : ''} ${state.aiThinking ? 'ai-thinking' : ''} ${!isMyTurn && !state.aiThinking ? 'waiting' : ''}">
                            ${state.aiThinking ? `🤖 ${esc(currentName)} denkt...` : isMyTurn ? 'DEIN ZUG!' + (!state.initialMeldMade[state.myIndex] ? ' (30+ Punkte)' : '') : `${esc(currentName)}...`}
                        </div>
                        
                        ${state.message ? `<div class="game-message">${esc(state.message)}</div>` : ''}
                        
                        <div class="table-area" id="tableArea">
                            <div class="table-label">Tisch ${state.table.length > 0 ? `(${state.table.length} Gruppen)` : ''}</div>
                            <div class="table-content" id="tableContent">
                                ${state.table.map((group, gi) => `
                                    <div class="tile-group ${isValidGroup(group) ? 'valid' : 'invalid'}" data-group="${gi}" data-points="${calculatePoints(group)}">
                                        ${renderGroupWithDropZones(group, gi, isMyTurn)}
                                    </div>
                                `).join('')}
                                ${isMyTurn ? '<div class="drop-zone" id="newGroupZone">+ Neu</div>' : ''}
                            </div>
                        </div>
                        
                        ${isMyTurn ? `
                            <div class="action-bar">
                                <button class="action-btn btn-draw" onclick="drawTile()" ${state.hasPlayedThisTurn ? 'disabled' : ''}>${state.pool.length === 0 ? 'Passen' : 'Ziehen'}</button>
                                <button class="action-btn btn-end" onclick="endTurn()" ${!state.hasPlayedThisTurn ? 'disabled' : ''}>Fertig</button>
                                <button class="action-btn btn-undo" onclick="undoTurn()" ${!state.hasPlayedThisTurn ? 'disabled' : ''}>↩</button>
                            </div>
                        ` : ''}
                        
                        <div class="hand-area">
                            <div class="hand-header">
                                <span class="hand-label">Deine Steine (${myHand.filter(t => !t.separator).length})</span>
                                <div class="sort-buttons">
                                    <button class="sort-btn ${state.sortMode === 'number' ? 'active' : ''}" onclick="sortMyHand('number')" title="Nach Zahl (Sets)">🔢</button>
                                    <button class="sort-btn ${state.sortMode === 'color' ? 'active' : ''}" onclick="sortMyHand('color')" title="Nach Farbe (Runs)">🎨</button>
                                    <button class="sort-btn ${state.showSeparators ? 'active' : ''}" onclick="toggleSeparators()" title="Trennstriche">│</button>
                                </div>
                            </div>
                            <div class="hand-tiles" id="handTiles">
                                ${myHand.map((t, i) => renderTile(t, isMyTurn && !t.separator, t.separator ? null : { type: 'hand', index: i })).join('')}
                            </div>
                        </div>
                    </div>
                    
                    ${state.showSettings ? `
                        <div class="modal-overlay" onclick="toggleSettings()">
                            <div class="modal" onclick="event.stopPropagation()">
                                <h2>⚙️ Einstellungen</h2>
                                ${state.gameMode && state.gameMode.startsWith('online') && state.gameId ? `
                                <div class="modal-section" style="text-align:center;">
                                    <label>Spielcode</label>
                                    <div style="display:inline-block;background:#059669;color:white;padding:0.4rem 1rem;border-radius:2rem;font-size:1.25rem;font-weight:700;letter-spacing:0.15rem;font-family:monospace;cursor:pointer;" onclick="copyCode()">${esc(state.gameId.replace('RK', ''))}</div>
                                    <div class="value" style="font-size:0.7rem;margin-top:0.3rem;">Antippen zum Kopieren</div>
                                </div>` : ''}
                                <div class="modal-section">
                                    <label>Steingröße: ${Math.round(state.tileScale * 100)}%</label>
                                    <input type="range" min="0.7" max="1.5" step="0.1" value="${state.tileScale}" onchange="setTileScale(this.value)">
                                </div>
                                <div class="modal-section">
                                    <label style="display:flex;align-items:center;gap:0.5rem;cursor:pointer;">
                                        <input type="checkbox" ${state.touchMode ? 'checked' : ''} onchange="setTouchMode(this.checked)" style="width:1.2rem;height:1.2rem;">
                                        📱 Touch-Modus (Tippen statt Ziehen)
                                    </label>
                                    <div class="value" style="font-size:0.7rem;margin-top:0.3rem;">
                                        ${state.touchMode ? '1. Stein antippen = auswählen<br>2. Ziel antippen = ablegen' : 'Steine per Drag & Drop bewegen'}
                                    </div>
                                </div>
                                <div class="modal-buttons">
                                    <button class="btn btn-danger" onclick="if(confirm('Spiel wirklich verlassen?')) leaveGame()">🚪 Verlassen</button>
                                </div>
                                <div class="modal-buttons" style="margin-top:0.5rem;">
                                    <button class="btn btn-primary" onclick="toggleSettings()">Schließen</button>
                                </div>
                            </div>
                        </div>
                    ` : ''}
                    
                    ${state.winner !== null ? `
                        <div class="winner-overlay">
                            <div class="winner-card">
                                <div class="winner-trophy">${state.winner === state.myIndex ? '🏆' : '😢'}</div>
                                <h1 class="winner-title">${state.winner === state.myIndex ? 'GEWONNEN!' : 'VERLOREN'}</h1>
                                <p class="winner-name">${esc(state.players[state.winner])}</p>
                                <button class="btn btn-primary" onclick="newGame()">Nochmal</button>
                            </div>
                        </div>
                    ` : ''}`;
                
                setupDragAndDrop();
            }
        }

        function setupDragAndDrop() {
            const myHand = state.hands[state.myIndex] || [];
            const isMyTurn = state.currentPlayer === state.myIndex && !state.aiThinking;
            if (!isMyTurn) return;
            
            // Hand tiles
            document.querySelectorAll('#handTiles .tile:not(.disabled)').forEach(el => {
                const id = parseInt(el.dataset.id);
                const tile = myHand.find(t => t.id === id);
                if (!tile || tile.separator) return;
                
                if (state.touchMode) {
                    el.addEventListener('click', () => handleTileTap(tile, JSON.parse(el.dataset.source)));
                } else {
                    el.addEventListener('dragstart', e => { startDrag(e, tile, JSON.parse(el.dataset.source)); e.dataTransfer.effectAllowed = 'move'; });
                    el.addEventListener('dragend', endDrag);
                }
            });
            
            // Hand drop zone
            const handTiles = document.getElementById('handTiles');
            if (handTiles) {
                if (state.touchMode) {
                    handTiles.addEventListener('click', e => {
                        if (e.target === handTiles) handleHandAreaTap();
                    });
                } else {
                    handTiles.addEventListener('dragover', e => { e.preventDefault(); handTiles.classList.add('drag-over'); });
                    handTiles.addEventListener('dragleave', e => { if (!handTiles.contains(e.relatedTarget)) handTiles.classList.remove('drag-over'); });
                    handTiles.addEventListener('drop', e => { e.preventDefault(); handTiles.classList.remove('drag-over'); handleDrop({ type: 'hand' }); });
                }
            }
            
            // Table tiles
            document.querySelectorAll('.tile-group .tile').forEach(el => {
                const id = parseInt(el.dataset.id);
                const source = JSON.parse(el.dataset.source);
                if (!source) return;
                const tile = (state.table[source.groupIndex] || []).find(t => t.id === id);
                if (!tile) return;
                
                if (state.touchMode) {
                    el.addEventListener('click', () => handleTileTap(tile, source));
                } else {
                    el.addEventListener('dragstart', e => { startDrag(e, tile, source); e.dataTransfer.effectAllowed = 'move'; });
                    el.addEventListener('dragend', endDrag);
                }
            });
            
            // Touch drop zones (between tiles in groups)
            if (state.touchMode) {
                document.querySelectorAll('.touch-drop-zone').forEach(el => {
                    el.addEventListener('click', () => {
                        const gi = parseInt(el.dataset.group);
                        const pos = parseInt(el.dataset.pos);
                        handleTouchDropZone(gi, pos);
                    });
                });
            }
            
            // Groups
            document.querySelectorAll('.tile-group').forEach(el => {
                const gi = parseInt(el.dataset.group);
                if (state.touchMode) {
                    el.addEventListener('click', e => {
                        if (e.target === el) handleTargetTap({ type: 'table', groupIndex: gi });
                    });
                } else {
                    el.addEventListener('dragover', e => { e.preventDefault(); el.classList.add('drag-over'); });
                    el.addEventListener('dragleave', e => { if (!el.contains(e.relatedTarget)) el.classList.remove('drag-over'); });
                    el.addEventListener('drop', e => { e.preventDefault(); el.classList.remove('drag-over'); handleDrop({ type: 'table', groupIndex: gi }); });
                }
            });
            
            // New group zone
            const newZone = document.getElementById('newGroupZone');
            if (newZone) {
                if (state.touchMode) {
                    newZone.addEventListener('click', () => handleTargetTap({ type: 'newGroup' }));
                } else {
                    newZone.addEventListener('dragover', e => { e.preventDefault(); newZone.classList.add('drag-over'); });
                    newZone.addEventListener('dragleave', () => newZone.classList.remove('drag-over'));
                    newZone.addEventListener('drop', e => { e.preventDefault(); newZone.classList.remove('drag-over'); handleDrop({ type: 'newGroup' }); });
                }
            }
            
            if (!state.touchMode) {
                document.addEventListener('dragover', onDrag);
            }
        }

        // Diagnose-Panel ausgeblendet (initDiag() zum Wieder-Einschalten)
        meteredReady = loadMetered();
        refreshPublicGames();
        render();
    </script>
</body>
</html>
