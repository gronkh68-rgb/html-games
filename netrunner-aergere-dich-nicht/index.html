<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>

<script>
const $=id=>document.getElementById(id);
const SPEED=+new URLSearchParams(location.search).get('speed')||1;
// Cyber = Neon-Stadt mit Regen, Standard = gemütliches Wohnzimmer mit klassischem Spielbrett
const CY=()=>document.documentElement.getAttribute('data-style')==='cyber';
const BL=()=>CY()?THREE.AdditiveBlending:THREE.NormalBlending;
const CLASSIC={0xfcee09:0xe6b800,0x00f0ff:0x1aa6b7,0xff2fa8:0xd6336c,0x2dff7a:0x2e9e4f,0x9a6bff:0x7e57c2,0xff8a1f:0xef7d1a};
const cl=c=>CLASSIC[c]!==undefined?CLASSIC[c]:c;
const mixW=(h,t)=>{const r=(h>>16)&255,g=(h>>8)&255,b=h&255,f=v=>Math.round(v+(255-v)*t);return (f(r)<<16)|(f(g)<<8)|f(b);};
const darker=(h,f)=>{const r=(h>>16)&255,g=(h>>8)&255,b=h&255,d=v=>Math.round(v*f);return (d(r)<<16)|(d(g)<<8)|d(b);};
function classicTile(color,emissive){   // Rolle des Feldes aus den Neon-Farben ableiten
  if(color===0x141a2a)return 0xf0e6cb;                         // normales Feld: Elfenbein
  if(color===0x151a28)return 0xd9cda8;                         // nicht benutzte Startecke
  if(color===0x10131c)return mixW(cl(emissive),.4);            // Zielgasse
  if(color===0x10141f)return mixW(cl(emissive),.55);           // Sonderfeld
  if(color===0x0a0e18)return emissive===0x063040?0xd4a76a:0xb98a4e;   // Innenfläche aus Holz
  return cl(color);                                            // Startfeld des Spielers
}

// ====================== Konstanten / Geometrie ======================
const R=10, SEC=12, TL=6*SEC, LN=4, SIZE=1;            // Eck-Radius (Raster), Felder je Sektor, Ringlänge (72), Zielfelder
const DIRS=[[1,0],[1,-1],[0,-1],[-1,0],[-1,1],[0,1]];
const PLAYERS=[
  {n:'Gelb',c:0xfcee09},{n:'Cyan',c:0x00f0ff},{n:'Pink',c:0xff2fa8},
  {n:'Grün',c:0x2dff7a},{n:'Violett',c:0x9a6bff},{n:'Orange',c:0xff8a1f}];
const hexCss=c=>'#'+c.toString(16).padStart(6,'0');
const CORNER_SETS={2:[0,3],3:[0,2,4],4:[0,1,3,4],5:[0,1,2,3,4],6:[0,1,2,3,4,5]};
const TYPES={
  boost :{g:'+3',c:0x3dff8a,t:'Overclock',d:'3 Felder vor.'},
  ice   :{g:'−3',c:0xff3b5c,t:'ICE-Falle',d:'3 Felder zurück.'},
  portal:{g:'A»',c:0xb57bff,get t(){return cyTx('Datenlink: Eingang','Portal: Eingang');},d:'Springt zum Ausgang mit gleichem Buchstaben und gleicher Farbe (»A). Nur in diese Richtung, immer vorwärts. Zu nah am Ziel: wirkungslos.'},
  exit  :{g:'»A',c:0xb57bff,get t(){return cyTx('Datenlink: Ausgang','Portal: Ausgang');},d:'Hier kommt der Datenlink heraus. Ansonsten ein normales Feld.'},
  swap  :{g:'⇄', c:0x00e5ff,t:'Tausch',d:'Platz mit dem am weitesten vorn liegenden Gegner tauschen.'},
  safe  :{g:'◈', c:0xbde8ff,t:'Sicherer Knoten',d:'Hier wirst du nicht geschlagen. Ein besetzter Knoten ist für andere gesperrt.'},
  event :{g:'?', c:0xffa31a,get t(){return cyTx('Hack-Terminal','Würfel-Feld');},d:'Würfle die gezeigte Zahl: Treffer +6 Felder, sonst −2.'},
  lag   :{g:'II',c:0xff4fd8,t:'Lag',d:'Du setzt die nächste Runde aus.'}
};
let RINGW=[],shapeName='';
const ringPos=(i,y=0)=>new THREE.Vector3(RINGW[i].x,y,RINGW[i].z);
const axis=k=>DIRS[(4+k)%6];
const laneCell=(k,j)=>{const a=axis(k),m=R-1-j;return [a[0]*m,a[1]*m];};
const hex2w=([q,r],y=0)=>new THREE.Vector3(SIZE*Math.sqrt(3)*(q+r/2),y,SIZE*1.5*r);
// Höhenprofil: jeder der 6 Sektoren ist ein gleich hoher Hügel (fair für alle), das Ziel liegt auf einer Hochebene
const PROFILE=Array.from({length:SEC},(_,i)=>2.0*Math.pow(Math.sin(Math.PI*i/SEC),.8));
const RINGH=Array.from({length:TL},(_,i)=>.3+PROFILE[i%SEC]);
const LANEH=[.4,.95,1.55,2.2];
const interH=d=>d<=2?2.6:(d===3?1.7:(d===4?1.0:.14));

// ====================== Spielzustand ======================
let cfg=[],active=[],corner=[],startIdx=[],pieces=[],skip=[],cellType=[],portalPairs=[],portalFx=[];
let cur=-1,token=0,pick=null,rollWait=null,lastRoll=0,follow=true,glow=true,useSpecials=true,logLines=[];
const CANCEL={};
const sleep=(ms,t=token)=>new Promise((res,rej)=>setTimeout(()=>t===token?res():rej(CANCEL),ms/SPEED));
// cfg: 'human' = an diesem Gerät, 'remote' = Online-Spieler, 'cpu', 'off'
const isLocal=p=>cfg[p]==='human';
const isHuman=p=>cfg[p]==='human'||cfg[p]==='remote';
let names=[],netRole='local',netPhase={k:'idle'},remoteRoll=null,mySlot=-1,canRollNet=false,evState=null,netPlaying=false,cReady=false;
const isMe=p=>netRole==='local'?isLocal(p):p===mySlot;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function netPush(){}                 // wird im Mehrspieler-Teil ersetzt (Host schickt den Stand)
function sendHost(m){}               // dito (Mitspieler schickt Aktionen)
const absIdx=(p,pos)=>(startIdx[p]+pos)%TL;
const chip=p=>`<span class="chip" style="background:${hexCss(PLAYERS[p].c)}"></span>`;
const nm=p=>`${chip(p)}<b>${PLAYERS[p].n}${names[p]?' ('+esc(names[p])+')':''}</b>`;

function onRing(p,j){const x=pieces[p][j];return x>=0&&x<TL;}
function occupant(abs,except){ // [q,j] eines fremden Steins auf Ringfeld abs
  for(const q of active){if(q===except)continue;
    for(let j=0;j<4;j++)if(onRing(q,j)&&absIdx(q,pieces[q][j])===abs)return [q,j];}
  return null;
}
const safeBlocked=(p,abs)=>cellType[abs]==='safe'&&!!occupant(abs,p);
function canLand(p,i,to){
  const own=pieces[p],pos=own[i];
  if(to<0||to>TL+LN-1)return false;
  if(own.some((q,j)=>j!==i&&(q===to||(q>=TL&&q>pos&&q<to))))return false;
  if(to<TL&&safeBlocked(p,absIdx(p,to)))return false;
  return true;
}
function legalMoves(p,roll){
  const own=pieces[p],moves=[];let baseDone=false;
  own.forEach((pos,i)=>{
    if(pos===-1){
      if(roll!==6||baseDone||own.includes(0))return;
      baseDone=true;moves.push({i,to:0});return;
    }
    if(canLand(p,i,pos+roll))moves.push({i,to:pos+roll});
  });
  if(own.includes(-1)){
    const onStart=own.indexOf(0);
    if(onStart>=0){const m=moves.find(m=>m.i===onStart);if(m)return [m];}
    else if(roll===6){const out=moves.filter(m=>own[m.i]===-1);if(out.length)return out;}
  }
  return moves;
}
const wins=p=>pieces[p].every(q=>q>=TL);
function lanePacked(p){return pieces[p].filter(q=>q>=TL).sort((a,b)=>b-a).every((q,k)=>q===TL+LN-1-k);}
const isWaiting=p=>!pieces[p].some(q=>q>=0&&q<TL)&&lanePacked(p);

// Jeder Sektor bekommt dieselbe Form und dieselbe Feldfolge: Jeder Spieler läuft also genau dieselbe Strecke, nur um 60° gedreht.
const tri=x=>(2/Math.PI)*Math.asin(Math.sin(x));
const SHAPES=[
  {name:'Welle',f:t=>5.0*Math.sin(2*Math.PI*t)},
  {name:'Zickzack',f:t=>4.6*tri(4*Math.PI*t)},
  {name:'Bucht',f:t=>-6.0*Math.sin(Math.PI*t)},
  {name:'Schlangenlinie',f:t=>4.2*Math.sin(3*Math.PI*t)}];
function makeRing(){
  const c0=hex2w([-R,R]),c1=hex2w([0,R]);
  const a0=Math.atan2(c0.z,c0.x),rho0=Math.hypot(c0.x,c0.z);
  let da=Math.atan2(c1.z,c1.x)-a0;da=Math.atan2(Math.sin(da),Math.cos(da));
  const shape=SHAPES[Math.floor(Math.random()*SHAPES.length)];
  const lanes=[];for(let k=0;k<6;k++)for(let j=0;j<LN;j++)lanes.push(hex2w(laneCell(k,j)));
  const build=scale=>{
    // dichte Kurve von Ecke 0 zu Ecke 1, nahe den Ecken gedämpft (dort stehen die Basen)
    const N=600,pts=[];
    for(let n=0;n<=N;n++){
      const t=n/N,amp=scale*shape.f(t)*Math.pow(Math.sin(Math.PI*t),.6),ang=a0+da*t,rho=rho0+amp;
      pts.push({x:rho*Math.cos(ang),z:rho*Math.sin(ang)});
    }
    const cum=[0];for(let n=1;n<=N;n++)cum.push(cum[n-1]+Math.hypot(pts[n].x-pts[n-1].x,pts[n].z-pts[n-1].z));
    const base=[];let n=0;
    for(let i=0;i<SEC;i++){const target=cum[N]*i/SEC;while(cum[n+1]<target)n++;
      const f=(target-cum[n])/(cum[n+1]-cum[n]);base.push({x:pts[n].x+(pts[n+1].x-pts[n].x)*f,z:pts[n].z+(pts[n+1].z-pts[n].z)*f});}
    const ring=[];
    for(let k=0;k<6;k++){const ca=Math.cos(da*k),sa=Math.sin(da*k);
      base.forEach(b=>ring.push({x:b.x*ca-b.z*sa,z:b.x*sa+b.z*ca}));}
    return ring;
  };
  const ok=ring=>{
    const d=(a,b)=>Math.hypot(a.x-b.x,a.z-b.z);
    const n=ring.length;
    for(let i=0;i<n;i++){
      for(let j=i+2;j<n;j++){if(i===0&&j===n-1)continue;if(d(ring[i],ring[j])<1.7)return false;}
      for(const l of lanes)if(d(ring[i],l)<1.7)return false;
    }
    return true;
  };
  let ring=build(1);
  for(let sc=1;sc>0.25&&!ok(ring);sc-=.08)ring=build(sc);
  RINGW=ring;shapeName=shape.name;
}
// Datenlinks haben getrennte Ein- und Ausgänge (gleiche Farbe und gleicher Buchstabe), damit nichts verwirrt.
const PAIR_COLORS=[0xb57bff,0xff7bd5,0x7bffd0,0xffd27b,0x7bb8ff,0xc7ff7b];
const TEMPLATES=[
  ['normal','boost','portal','event','safe','swap','normal','exit','ice','normal','normal'],
  ['normal','safe','portal','boost','event','ice','swap','normal','exit','normal','normal'],
  ['normal','boost','lag','portal','safe','event','normal','exit','ice','normal','normal']];
function layoutCells(){
  cellType=Array(TL).fill('normal');portalPairs=[];
  makeRing();
  for(let k=0;k<6;k++)cellType[k*SEC]='start';
  if(!useSpecials)return;
  const tpl=TEMPLATES[Math.floor(Math.random()*TEMPLATES.length)];
  for(let k=0;k<6;k++)tpl.forEach((t,j)=>{cellType[k*SEC+1+j]=t;});
  const eo=tpl.indexOf('portal')+1,xo=tpl.indexOf('exit')+1;
  for(let k=0;k<6;k++)portalPairs.push({entry:k*SEC+eo,exit:((k+1)%6)*SEC+xo,jump:SEC+xo-eo,letter:'ABCDEF'[k],color:PAIR_COLORS[k]});
}

// ====================== Three.js: Szene ======================
let renderer,scene,camera,controls,composer,bloom,stage=$('stage');
const tweens=[];
let boardG=null,pieceMeshes={},baseSpots={},baseGlow={},startBeams={},rain,tower;

let perf=null;
function initThree(){
  try{renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});}
  catch(e){$('nogl').hidden=false;$('setup').hidden=true;return false;}
  renderer.setPixelRatio(Math.min(devicePixelRatio||1,2));
  renderer.setClearColor(0x05060b);
  stage.appendChild(renderer.domElement);
  scene=new THREE.Scene();
  camera=new THREE.PerspectiveCamera(55,1,.1,700);
  camera.position.set(0,50,35);
  controls=new THREE.OrbitControls(camera,renderer.domElement);
  controls.enableDamping=true;controls.dampingFactor=.08;
  controls.minDistance=10;controls.maxDistance=125;controls.maxPolarAngle=1.38;controls.target.set(0,0,0);
  controls.enablePan=false;
  buildEnvironment();
  try{
    composer=new THREE.EffectComposer(renderer);
    composer.addPass(new THREE.RenderPass(scene,camera));
    bloom=new THREE.UnrealBloomPass(new THREE.Vector2(512,512),.5,.45,.55);
    composer.addPass(bloom);
  }catch(e){composer=null;}
  perf=window.Perf3D?Perf3D.create({r:renderer,resize:resize}):null;
  addEventListener('resize',resize);resize();
  new MutationObserver(()=>{buildEnvironment();if(boardG){buildBoard();for(const k in pieceMeshes)pieceMeshes[k].mine=pieceMeshes[k].p===cur;}}).observe(document.documentElement,{attributes:true,attributeFilter:['data-style']});
  setupPicking();
  requestAnimationFrame(tick);
  return true;
}
function resize(){
  const w=innerWidth,h=innerHeight;
  renderer.setSize(w,h,false);
  if(composer)composer.setSize(w,h);
  camera.aspect=w/h;camera.updateProjectionMatrix();
}
// Kamera so weit zurück, dass die ganze Karte samt Basen auch im Hochformat sichtbar bleibt
function camScale(){return Math.max(1,.85/camera.aspect);}

let envObjs=[],room=null;
function buildEnvironment(){
  envObjs.forEach(o=>scene.remove(o));envObjs=[];rain=null;tower=null;room=null;
  const addEnv=o=>{scene.add(o);envObjs.push(o);return o;};
  if(!CY()){
    // Standard: Wohnzimmer, das Brett steht auf einem runden Holztisch
    scene.fog=new THREE.Fog(0x2a1a10,130,340);renderer.setClearColor(0x2a1a10);
    controls.maxDistance=88;
    room=Room3D.livingRoom(THREE,{half:110,tableTopY:-.45,table:{shape:'round',size:54}});addEnv(room.group);

// ====================== Spielfeld bauen ======================
const geoCache={};
function hexGeo(h,r=SIZE*.93){const k=h+'_'+r;return geoCache[k]||(geoCache[k]=new THREE.CylinderGeometry(r,r,h,6));}
function addTile(parent,w,top,color,emissive,eI,edgeColor,edgeOp=.9){
  const h=top+.4,g=hexGeo(h); // Säule von unten (-0.4) bis zur Oberkante: Hügel wirken wie Hochstraßen
  const mt=CY()?new THREE.MeshStandardMaterial({color,emissive,emissiveIntensity:eI,roughness:.45,metalness:.5})
    :new THREE.MeshStandardMaterial({color:classicTile(color,emissive),roughness:.6,metalness:0});
  const m=new THREE.Mesh(g,mt);
  m.position.set(w.x,top-h/2,w.z);parent.add(m);
  const e=new THREE.LineSegments(new THREE.EdgesGeometry(g),new THREE.LineBasicMaterial({color:CY()?edgeColor:0x7a5a32,transparent:true,opacity:CY()?edgeOp:.5}));
  e.position.copy(m.position);parent.add(e);
  return m;
}
const glyphCache={};
function glyphMesh(text,color,size=1.2){
  if(!CY())color=darker(cl(color),.7);
  const key=text+color+(CY()?'c':'k');
  let tex=glyphCache[key];
  if(!tex){
    const c=document.createElement('canvas');c.width=c.height=128;
    const x=c.getContext('2d');
    x.font='900 74px "Rajdhani","Segoe UI",system-ui,sans-serif';x.textAlign='center';x.textBaseline='middle';
    x.shadowColor=hexCss(color);x.shadowBlur=CY()?14:0;x.fillStyle=hexCss(color);
    x.fillText(text,64,70);x.fillText(text,64,70);
    tex=glyphCache[key]=new THREE.CanvasTexture(c);
  }
  const m=new THREE.Mesh(new THREE.PlaneGeometry(size,size),new THREE.MeshBasicMaterial({map:tex,transparent:true,depthWrite:false}));
  m.rotation.x=-Math.PI/2;return m;
}
const nearest=(list,w)=>{let m=1e9;for(const v of list){const d=Math.hypot(v.x-w.x,v.z-w.z);if(d<m)m=d;}return m;};
function buildBoard(){
  if(boardG){scene.remove(boardG);}
  boardG=new THREE.Group();scene.add(boardG);
  baseSpots={};baseGlow={};startBeams={};portalFx=[];
  const laneSet=new Map();
  for(let k=0;k<6;k++)for(let j=0;j<LN;j++)laneSet.set(laneCell(k,j).join(','),[k,j]);
  const ringPts=RINGW.map((_,i)=>ringPos(i));
  const baseCtr=active.map(p=>{const cw=ringPos(corner[p]*SEC),o=cw.clone().setY(0).normalize();return cw.clone().addScaledVector(o,3.5);});
  // Innenfläche (Sechseck-Raster) mit Terrassen; unter der Strecke und den Basen bleibt Platz
  for(let q=-R-2;q<=R+2;q++)for(let r=-R-2;r<=R+2;r++){
    const d=Math.max(Math.abs(q),Math.abs(r),Math.abs(q+r));
    if(d>R+2)continue;
    const key=q+','+r,w=hex2w([q,r]);
    const lk=laneSet.get(key);
    if(lk!==undefined){
      const owner=active.find(p=>corner[p]===lk[0]);
      if(owner!==undefined){
        const c=PLAYERS[owner].c,top=LANEH[lk[1]];
        addTile(boardG,w,top,0x10131c,c,.3,c,1);
        const gm=glyphMesh('▸',c,.9);gm.position.set(w.x,top+.02,w.z);boardG.add(gm);
        continue;
      }
    }
    if(nearest(ringPts,w)<1.5)continue;
    if(baseCtr.some(c=>Math.hypot(c.x-w.x,c.z-w.z)<2.8))continue;
    addTile(boardG,w,interH(d),0x0a0e18,d<=2?0x063040:0x041a24,.8,d<=2?0x00f0ff:(d<=4?0x14788a:0x0e4a58),d<=2?1:.55);
  }
  // Strecke
  RINGW.forEach((_,i)=>{
    const w=ringPos(i),t=cellType[i],H=RINGH[i];
    if(t==='start'){
      const k=i/SEC,owner=active.find(p=>corner[p]===k);
      if(owner!==undefined){
        const c=PLAYERS[owner].c;
        addTile(boardG,w,H,c,c,.5,0xffffff,1);
        const beam=new THREE.Mesh(new THREE.CylinderGeometry(.12,.55,5,12,1,true),
          new THREE.MeshBasicMaterial({color:CY()?c:cl(c),transparent:true,opacity:CY()?.15:.08,blending:BL(),depthWrite:false,side:THREE.DoubleSide}));
        beam.position.set(w.x,H+2.5,w.z);boardG.add(beam);startBeams[owner]=beam;
      }else addTile(boardG,w,H,0x151a28,0x07101c,.8,0x2a4a5a,.8);
    }else if(t==='normal'){
      addTile(boardG,w,H,0x141a2a,0x0a2a3c,.5,0x00b4d8,.8);
    }else if(t==='portal'||t==='exit'){
      const pr=portalPairs.find(q=>q.entry===i||q.exit===i),entry=pr.entry===i;
      addTile(boardG,w,H,0x10141f,pr.color,entry?.5:.2,pr.color,1);
      const gm=glyphMesh(entry?pr.letter+'»':'»'+pr.letter,pr.color,1.6);gm.position.set(w.x,H+.02,w.z);boardG.add(gm);
    }else{
      const ty=TYPES[t];
      addTile(boardG,w,H,0x10141f,ty.c,.28,ty.c,1);
      const gm=glyphMesh(ty.g,ty.c,1.5);gm.position.set(w.x,H+.02,w.z);boardG.add(gm);
    }
  });
  // leuchtende Straße entlang der Felder
  const road=new THREE.CatmullRomCurve3(ringPts.map((v,i)=>new THREE.Vector3(v.x,RINGH[i]+.03,v.z)),true);
  boardG.add(new THREE.Mesh(new THREE.TubeGeometry(road,TL*8,.07,6,true),
    new THREE.MeshBasicMaterial({color:CY()?0x00b4d8:0xa77a42,transparent:true,opacity:CY()?.55:.8,blending:BL(),depthWrite:false})));
  // Pylone auf den Hügelkuppen (je Sektor gleich)
  for(let k=0;k<6;k++){
    const i=k*SEC+Math.floor(SEC/2),w=ringPos(i),o=w.clone().setY(0).normalize();
    const pw=w.clone().addScaledVector(o,2.3);
    const col=new THREE.Mesh(new THREE.CylinderGeometry(.14,.2,9,6),new THREE.MeshStandardMaterial({color:0x0b0e18,emissive:CY()?0x00f0ff:0x3a2412,emissiveIntensity:CY()?.5:.4,metalness:CY()?.6:.1,roughness:.4}));
    col.position.set(pw.x,4.2,pw.z);boardG.add(col);
    for(let r=0;r<3;r++){
      const ring=new THREE.Mesh(new THREE.TorusGeometry(.45,.04,6,24),new THREE.MeshBasicMaterial({color:r%2?0xff2fa8:0x00f0ff}));
      ring.rotation.x=Math.PI/2;ring.position.set(pw.x,2.5+r*2.2,pw.z);boardG.add(ring);
    }
  }
  // Datenlinks: farbiger Bogen vom Eingang zum Ausgang, Lichtpunkt zeigt die Richtung
  portalPairs.forEach(pr=>{
    const a=ringPos(pr.entry,RINGH[pr.entry]+.6),b=ringPos(pr.exit,RINGH[pr.exit]+.6);
    const mid=a.clone().add(b).multiplyScalar(.5);mid.y+=a.distanceTo(b)*.5;
    const curve=new THREE.QuadraticBezierCurve3(a,mid,b);
    boardG.add(new THREE.Mesh(new THREE.TubeGeometry(curve,40,.05,6,false),
      new THREE.MeshBasicMaterial({color:CY()?pr.color:darker(pr.color,.8),transparent:true,opacity:.7,blending:BL(),depthWrite:false})));
    const pulse=new THREE.Mesh(new THREE.SphereGeometry(.24,10,10),new THREE.MeshBasicMaterial({color:0xffffff}));
    boardG.add(pulse);portalFx.push({pulse,curve,off:Math.random()});
  });
  // Basen
  active.forEach(p=>{
    const c=PLAYERS[p].c,cw=ringPos(corner[p]*SEC);
    const o=new THREE.Vector3(cw.x,0,cw.z).normalize(),pv=new THREE.Vector3(-o.z,0,o.x);
    const ctr=cw.clone().addScaledVector(o,3.5);
    const plat=new THREE.Mesh(new THREE.CylinderGeometry(2.3,2.5,.3,6),new THREE.MeshStandardMaterial(CY()?{color:0x0b0e18,emissive:c,emissiveIntensity:.25,roughness:.5,metalness:.6}:{color:darker(cl(c),.8),emissive:c,emissiveIntensity:0,roughness:.6}));
    plat.position.set(ctr.x,.15,ctr.z);boardG.add(plat);baseGlow[p]=plat;
    const edge=new THREE.LineSegments(new THREE.EdgesGeometry(plat.geometry),new THREE.LineBasicMaterial({color:CY()?c:cl(c)}));
    edge.position.copy(plat.position);boardG.add(edge);
    const bridge=new THREE.Mesh(new THREE.BoxGeometry(.5,.12,1.9),new THREE.MeshBasicMaterial({color:CY()?c:cl(c),transparent:true,opacity:.75}));
    const bp=cw.clone().addScaledVector(o,1.55);bridge.position.set(bp.x,.2,bp.z);bridge.rotation.y=Math.atan2(o.x,o.z);boardG.add(bridge);
    baseSpots[p]=[[-.8,-.8],[.8,-.8],[-.8,.8],[.8,.8]].map(([a,b])=>ctr.clone().addScaledVector(o,a).addScaledVector(pv,b).setY(.3));
  });
  // Figuren
  for(const k in pieceMeshes)scene.remove(pieceMeshes[k].g);
  pieceMeshes={};
  active.forEach(p=>{for(let i=0;i<4;i++){const pm=makePiece(p,i);pieceMeshes[p+'-'+i]=pm;scene.add(pm.g);}});
  placeAll();
}
function makePiece(p,i){
  const col=PLAYERS[p].c,pcol=CY()?col:cl(col),g=new THREE.Group();
  const body=CY()?new THREE.Mesh(new THREE.CylinderGeometry(.2,.34,.62,6),new THREE.MeshStandardMaterial({color:col,emissive:col,emissiveIntensity:.95,roughness:.3,metalness:.6}))
    :new THREE.Mesh(new THREE.CylinderGeometry(.12,.36,.7,24),new THREE.MeshStandardMaterial({color:pcol,emissive:pcol,emissiveIntensity:0,roughness:.4}));

  head.position.y=CY()?.88:.84;g.add(head);
  const ring=new THREE.Mesh(new THREE.RingGeometry(.42,.52,40),new THREE.MeshBasicMaterial({color:pcol,transparent:true,opacity:0,side:THREE.DoubleSide,depthWrite:false}));
  ring.rotation.x=-Math.PI/2;ring.position.y=.03;g.add(ring);

  beam.position.y=1.6;g.add(beam);

function worldOf(p,i){
  const pos=pieces[p][i];

function placePiece(p,i){const pm=pieceMeshes[p+'-'+i];if(pm){pm.g.position.copy(worldOf(p,i));pm.g.scale.set(1,1,1);}}
function placeAll(){active.forEach(p=>{for(let i=0;i<4;i++)placePiece(p,i);});}

// ====================== Tweens / Render-Loop ======================
function tween(dur,fn,t=token){
  return new Promise(res=>tweens.push({t0:performance.now(),dur:dur/SPEED,fn,res,t}));
}
const ease=k=>k*k*(3-2*k);
function hop(g,to,dur=260,h=.9){
  const from=g.position.clone();
  return tween(dur,k=>{
    const e=ease(k);g.position.lerpVectors(from,to,e);g.position.y+=Math.sin(k*Math.PI)*h;
  }).then(()=>g.position.copy(to));
}
function runTweens(now){
  for(let i=tweens.length-1;i>=0;i--){
    const tw=tweens[i],k=Math.min(1,(now-tw.t0)/tw.dur);
    if(tw.t!==token){tweens.splice(i,1);continue;}
    tw.fn(k);
    if(k>=1){tweens.splice(i,1);tw.res();}
  }
}
// Pausiert der Browser requestAnimationFrame (Tab im Hintergrund), laufen die Animationen trotzdem weiter.
setInterval(()=>runTweens(performance.now()),50);
let lastT=performance.now();
function tick(now){
  requestAnimationFrame(tick);
  if(perf)perf.frame(now);
  const dt=Math.min(.05,(now-lastT)/1000);lastT=now;
  runTweens(now);
  const t=now/1000;
  if(tower){tower.children.forEach(c=>{if(c.userData.s)c.rotation.z+=c.userData.s*dt;});}
  portalFx.forEach(f=>f.curve.getPoint((t*.3+f.off)%1,f.pulse.position));
  if(rain)rain.update(dt);
  if(room)room.update(t);
  for(const k in pieceMeshes){
    const pm=pieceMeshes[k];
    pm.head.rotation.y+=dt*2;
    const pulse=.5+.5*Math.sin(t*6+pm.i);
    pm.ring.material.opacity=pm.can?.6+.4*pulse:(pm.mine?.35:0);
    pm.beam.material.opacity=pm.can?.2+.25*pulse:0;
    pm.body.material.emissiveIntensity=CY()?(pm.can?1.1+.6*pulse:(pm.mine?.95:.55)):(pm.can?.35+.3*pulse:(pm.mine?.1:0));
  }
  active.forEach(p=>{
    const on=p===cur,pl=.5+.5*Math.sin(t*4);
    if(baseGlow[p])baseGlow[p].material.emissiveIntensity=CY()?(on?.5+.6*pl:.12):(on?.12+.22*pl:0);
    if(startBeams[p])startBeams[p].material.opacity=(on?.22+.3*pl:.07)*(CY()?1:.4);
  });
  controls.update();
  if(composer&&glow&&CY())composer.render();else renderer.render(scene,camera);
}

function focusCorner(p){
  if(!follow||p===undefined||p<0)return;
  const cw=ringPos(corner[p]*SEC);
  const a=Math.atan2(cw.x,cw.z);
  const off=camera.position.clone().sub(controls.target);
  const r=Math.hypot(off.x,off.z),y=off.y;
  const a0=Math.atan2(off.x,off.z);
  let da=a-a0;da=Math.atan2(Math.sin(da),Math.cos(da));
  tween(1100,k=>{
    const aa=a0+da*ease(k);
    camera.position.set(controls.target.x+Math.sin(aa)*r,controls.target.y+y,controls.target.z+Math.cos(aa)*r);
  });
}
$('camIso').onclick=()=>{camTo(0,50,35);};
$('camTop').onclick=()=>{camTo(0,72,.01);};
function camTo(x,y,z){
  const to=new THREE.Vector3(x,y,z).multiplyScalar(camScale()),from=camera.position.clone(),tg=controls.target.clone();
  tween(800,k=>{camera.position.lerpVectors(from,to,ease(k));controls.target.lerpVectors(tg,new THREE.Vector3(),ease(k));});
}
$('followBtn').onclick=()=>{follow=!follow;$('followBtn').textContent='Kamera folgt: '+(follow?'an':'aus');if(follow)focusCorner(cur);};
$('glowBtn').onclick=()=>{glow=!glow;$('glowBtn').textContent='Glow: '+(glow?'an':'aus');};

// ====================== Eingabe (Figuren anklicken) ======================
function setupPicking(){
  const ray=new THREE.Raycaster(),mouse=new THREE.Vector2();
  let down=null;
  renderer.domElement.addEventListener('pointerdown',e=>{down={x:e.clientX,y:e.clientY,t:performance.now()};});
  renderer.domElement.addEventListener('pointerup',e=>{
    if(!down||!pick)return;
    if(netRole!=='client'&&!isLocal(pick.p))return;     // Figuren von Online-Spielern darf nur ihr Besitzer ziehen
    const moved=Math.hypot(e.clientX-down.x,e.clientY-down.y),dt=performance.now()-down.t;down=null;
    if(moved>8||dt>600)return;
    const r=renderer.domElement.getBoundingClientRect();
    mouse.set(((e.clientX-r.left)/r.width)*2-1,-((e.clientY-r.top)/r.height)*2+1);
    ray.setFromCamera(mouse,camera);
    const hits=pick.moves.map(m=>pieceMeshes[pick.p+'-'+m.i].hit);
    const hit=ray.intersectObjects(hits,false)[0];
    if(!hit)return;
    const m=pick.moves.find(m=>m.i===hit.object.userData.i);
    if(m)choose(m);
  });
}
function choose(m){if(!pick)return;const r=pick.res;pick=null;markMovable(null);netPhase={k:'idle'};r(m);}
function markMovable(p,moves){
  for(const k in pieceMeshes)pieceMeshes[k].can=false;
  if(p==null)return;
  moves.forEach(m=>{pieceMeshes[p+'-'+m.i].can=true;});
}

async function doRoll(p,label){
  const btn=$('rollBtn');
  if(cfg[p]==='remote'){
    netPhase={k:'roll',p,label:label||''};say(`${nm(p)} ist am Zug …`,false);netPush();
    await new Promise(res=>{remoteRoll=res;});remoteRoll=null;
  }else if(isLocal(p)){
    btn.disabled=false;btn.textContent=label||rollLabel();
    say(`${nm(p)}: Klicke auf <b>${label||rollLabel()}</b>.`,false);
    netPhase={k:'idle'};netPush();
    await new Promise(res=>{rollWait=res;});
    rollWait=null;btn.disabled=true;
  }else{
    say(`${nm(p)} würfelt …`,false);
    await sleep(400);
  }
  const t=token;
  netPhase={k:'rolling',p};netPush();
  for(let k=0;k<rollFrames;k++){dieFrame(k);await sleep(45,t);}
  const v=1+Math.floor(Math.random()*6);dieDone(v);lastRoll=v;
  netPhase={k:'idle'};netPush();
  return v;
}
function pickMove(p,moves){
  return new Promise(async res=>{
    const t=token;markMovable(p,moves);
    say(isLocal(p)?`${nm(p)}: eine <b>${lastRoll}</b>. Tippe auf eine leuchtende Figur.`:`${nm(p)} hat eine <b>${lastRoll}</b> und wählt …`,false);
    pick={p,moves,res};netPhase={k:'pick',p,moves:moves.map(m=>m.i)};netPush();
    if(moves.length===1){
      try{await sleep(650,t);}catch(e){return;}
      if(pick&&pick.res===res)choose(moves[0]);
    }
  });
}
function aiPick(p,roll,moves){
  const danger=abs=>{
    if(cellType[abs]==='safe')return false;
    return active.some(q=>q!==p&&pieces[q].some((x,j)=>onRing(q,j)&&((abs-absIdx(q,x)+TL)%TL)>=1&&((abs-absIdx(q,x)+TL)%TL)<=6));
  };
  const scored=moves.map(m=>{
    const pos=pieces[p][m.i],np=m.to;let s=Math.random();
    if(np<TL){
      const abs=absIdx(p,np);
      if(occupant(abs,p))s+=100;
      if(danger(abs))s-=25;
      const t=cellType[abs];
      s+={boost:26,ice:-26,safe:10,swap:14,event:4,lag:-22,portal:6}[t]||0;
    }
    if(pos>=0&&pos<TL&&danger(absIdx(p,pos)))s+=20;
    if(pos===-1)s+=50;
    if(np>=TL&&pos<TL)s+=60;
    s+=np*.3;
    return {m,s};
  }).sort((a,b)=>b.s-a.s);
  return scored[0].m;
}

async function walkTo(p,i,target){
  const pm=pieceMeshes[p+'-'+i];
  let pos=pieces[p][i];
  while(pos!==target){
    pos+=target>pos?1:-1;
    pieces[p][i]=pos;
    await hop(pm.g,worldOf(p,i),pos===0&&target>=0?280:200,.7);
  }
}
async function captureAt(p,abs){
  const hit=occupant(abs,p);
  if(!hit)return;
  const [q,j]=hit;
  say(`${nm(p)} wirft eine Figur von ${nm(q)} raus!`);
  pieces[q][j]=-1;
  await hop(pieceMeshes[q+'-'+j].g,worldOf(q,j),520,3);
}
async function applyMove(p,m){
  const pm=pieceMeshes[p+'-'+m.i];
  if(pieces[p][m.i]===-1){
    pieces[p][m.i]=0;await hop(pm.g,worldOf(p,m.i),420,1.8);
  }else await walkTo(p,m.i,m.to);
  const pos=pieces[p][m.i];
  if(pos<TL)await captureAt(p,absIdx(p,pos));
  await sleep(150);
  if(pos<TL&&useSpecials)await resolveCell(p,m.i);
  showScores();
}

async function resolveCell(p,i){
  const pos=pieces[p][i],abs=absIdx(p,pos),t=cellType[abs];
  const pm=pieceMeshes[p+'-'+i];
  if(t==='boost'||t==='ice'){
    const d=t==='boost'?3:-3,to=Math.max(0,pos+d);
    say(t==='boost'?`${nm(p)}: <b>Overclock!</b> 3 Felder vor.`:`${nm(p)}: <b>ICE-Falle!</b> 3 Felder zurück.`);
    await sleep(500);
    await shiftTo(p,i,to);
  }else if(t==='portal'){
    const pr=portalPairs.find(q=>q.entry===abs),np=pos+pr.jump;
    say(`${nm(p)}: <b>${cyTx('Datenlink','Portal')} ${pr.letter}!</b> Weiter zum Ausgang »${pr.letter}.`);
    await sleep(500);
    if(np>TL-1||!canLand(p,i,np)){say(cyTx('Der Datenlink ist überlastet. Nichts passiert.','Das Portal ist blockiert. Nichts passiert.'));return;}
    await tween(300,k=>{pm.g.scale.setScalar(1-k*.95);});
    pieces[p][i]=np;pm.g.position.copy(worldOf(p,i));
    await tween(300,k=>{pm.g.scale.setScalar(.05+k*.95);});
    await captureAt(p,absIdx(p,np));
  }else if(t==='swap'){
    let best=null;
    for(const q of active){if(q===p)continue;
      for(let j=0;j<4;j++){
        if(!onRing(q,j))continue;
        const a=absIdx(q,pieces[q][j]);
        if(cellType[a]==='safe')continue;
        if(!best||pieces[q][j]>pieces[best[0]][best[1]])best=[q,j];
      }}
    if(!best){say(`${nm(p)}: <b>Tausch</b>, aber kein Ziel auf der Karte.`);return;}
    const [q,j]=best,qa=absIdx(q,pieces[q][j]),pa=abs;
    say(`${nm(p)}: <b>Tausch!</b> Platz mit ${nm(q)} getauscht.`);
    await sleep(400);
    const g1=pm.g,g2=pieceMeshes[q+'-'+j].g;
    pieces[p][i]=(qa-startIdx[p]+TL)%TL;
    pieces[q][j]=(pa-startIdx[q]+TL)%TL;
    await Promise.all([hop(g1,worldOf(p,i),700,2.4),hop(g2,worldOf(q,j),700,2.4)]);
  }else if(t==='safe'){
    say(`${nm(p)}: <b>Sicherer Knoten.</b> Hier kann dich niemand schlagen.`);
    await sleep(350);
  }else if(t==='lag'){
    skip[p]=1;
    say(`${nm(p)}: <b>Lag!</b> Die nächste Runde setzt aus.`);
    await sleep(700);
  }else if(t==='event'){
    await eventChallenge(p,i);
  }
}
async function shiftTo(p,i,to){
  const pm=pieceMeshes[p+'-'+i],pos=pieces[p][i];
  if(to===pos)return;
  if(!canLand(p,i,to)){say('Das Zielfeld ist blockiert.');return;}
  await walkTo(p,i,to);
  if(to<TL)await captureAt(p,absIdx(p,to));
}
async function eventChallenge(p,i){
  const target=1+Math.floor(Math.random()*6);
  $('eventNum').textContent=target;
  $('eventTxt').textContent=`${PLAYERS[p].n}: würfle die ${target}`;
  $('eventCard').hidden=false;evState={num:target,txt:$('eventTxt').textContent};netPush();
  say(`${nm(p)}: <b>${cyTx('Hack-Terminal','Würfel-Feld')}!</b> Würfle eine <b>${target}</b>: Treffer +6, sonst −2.`);
  const roll=await doRoll(p,`${cyTx('Hacken','Würfeln')} (${target})`);
  await sleep(500);
  $('eventCard').hidden=true;evState=null;netPush();
  const pos=pieces[p][i];
  if(roll===target){
    say(`${nm(p)}: <b>Zugriff erfolgreich!</b> 6 Felder vor.`);
    let to=pos+6;
    while(to>pos&&!canLand(p,i,to))to--;
    await shiftTo(p,i,to);
  }else{
    say(`${nm(p)}: eine ${roll}. <b>Zugriff verweigert</b>, 2 Felder zurück.`);
    await sleep(400);
    await shiftTo(p,i,Math.max(0,pos-2));
  }
}

async function playTurn(p){
  if(skip[p]>0){
    skip[p]--;showScores();
    say(`${nm(p)} steckt im <b>Lag</b> und setzt aus.`);
    await sleep(1400);return false;
  }
  let tries=isWaiting(p)?3:1;
  for(;;){
    const roll=await doRoll(p);
    const moves=legalMoves(p,roll);
    if(moves.length){
      const mv=isHuman(p)?await pickMove(p,moves):(await sleep(500),aiPick(p,roll,moves));
      await applyMove(p,mv);
      if(wins(p))return true;
      if(roll===6){tries=isWaiting(p)?3:1;say(`${nm(p)}: Eine 6! Nochmal würfeln.`);await sleep(700);continue;}
      return false;
    }
    say(`${nm(p)}: ${roll}, kein Zug möglich.`);
    await sleep(900);
    if(--tries<=0)return false;
  }
}
async function gameLoop(){
  try{
    let i=0;
    for(;;){
      cur=active[i%active.length];
      showTurn(cur);
      if(await playTurn(cur)){
        $('winTitle').innerHTML=`${chip(cur)}${PLAYERS[cur].n}${names[cur]?' ('+esc(names[cur])+')':''} gewinnt! 🎉`;
        $('winBox').hidden=false;netPhase={k:'win',p:cur};netPush();return;
      }
      i++;
    }
  }catch(e){if(e!==CANCEL)throw e;}
}

// ====================== Start / Setup ======================
function buildSetup(){
  const def=['human','cpu','cpu','off','off','off'];
  $('slots').innerHTML=PLAYERS.map((c,p)=>`
    <div class="row"><label><span class="chip" style="background:${hexCss(c.c)}"></span>${c.n}</label>
    <select id="slot${p}"><option value="human">Mensch</option><option value="cpu">Computer</option><option value="off">Aus</option></select></div>`).join('');
  def.forEach((d,p)=>$('slot'+p).value=d);
}
function startGame(){
  cfg=PLAYERS.map((_,p)=>$('slot'+p).value);names=[];
  if(cfg.filter(c=>c!=='off').length<2){$('setupErr').textContent='Bitte mindestens 2 Spieler wählen.';return;}
  $('setupErr').textContent='';
  useSpecials=$('specials').value==='1';
  launch();
}
function launch(){            // startet mit den Werten in cfg, names und useSpecials
  active=PLAYERS.map((_,p)=>p).filter(p=>cfg[p]!=='off');
  token++;pick=null;rollWait=null;remoteRoll=null;netPhase={k:'idle'};evState=null;cur=-1;logLines=[];tweens.length=0;
  const cs=CORNER_SETS[active.length];
  corner=[];startIdx=[];skip=[];pieces=[];
  active.forEach((p,k)=>{corner[p]=cs[k];startIdx[p]=cs[k]*SEC;skip[p]=0;pieces[p]=[-1,-1,-1,-1];});
  layoutCells();buildBoard();buildLegend();
  camera.position.set(0,50,35).multiplyScalar(camScale());controls.target.set(0,0,0);
  $('setup').hidden=true;$('winBox').hidden=true;$('hud').hidden=false;$('eventCard').hidden=true;
  $('log').innerHTML='';$('rollBtn').disabled=true;setDie(0);showScores();
  say(`Kartenform: <b>${shapeName}</b>. Alle Sektoren sind gleich, jeder läuft dieselbe Strecke.`);
  gameLoop();
}
function backToSetup(){
  token++;pick=null;rollWait=null;
  $('hud').hidden=true;$('winBox').hidden=true;$('setup').hidden=false;
}
$('start').onclick=startGame;
$('againBtn').onclick=backToSetup;
$('winBtn').onclick=backToSetup;
const rollClick=()=>{
  if(netRole==='client'){if(canRollNet){canRollNet=false;$('rollBtn').disabled=true;sendHost({t:'roll'});}}
  else if(rollWait)rollWait();
};
$('rollBtn').onclick=rollClick;$('die').onclick=rollClick;

// ====================== Mehrspieler (Host und Mitspieler) ======================
// Der Host führt das Spiel (Würfeln, Regeln, Computer) und schickt nach jedem Schritt den Stand.
// Mitspieler zeigen ihn nur an und melden "Würfeln" und "Figur gewählt". Verbindung: ../net.js
let L=null,pushQ=false,lastCur=-1,cRolling=false,rollAnim=null;
function safeHtml(html){          // Meldungen vom Host nur mit <b> und den Farbpunkten zulassen
  const t=document.createElement('template');t.innerHTML=String(html);
  const out=document.createElement('div');
  (function walk(from,to){
    from.childNodes.forEach(n=>{
      if(n.nodeType===3){to.appendChild(document.createTextNode(n.nodeValue));return;}
      if(n.nodeType!==1)return;
      if(n.tagName==='B'||n.tagName==='SMALL'){const b=document.createElement(n.tagName.toLowerCase());walk(n,b);to.appendChild(b);}
      else if(n.tagName==='SPAN'&&n.className==='chip'){
        const sp=document.createElement('span');sp.className='chip';
        const m=/#[0-9a-fA-F]{6}/.exec(n.getAttribute('style')||'');if(m)sp.style.background=m[0];to.appendChild(sp);
      }else walk(n,to);
    });
  })(t.content,out);
  return out.innerHTML;
}
netPush=function(){
  if(netRole!=='host'||!netPlaying||pushQ)return;
  pushQ=true;queueMicrotask(()=>{pushQ=false;bcastSnap();});
};
function initObj(){return {cfg,names,active,corner,startIdx,skip,pieces,cellType,portalPairs,RINGW,shapeName,useSpecials};}
function snapObj(){return {pieces,skip,cur,die:lastRoll,msg:$('msg').innerHTML,log:logLines.slice(-8),phase:netPhase,ev:evState};}
function bcastInit(){if(netRole==='host')L.broadcast({t:'init',d:initObj()});}
function bcastSnap(){if(netRole==='host')L.broadcast({t:'snap',s:snapObj()});}
// Der Stand ändert sich bei diesen Aufrufen: danach weiterschicken
['hop','tween','say','showTurn','markMovable'].forEach(n=>{const f=window[n];window[n]=function(){const r=f.apply(this,arguments);netPush();return r;};});

function applyInit(d){
  cfg=d.cfg;names=d.names||[];active=d.active;corner=d.corner;startIdx=d.startIdx;skip=d.skip||[];pieces=d.pieces;
  cellType=d.cellType;portalPairs=d.portalPairs;RINGW=d.RINGW;shapeName=d.shapeName;useSpecials=d.useSpecials;
  token++;pick=null;cur=-1;lastCur=-1;logLines=[];tweens.length=0;
  buildBoard();buildLegend();
  camera.position.set(0,50,35).multiplyScalar(camScale());controls.target.set(0,0,0);
  $('setup').hidden=true;$('winBox').hidden=true;$('hud').hidden=false;$('eventCard').hidden=true;
  $('log').innerHTML='';$('rollBtn').disabled=true;setDie(0);showScores();cReady=true;
}
function applySnap(s){
  if(!cReady)return;
  s.pieces.forEach((arr,p)=>{
    if(!arr||!pieces[p])return;
    arr.forEach((v,i)=>{
      if(pieces[p][i]===v)return;
      const prev=pieces[p][i];pieces[p][i]=v;
      const pm=pieceMeshes[p+'-'+i];
      if(pm){pm.g.scale.setScalar(1);const back=prev>=0&&v===-1;hop(pm.g,worldOf(p,i),back?520:220,back?3:.7);}
    });
  });
  skip=s.skip||skip;
  if(s.cur!==cur){cur=s.cur;showTurn(cur);}else showScores();
  $('msg').innerHTML=safeHtml(s.msg);
  logLines=(s.log||[]).map(safeHtml);
  $('log').innerHTML=logLines.slice(-8).reverse().map(l=>`<div>${l}</div>`).join('');
  const ph=s.phase||{k:'idle'};
  if(ph.k==='rolling'){
    if(!cRolling){cRolling=true;let k=0;clearInterval(rollAnim);rollAnim=setInterval(()=>dieFrame(k++%rollFrames),45);}
  }else if(cRolling){cRolling=false;clearInterval(rollAnim);dieDone(s.die);}
  const myRoll=ph.k==='roll'&&ph.p===mySlot;
  canRollNet=myRoll;$('rollBtn').disabled=!myRoll;$('rollBtn').textContent=ph.label||rollLabel();
  if(myRoll)$('msg').innerHTML=`${chip(mySlot)}Du bist dran: Klicke auf <b>${esc(ph.label||rollLabel())}</b>.`;
  if(ph.k==='pick'&&ph.p===mySlot){
    pick={p:mySlot,moves:ph.moves.map(i=>({i})),res:m=>sendHost({t:'pick',i:m.i})};
    markMovable(mySlot,pick.moves);
    $('msg').innerHTML=`${chip(mySlot)}Du hast eine <b>${s.die}</b>. Tippe auf eine leuchtende Figur.`;
  }else{pick=null;markMovable(null);}
  if(s.ev){$('eventNum').textContent=s.ev.num;$('eventTxt').textContent=s.ev.txt;$('eventCard').hidden=false;}else $('eventCard').hidden=true;
  document.title=(myRoll||(ph.k==='pick'&&ph.p===mySlot))?'▶ Du bist dran! – Netrunner ärgere dich nicht':'Netrunner ärgere dich nicht';
  if(ph.k==='win'){
    $('winTitle').innerHTML=`${chip(ph.p)}${PLAYERS[ph.p].n}${names[ph.p]?' ('+esc(names[ph.p])+')':''} gewinnt! 🎉`;
    $('winBox').hidden=false;
  }
}
sendHost=function(m){L.send(m);};

function dropPlayer(i){            // Mitspieler weg: der Computer übernimmt
  cfg[i]='cpu';
  say(`${chip(i)}<b>${PLAYERS[i].n}${names[i]?' ('+esc(names[i])+')':''}</b> ist weg, der Computer übernimmt.`);
  if(remoteRoll&&netPhase.k==='roll'&&netPhase.p===i)remoteRoll();
  if(pick&&pick.p===i){const r=pick.res,m=aiPick(i,lastRoll,pick.moves);pick=null;markMovable(null);netPhase={k:'idle'};r(m);}
  showScores();netPush();
}
L=MP.init({
  prefix:'ndn-v1-',title:'Netrunner ärgere dich nicht',
  seats:PLAYERS.map(c=>({name:c.n,color:hexCss(c.c)})),minPlayers:2,bots:true,
  onStart(info){
    netRole=info.role;mySlot=info.you;$('onlineEnd').hidden=false;
    if(info.role==='host'){
      cfg=info.seats.map(x=>x.type==='host'?'human':x.type==='remote'?'remote':x.type==='cpu'?'cpu':'off');
      names=info.seats.map(x=>(x.type==='host'||x.type==='remote')?x.name:'');
      useSpecials=$('specials').value==='1';netPlaying=true;
      launch();bcastInit();bcastSnap();
    }else{cReady=false;}
  },
  onData(from,m){
    if(!m)return;
    if(netRole==='host'){
      if(m.t==='roll'){if(remoteRoll&&netPhase.k==='roll'&&netPhase.p===from)remoteRoll();}
      else if(m.t==='pick'&&pick&&pick.p===from&&cfg[from]==='remote'){
        const mv=pick.moves.find(x=>x.i===m.i);
        if(mv){const r=pick.res;pick=null;markMovable(null);netPhase={k:'idle'};r(mv);}
      }
    }else if(m.t==='init')applyInit(m.d);
    else if(m.t==='snap')applySnap(m.s);
  },
  onSeatDrop(i){dropPlayer(i);},
  onBackToLobby(){token++;cReady=false;clearInterval(rollAnim);cRolling=false;$('hud').hidden=true;$('winBox').hidden=true;$('setup').hidden=false;document.title='Netrunner ärgere dich nicht';},
  onLeave(why){netRole='local';mySlot=-1;cReady=false;$('onlineEnd').hidden=true;token++;$('hud').hidden=true;$('winBox').hidden=true;$('setup').hidden=false;}
});
function leaveOnline(){
  L.leave();netRole='local';netPlaying=false;mySlot=-1;cReady=false;clearInterval(rollAnim);cRolling=false;
  $('onlineEnd').hidden=true;token++;pick=null;rollWait=null;remoteRoll=null;
  $('hud').hidden=true;$('winBox').hidden=true;$('setup').hidden=false;document.title='Netrunner ärgere dich nicht';
}
$('onlineBtn').onclick=()=>L.open();
$('onlineEnd').onclick=leaveOnline;
$('plist').addEventListener('click',e=>{const b=e.target.closest('[data-bot]');if(b&&netRole==='host')L.kick(+b.dataset.bot);});
// "Neues Spiel": Host zurück in die Lobby (Online-Spieler bleiben im Raum), Mitspieler warten
const _back=backToSetup;
backToSetup=function(){
  if(netRole==='client'){$('winBox').hidden=true;return;}
  _back();
  if(netRole==='host'){netPlaying=false;L.backToLobby();}
};
$('winBtn').onclick=()=>backToSetup();$('againBtn').onclick=()=>backToSetup();
buildSetup();setDie(0);
if(!window.THREE||!initThree()){$('setup').hidden=true;$('nogl').hidden=false;}
</script>
