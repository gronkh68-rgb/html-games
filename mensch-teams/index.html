<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mädn Teams</title>
<link rel="stylesheet" href="../common.css">
<script>window.DARK_STYLE=1;</script>
<script src="../theme.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.2/peerjs.min.js"></script>
<script>window.Peer||document.write('<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"><\/script>')</script>
<script src="../net-config.js"></script>
<script src="../net.js"></script>

<style>
.wrap{max-width:1400px}
.hk-layout{grid-template-columns:minmax(0,1fr) 310px}
.bw{width:min(100%,calc(100vh - 170px));min-width:320px;margin:0 auto}
.bw.wide{width:100%;max-width:1150px}
/* Stile (2D): Cyber = Neon auf Dunkelblau, Dunkel = flach grau, Standard = helles Holz */
html[data-style="cyber"] #svg{background:radial-gradient(ellipse at 50% 45%,#0b1a2e,#04070d);border-color:#00f0ff88;box-shadow:0 0 24px rgba(0,240,255,.25)}
html[data-style="cyber"] .fld.trk{fill:rgba(0,240,255,.06);stroke:#00cfff99;stroke-width:1.7}
html[data-style="cyber"] .pc{filter:drop-shadow(0 0 4px rgba(255,255,255,.55))}
html[data-style="dark"] #svg{background:#0d0f14;border-color:#2a2f3b}
html[data-style="dark"] .fld.trk{fill:#1b1f29;stroke:#343b4a;stroke-width:1.5}
html[data-style="dark"] #svg text.lbl{fill:#cfd5e4}
html:not([data-style]) #svg{background:radial-gradient(ellipse at 50% 45%,#d9b98a,#a67b4b);border-color:#6b4a2b}
html:not([data-style]) .fld.trk{fill:#f4ecd8;stroke:#7a5a32;stroke-width:1.6}
html:not([data-style]) #svg text.lbl{fill:#3a2412}
@media (prefers-color-scheme:light){html:not([data-style]) .modbox{fill:rgba(255,255,255,.6)}}
.modbox{fill:rgba(0,0,0,.45);stroke:#ffd23f;stroke-width:2.5}
.pc.wait{stroke:#ffd23f;stroke-width:3.4;stroke-dasharray:4 3}
.trl,.trl2{pointer-events:none}.trl2{animation:trlflow .7s linear infinite}@keyframes trlflow{to{stroke-dashoffset:-12}}
.dirA{pointer-events:none;animation:dirflow 1.6s ease-in-out infinite}@keyframes dirflow{0%,100%{opacity:.3}45%{opacity:1}}
#svg{width:100%;height:auto;display:block;background:radial-gradient(ellipse at 50% 45%,#2b3a55,#141c2e);border:3px solid #0b1424;border-radius:18px;transition:border-color .3s,box-shadow .3s}
#svg.myturn{border-color:#ffd23f;box-shadow:0 0 0 3px rgba(255,210,63,.3),0 0 40px rgba(255,210,63,.25)}
html[data-style="cyber"] #svg{background:radial-gradient(ellipse at 50% 45%,#0b1a2e,#04070d);border-color:#00f0ff55}
.pcg{transition:transform .3s cubic-bezier(.3,.8,.3,1)}
.pc{stroke:#fff;stroke-width:2.2;cursor:default}
.pc.can{cursor:pointer;animation:pcp .7s ease-in-out infinite alternate}
@keyframes pcp{from{stroke-width:2.2;filter:drop-shadow(0 0 0 #fff)}to{stroke-width:4.5;filter:drop-shadow(0 0 6px #ffd23f)}}
.tgt{fill:rgba(255,210,63,.35);stroke:#ffd23f;stroke-width:2.5;cursor:pointer}
.lastring{fill:none;stroke:#fff;stroke-width:2.5;stroke-dasharray:4 3}
.fld{stroke:rgba(255,255,255,.25);stroke-width:1.5}
.lbl{font:700 13px system-ui,sans-serif;fill:#fff;text-anchor:middle;pointer-events:none}
.tm{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:10px;border:2px solid transparent;font-size:.9rem}
.tm.turn{border-color:#ffd23f;background:rgba(255,210,63,.1)}
.tm .dot{width:16px;height:16px;border-radius:50%;flex:none;border:2px solid #fff}
.tm small{color:var(--muted)}
.tm b{margin-left:auto}
.bar{height:6px;border-radius:3px;background:rgba(255,255,255,.12);overflow:hidden;margin-top:3px}.bar i{display:block;height:100%;background:#3ddc84}
/* Würfelfläche = das ganze Brett (kein Tablett): die Würfel werden über das Spielfeld geschnippt */
.bw{position:relative}
#diceDock{position:absolute;inset:0;z-index:8;pointer-events:none}
#stage3d{position:relative;width:100%;height:min(74vh,760px);min-height:360px;border-radius:14px;overflow:hidden;border:2px solid #0b1424;background:#07090f}
#stage3d canvas{display:block;width:100%;height:100%;touch-action:none}
body.full3d{overflow:hidden}body.full3d .top,body.full3d footer{display:none}
body.full3d #stage3d{position:fixed;inset:0;width:auto;height:auto;min-height:0;border:0;border-radius:0;z-index:20}
body.full3d .hk-layout{display:block}body.full3d .hk-main,body.full3d .hk-side{display:contents}
body.full3d #hkBanner{position:fixed;top:8px;left:50%;transform:translateX(-50%);z-index:30;max-width:min(92vw,720px);padding:6px 16px;font-size:.95rem}
body.full3d #hkStatus{position:fixed;bottom:8px;left:50%;transform:translateX(-50%);z-index:30;max-width:min(92vw,720px);min-height:0;padding:5px 14px;font-size:.9rem}
body.full3d .hk-side>*:not(.panel:has(#fs3)):not(.panel:has(#teams)){display:none}
body.full3d .panel:has(#fs3){position:fixed;top:8px;right:8px;z-index:40;margin:0;padding:6px;background:rgba(10,14,28,.7);border:0}
body.full3d .panel:has(#fs3) .row{flex-wrap:nowrap}
body.full3d .panel:has(#teams){position:fixed;left:8px;bottom:46px;z-index:30;margin:0;padding:6px 8px;background:rgba(10,14,28,.72);border:0;max-width:240px;font-size:.8rem}
body.full3d .panel:has(#teams) .bar{display:none}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><a class="back" href="../">← Spiele</a><h1 id="ttl"></h1></div>
  <div id="setup" class="panel"></div>
  <div id="game" hidden>
    <div class="hk-layout">
      <div class="hk-main">
        <div id="hkBanner"></div>
        <div id="hkStatus"></div>
        <div class="bw"><svg id="svg" viewBox="0 0 800 800"></svg><div id="diceDock" data-bare="1"></div></div>
        <div id="stage3d" hidden></div>
      </div>
      <div class="hk-side">
        <div class="panel"><div id="teams"></div></div>
        <div class="panel"><div class="row" style="margin:0"><button class="btn alt" id="v3d" style="flex:1">🧊 3D-Ansicht</button><button class="btn alt" id="cam3" style="flex:none" hidden title="Ansicht zurücksetzen">⟲</button><button class="btn alt" id="fs3" style="flex:none" hidden title="Vollbild">⛶</button></div></div>
        <div class="panel"><div id="hkLog"></div></div>
        <details class="panel rules"><summary><b id="rulesT"></b></summary><div id="rulesSide"></div></details>
        <div style="display:flex;gap:8px"><button class="btn alt" id="snd" style="flex:1"></button><button class="btn alt" id="again" style="flex:1"></button></div>
      </div>
    </div>
  </div>
</div>
<script>
const $=id=>document.getElementById(id);
const T=(d,e)=>SITE.T(d,e),L2=HK.L2,esc=HK.esc,tx=HK.tx;
const TT=T('Mädn Teams','Ludo Teams');document.title=TT;$('ttl').textContent=TT;
const RULES=()=>`<ul>
<li>${T('Wie „Mensch ärgere dich nicht“, aber auf einem doppelt so großen Ring (80 Felder) und im Team: Wer gegenüber sitzt, ist dein Partner.','Like Ludo, but on a ring twice as big (80 fields) and in teams: the player opposite you is your partner.')}</li>
<li>${T('Mit einer <b>6</b> kommt eine Figur raus, nach einer 6 würfelst du nochmal. Ohne Figur auf dem Feld hast du 3 Versuche.','A <b>6</b> brings a piece out, and after a 6 you roll again. With no piece on the field you get 3 tries.')}</li>
<li>${T('Wer auf eine fremde Figur zieht, wirft sie raus. Figuren deines <b>Teams</b> blockieren sich, man kann sie nicht schlagen.','Landing on an opponent’s piece sends it home. Pieces of your <b>team</b> block each other and cannot be captured.')}</li>
<li>${T('Alle Figuren müssen in die eigene <b>Zielgasse</b> (man darf dort nicht überspringen). Mit <b>Teamzügen</b> darfst du mit jedem Wurf auch Figuren deines Partners ziehen.','All pieces must reach your own <b>goal lane</b> (no jumping there). With <b>team moves</b> you may move your partner’s pieces with any roll.')}</li>
<li>${T('Ein Team gewinnt, wenn alle Figuren beider Partner im Ziel sind.','A team wins when all pieces of both partners are home.')}</li>
<li>${T('<b>Liegende Acht</b> (4 Spieler): Die Bahn ist eine 8 mit gemeinsamer Kreuzung, auf der man sich auch schlagen kann. Die beiden Spieler eines Teams starten auf derselben Seite, laufen aber in <b>entgegengesetzte Richtungen</b> und begegnen sich. Nur mit einer <b>6</b> kommt eine Figur raus. Das Team hat ein <b>gemeinsames Haus</b> mit 8 Plätzen: Es ist egal, wer in welcher Reihenfolge einzieht, aber im Haus darf man nicht überspringen. Zusätzlich zum normalen Würfel gibt es einen <b>Rechenwürfel</b> (+2, −2, ×2, ÷2), der immer angewendet wird. Das Ergebnis ist mindestens 1. <b>Mitte:</b> Landet eine Figur <u>genau</u> auf der Kreuzung, darf sie bei ihrem nächsten Zug wählen, ob sie oben oder unten weitergeht (es gibt dann zwei Ziele; wer nur durchzieht, geht wie gewohnt geradeaus). <b>Bonus beim Rauskommen:</b> Mit einer 6 und +2 oder ×2 kommt die Figur raus und geht den Bonus (Ergebnis minus 6) sofort vom Startfeld weg.','<b>Figure eight</b> (4 players): the track is an 8 with a shared crossing where you can capture each other. The two players of a team start on the same side but run in <b>opposite directions</b> and meet. Only a <b>6</b> brings a piece out. The team has one <b>shared house</b> with 8 slots: it does not matter who enters in which order, but you cannot jump inside the house. Besides the normal die there is a <b>calculation die</b> (+2, −2, ×2, ÷2) which is always applied. The result is at least 1. <b>Centre:</b> if a piece lands <u>exactly</u> on the crossing it may choose, on its next move, whether to continue up or down (two targets then; passing through goes straight on as usual). <b>Bonus when coming out:</b> with a 6 and +2 or ×2 the piece comes out and immediately moves the bonus (result minus 6) away from the start.')}</li></ul>`;
$('setup').innerHTML=`<h2>🎲 ${T('Mädn Teams: Liegende Acht','Ludo Teams: Figure eight')}</h2>
<p style="margin:0 0 10px;color:var(--muted)">${T('Mensch ärgere dich nicht im Team auf der liegenden Acht mit Rechenwürfel. Gegen den Computer oder online.','Ludo in teams on the figure-eight board with a calculation die. Against the computer or online.')}</p>
<select id="map" hidden><option value="eight">eight</option></select><input type="hidden" id="mode" value="4-4"><input type="checkbox" id="oShare" checked hidden>
<p style="margin:4px 0 10px;color:var(--muted);font-size:.85rem">${T('Du spielst mit Computern, die die übrigen Plätze besetzen. Online: Freunde belegen Plätze, der Rest sind Computer.','You play with computers filling the other seats. Online: friends take seats, the rest are computers.')}</p>
<div class="row"><button class="btn" id="start">${T('Gegen den Computer','Against the computer')}</button><button class="btn alt" id="online">🌐 ${T('Online spielen','Play online')}</button><button class="btn alt" id="rejoinBtn" hidden>↩ ${T('Wieder ins laufende Spiel','Back into the running game')}</button></div>
<details class="rules" style="margin-top:14px"><summary><b>${T('Regeln','Rules')}</b></summary>${RULES()}</details>`;
$('rulesT').textContent=T('Regeln','Rules');$('rulesSide').innerHTML=RULES();$('again').textContent=T('Zur Auswahl','Back to menu');
const readOpts=()=>{const map=$('map').value==='eight'?'eight':'ring';if(map==='eight')return {n:4,P:4,share:true,map};const [n,P]='4-4'.split('-').map(Number);return {n,P,share:$('oShare').checked,map};};
try{const m=localStorage.getItem('mt-mode');if(m)$('mode').value=m;if(localStorage.getItem('mt-share')==='0')$('oShare').checked=false;}catch(e){}
$('oShare').onchange=()=>{try{localStorage.setItem('mt-share',$('oShare').checked?'1':'0');}catch(e){}};
$('mode').onchange=()=>{try{localStorage.setItem('mt-mode',$('mode').value);}catch(e){}};
const syncMap=()=>{const e=$('map').value==='eight';$('mode').disabled=e;$('oShare').disabled=e;try{localStorage.setItem('mt-map',$('map').value);}catch(x){}};
try{const m=localStorage.getItem('mt-map');}catch(e){}
$('map').onchange=syncMap;syncMap();

let K,V=null,inp=null,hintTxt='';
// ---------- Farben und Brett ----------
const TEAMC=['#e53935','#1e88e5','#43a047','#f9a825'],TEAMN=[L2('Rot','Red'),L2('Blau','Blue'),L2('Grün','Green'),L2('Gelb','Yellow')];
const lighten=(hex,f)=>{const n=parseInt(hex.slice(1),16),r=n>>16&255,g=n>>8&255,b=n&255,m=c=>Math.round(c+(255-c)*f);return `rgb(${m(r)},${m(g)},${m(b)})`;};
const teamOf=(p,n)=>p%(n/2);
const seatColor=(p,n)=>{const c=TEAMC[teamOf(p,n)];return p<n/2?c:lighten(c,.45);};
const D=26,X0=140,Y0=140,SIDE=20*D,CEN=[X0+SIDE/2,Y0+SIDE/2];
const rotV=(v,k)=>{let x=v[0],y=v[1];for(let i=0;i<k;i++){const t=x;x=-y;y=t;}return [x,y];};
const LAY={},EW=1200,EH=560,ECX=600,ECY=270,EA=440;
function layoutEight(){      // liegende Acht (Lemniskate): 72 Wegpunkte gleichmäßig nach Bogenlänge, Mitte = Kreuzung
  if(LAY.eight)return LAY.eight;
  const M=4000,fine=[],cum=[0];let prev=null,acc=0;
  for(let k=0;k<=M;k++){const a=2*Math.PI*k/M,den=1+Math.sin(a)**2,x=EA*Math.cos(a)/den,y=-EA*Math.sin(a)*Math.cos(a)/den;fine.push([x,y]);if(prev){acc+=Math.hypot(x-prev[0],y-prev[1]);cum.push(acc);}prev=[x,y];}
  const EN=MTE.EN,sp=acc/EN,cells=[];let k=0;
  for(let i=0;i<EN;i++){const s=i*acc/EN;while(k<M&&cum[k+1]<s)k++;const f=(s-cum[k])/Math.max(1e-6,cum[k+1]-cum[k]),a=fine[k],b=fine[Math.min(M,k+1)];cells.push([ECX+a[0]+(b[0]-a[0])*f,ECY+a[1]+(b[1]-a[1])*f]);}
  cells[MTE.ECEN]=[ECX,ECY];cells[MTE.EDUP]=[ECX,ECY];cells[0][1]=ECY;cells[EN/2][1]=ECY;
  const house=[0,1].map(tm=>Array.from({length:8},(_,q)=>{const e=cells[tm===0?0:EN/2];return [e[0]+(tm===0?-1:1)*(q+1)*sp,ECY];}));      // Team 0 rechts, Team 1 links
  const left=p=>p%2===1;      // Sitze 1 und 3 (Team 1) links, 0 und 2 (Team 0) rechts
  const base=Array.from({length:4},(_,p)=>Array.from({length:4},(_,i)=>{const ex=left(p)?cells[EN/2][0]-110:cells[0][0]+110,top=p<2,bx=ex+((i%2)-.5)*30,by=ECY+(top?-82:82)+(Math.floor(i/2)-.5)*30;return [bx,by];}));
  return LAY.eight={eight:true,cells,house,base,len:EN,sp};
}
function layout(n,P,map){
  if(map==='eight')return layoutEight();
  const key=n+'-'+P;if(LAY[key])return LAY[key];
  const ring=[];
  for(let i=0;i<80;i++){const k=Math.floor(i/20),t=i%20,r=rotV([X0+t*D-CEN[0],Y0-CEN[1]],k);ring.push([CEN[0]+r[0],CEN[1]+r[1]]);}
  const per=n/4,start=[],lane=[],house=[];
  for(let p=0;p<n;p++){
    const k=Math.floor(p/per),j=p%per,t=per===1?10:5+10*j,si=20*k+t;start.push(si);
    const ent=ring[si-1],inward=rotV([0,1],k),outward=rotV([0,-1],k),tang=rotV([1,0],k),sp=ring[si],cols=P===8?4:2;
    lane.push(Array.from({length:P},(_,q)=>[ent[0]+inward[0]*(q+1)*D,ent[1]+inward[1]*(q+1)*D]));
    house.push(Array.from({length:P},(_,q)=>{const a=(q%cols)-(cols-1)/2,b=Math.floor(q/cols);return [sp[0]+tang[0]*a*D*1.1+outward[0]*(2.5+b*1.1)*D,sp[1]+tang[1]*a*D*1.1+outward[1]*(2.5+b*1.1)*D];}));
  }
  return LAY[key]={ring,start,lane,house};
}
const pcPt=(L,p,pos,i,sw)=>L.eight?(pos<0?L.base[p][i]:pos<L.len?L.cells[(s=>MTE.eightCellSw(p,pos,s[0],s[1]))(sw||(V&&V.sw&&V.sw[p]&&V.sw[p][i])||[0,0])]:L.house[p%2===0?0:1][pos-L.len]):(pos<0?L.house[p][i]:pos<80?L.ring[(L.start[p]+pos)%80]:L.lane[p][pos-80]);
// Richtungspfeile: vor dem Startfeld jedes Sitzes laufen Pfeile in dessen Laufrichtung, am Hauseingang zeigt ein Pfeil hinein
function arrowsOf(v){
  const L=layout(v.n,v.P,v.map),R=MTE.len({map:v.map,P:v.P,n:v.n}),out=[];
  for(let p=0;p<v.n;p++){
    const c=seatColor(p,v.n);
    [1,3,5,7,9,11].forEach((k,j)=>{const a=pcPt(L,p,k,0),b=pcPt(L,p,k+1,0);out.push({x:(a[0]+b[0])/2,y:(a[1]+b[1])/2,a:Math.atan2(b[1]-a[1],b[0]-a[0]),c,ph:j,s:1});});
    if(v.map!=='eight'||p<2){const a=pcPt(L,p,R-1,0),b=pcPt(L,p,R,0);out.push({x:(a[0]+b[0])/2,y:(a[1]+b[1])/2,a:Math.atan2(b[1]-a[1],b[0]-a[0]),c:v.map==='eight'?TEAMC[teamOf(p,v.n)]:c,ph:6,s:1.5});}
  }
  return out;
}
// Zugpfade: für jeden erlaubten Zug der Weg, den die Figur geht (so sieht man bei vielen Figuren sofort, wohin und in welche Richtung gezogen wird)
function trailsOf(v,L,opts){
  return (opts||[]).map(o=>{const pts=[];if(o.from<0)pts.push(pcPt(L,o.q,-1,o.i),pcPt(L,o.q,o.to,o.i,o.sw));else for(let x=o.from;x<=o.to;x++)pts.push(pcPt(L,o.q,x,o.i,o.sw));return {pts,c:seatColor(o.q,v.n),cap:!!o.cap};});
}
let builtKey='';
function buildEight(v){
  const L=layoutEight();let h='<g id="bg">';
  h+=`<polyline points="${Array.from({length:MTE.EN+1},(_,i)=>L.cells[MTE.eightCell(0,i-1)||0]).map(c=>c[0]+','+c[1]).join(' ')}" fill="none" stroke="rgba(255,255,255,.07)" stroke-width="16" stroke-linejoin="round"/>`;
  L.cells.forEach((pt,i)=>{if(i===MTE.EDUP)return;h+=`<circle class="fld trk" cx="${pt[0]}" cy="${pt[1]}" r="${i===MTE.ECEN?13:11}" fill="rgba(255,255,255,${i===MTE.ECEN?.2:.12})"/>`;});
  for(let p=0;p<4;p++){const c=seatColor(p,4),s=MTE.ESEAT[p].s,pt=L.cells[s],d=MTE.ESEAT[p].d;
    h+=`<circle class="fld" cx="${pt[0]}" cy="${pt[1]}" r="13" fill="${c}" stroke="#fff" stroke-width="2"/>`;

    L.base[p].forEach(b=>{h+=`<circle class="fld" cx="${b[0]}" cy="${b[1]}" r="11" fill="${c}" fill-opacity=".22" stroke="${c}"/>`;});}
  [0,1].forEach(tm=>{const c=TEAMC[tm];L.house[tm].forEach((pt,q)=>{h+=`<circle class="fld" cx="${pt[0]}" cy="${pt[1]}" r="11" fill="${c}" fill-opacity=".34" stroke="${c}"/>`;});});
  arrowsOf(v).forEach(a=>{h+=`<path class="dirA" style="animation-delay:${a.ph*.22}s" d="M-5,-6 L5,0 L-5,6 L-2,0 Z" fill="${a.c}" stroke="#fff" stroke-width=".7" transform="translate(${a.x},${a.y}) rotate(${a.a*180/Math.PI}) scale(${a.s*1.9})"/>`;});
  h+='</g><g id="mid"></g><g id="trl"></g><g id="tg"></g><g id="pcs">';
  for(let p=0;p<4;p++)for(let i=0;i<4;i++)h+=`<g class="pcg" id="pg-${p}-${i}"><circle class="pc" data-p="${p}" data-i="${i}" r="10" fill="${seatColor(p,4)}"/><circle r="3.4" fill="${TEAMC[teamOf(p,4)]}" stroke="#fff" stroke-width="1" pointer-events="none"/></g>`;
  h+='</g><g id="lbls"></g>';
  $('svg').setAttribute('viewBox','0 0 '+EW+' '+EH);$('svg').parentNode.classList.add('wide');$('svg').innerHTML=h;
}
function build(v){
  const key=(v.map||'ring')+v.n+'-'+v.P;if(builtKey===key)return;builtKey=key;setDiceArea(v.map==='eight'?'eight':'ring');
  if(v.map==='eight'){buildEight(v);return;}
  $('svg').setAttribute('viewBox','0 0 800 800');$('svg').parentNode.classList.remove('wide');
  const L=layout(v.n,v.P);let h='<g id="bg">';
  L.ring.forEach(pt=>{h+=`<circle class="fld trk" cx="${pt[0]}" cy="${pt[1]}" r="11" fill="rgba(255,255,255,.12)"/>`;});
  for(let p=0;p<v.n;p++){
    const c=seatColor(p,v.n);
    h+=`<circle class="fld" cx="${L.ring[L.start[p]][0]}" cy="${L.ring[L.start[p]][1]}" r="12.5" fill="${c}" stroke="#fff" stroke-width="2"/>`;
    L.lane[p].forEach(pt=>{h+=`<circle class="fld" cx="${pt[0]}" cy="${pt[1]}" r="10.5" fill="${c}" fill-opacity=".38" stroke="${c}"/>`;});
    L.house[p].forEach(pt=>{h+=`<circle class="fld" cx="${pt[0]}" cy="${pt[1]}" r="11" fill="${c}" fill-opacity=".22" stroke="${c}"/>`;});
  }
  h+='</g><g id="mid"></g><g id="trl"></g><g id="tg"></g><g id="pcs">';
  for(let p=0;p<v.n;p++)for(let i=0;i<v.P;i++)h+=`<g class="pcg" id="pg-${p}-${i}"><circle class="pc" data-p="${p}" data-i="${i}" r="10" fill="${seatColor(p,v.n)}"/><circle r="3.4" fill="${TEAMC[teamOf(p,v.n)]}" stroke="#fff" stroke-width="1" pointer-events="none"/></g>`;
  h+='</g><g id="lbls"></g>';
  $('svg').innerHTML=h;
}
const nameOf=i=>i===V.me?T('Du','You'):esc(V.names[i]);
function render(v,prev){
  V=v;$('setup').hidden=true;$('game').hidden=false;build(v);
  const L=layout(v.n,v.P,v.map),mine=!!inp&&!v.over;
  const movable=new Set(mine?inp.opts.map(o=>o.q+'-'+o.i):[]);
  // Figuren
  for(let p=0;p<v.n;p++)for(let i=0;i<v.P;i++){
    const g=$('pg-'+p+'-'+i),pt=pcPt(L,p,v.pos[p][i],i);
    g.style.transform=`translate(${pt[0]}px,${pt[1]}px)`;
    const c=g.firstChild;c.classList.toggle('can',mine&&movable.has(p+'-'+i));c.classList.toggle('wait',!!(v.ch&&v.ch[p]&&v.ch[p][i]));
  }
  // Ziele der erlaubten Züge
  let tg='';
  if(mine)inp.opts.forEach((o,k)=>{const pt=pcPt(L,o.q,o.to,o.i,o.sw);tg+=`<circle class="tgt" data-k="${k}" cx="${pt[0]}" cy="${pt[1]}" r="12"/>`;});
  $('tg').innerHTML=tg;
  let trl='';
  if(mine)trailsOf(v,L,inp.opts).forEach((tr,k)=>{
    const d=tr.pts.map(p=>p[0]+','+p[1]).join(' '),n=tr.pts.length,a=tr.pts[n-2],b=tr.pts[n-1],ang=Math.atan2(b[1]-a[1],b[0]-a[0])*180/Math.PI;
    trl+=`<polyline class="trl" points="${d}" fill="none" stroke="${tr.c}" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" opacity=".5"/><polyline class="trl2" points="${d}" fill="none" stroke="#fff" stroke-width="2.4" stroke-dasharray="3 9" stroke-linecap="round" stroke-linejoin="round" opacity=".9"/>`
      +`<path d="M-9,-9 L11,0 L-9,9 L-4,0 Z" fill="${tr.c}" stroke="#fff" stroke-width="1.4" transform="translate(${b[0]},${b[1]}) rotate(${ang}) scale(1.15)" pointer-events="none"/>`;
  });
  $('trl').innerHTML=trl;
  let lb='',m='';const total=v.n/2;
  if(v.map==='eight'){
    // Namen an den Startseiten, Würfel und Rechenwürfel oben in der Mitte, Teamstand unten
    for(let p=0;p<4;p++){const bs=L.base[p],bx=bs.reduce((s,x)=>s+x[0],0)/4,by=bs.reduce((s,x)=>s+x[1],0)/4+(p<2?-34:42);lb+=`<text class="lbl" x="${bx}" y="${by}" style="fill:${seatColor(p,4)};${v.cur===p?'font-size:16px':''}">${v.cur===p?'▶ ':''}${esc(nameOf(p))}</text>`;}
    if(v.die){const ops=['+2','\u22122','\u00d72','\u00f72'],md=v.mod;
      m+=`<text class="lbl" x="${ECX-105}" y="${62}" style="font-size:54px">${['','⚀','⚁','⚂','⚃','⚄','⚅'][v.die]}</text>`;
      if(md){m+=`<rect class="modbox" x="${ECX-48}" y="22" width="88" height="56" rx="10"/><text class="lbl" x="${ECX-4}" y="64" style="font-size:34px;fill:#ffd23f">${ops[md.op]}</text><text class="lbl" x="${ECX+96}" y="62" style="font-size:40px">= ${md.s}</text>`;}}
    m+=`<text class="lbl" x="${ECX}" y="${EH-18}" style="font-size:15px;opacity:.8">${[0,1].map(tm=>(tx(TEAMN[tm]))+' '+v.teamPieces[tm].home+'/'+v.teamPieces[tm].total).join('   ·   ')}</text>`;
  }else{
  for(let p=0;p<v.n;p++){const h=L.house[p],cx=h.reduce((a,x)=>a+x[0],0)/h.length,cy=h.reduce((a,x)=>a+x[1],0)/h.length,k=Math.floor(p/(v.n/4)),o=rotV([0,-1],k);lb+=`<text class="lbl" x="${cx+o[0]*36}" y="${cy+o[1]*36+4}" style="fill:${seatColor(p,v.n)};${v.cur===p?'font-size:15px':''}">${v.cur===p?'▶ ':''}${esc(nameOf(p))}</text>`;}
  m=`<text class="lbl" x="${CEN[0]}" y="${CEN[1]-70}" style="font-size:24px;letter-spacing:.06em">${esc(TT.toUpperCase())}</text>`;
  if(v.die){m+=`<text class="lbl" x="${CEN[0]}" y="${CEN[1]-20}" style="font-size:54px">${['','⚀','⚁','⚂','⚃','⚄','⚅'][v.die]}</text>`;}
  for(let t=0;t<total;t++){const pcs=v.teamPieces[t],y=CEN[1]+20+t*22;m+=`<circle cx="${CEN[0]-70}" cy="${y-4}" r="7" fill="${TEAMC[t]}" stroke="#fff"/><text class="lbl" x="${CEN[0]-55}" y="${y}" style="text-anchor:start;font-size:14px">${pcs.home}/${pcs.total}</text>`;}
  }
  $('lbls').innerHTML=lb;$('mid').innerHTML=m;
  if(v.last&&(!prev||!prev.last||prev.last.seq!==v.last.seq)){K.sfx(v.last.cap?'bad':'lay');}
  // Teams
  $('teams').innerHTML=Array.from({length:total},(_,t)=>{const mem=v.names.map((n,i)=>i).filter(i=>teamOf(i,v.n)===t),pc=v.teamPieces[t];
    return `<div class="tm${mem.includes(v.cur)&&!v.over?' turn':''}"><span class="dot" style="background:${TEAMC[t]}"></span><div style="flex:1"><b style="margin:0;color:${TEAMC[t]}">${tx(TEAMN[t])}</b><br><small>${mem.map(i=>(i===v.me?T('Du','You'):esc(v.names[i]))+(v.types[i]==='cpu'?' 🤖':'')).join(' + ')}</small><div class="bar"><i style="width:${Math.round(pc.home/pc.total*100)}%"></i></div></div><b>${pc.home}/${pc.total}</b></div>`;}).join('');
  const b=$('hkBanner');
  if(v.over){b.className=v.over.team===teamOf(v.me,v.n)?'me':'';b.textContent=(v.over.team===teamOf(v.me,v.n)?T('🏆 Dein Team gewinnt!','🏆 Your team wins!'):T('🏆 Team ','🏆 Team ')+tx(TEAMN[v.over.team])+T(' gewinnt!',' wins!'));}
  else if(mine){b.className='me';b.textContent=T(`▶ DU BIST DRAN: Wähle eine Figur (Wurf ${inp.v})`,`▶ YOUR TURN: pick a piece (roll ${inp.v})`);}
  else if(v.cur===v.me){b.className='me';b.textContent=T('▶ DU BIST DRAN: Würfeln','▶ YOUR TURN: roll');}
  else{b.className='';b.textContent=T(`⏳ ${v.names[v.cur]} ist dran`,`⏳ ${v.names[v.cur]}'s turn`);}
  $('svg').classList.toggle('myturn',mine||(v.cur===v.me&&!v.over));
  document.title=(mine||v.cur===v.me)&&!v.over?T('▶ Du bist dran! – ','▶ Your turn! – ')+TT:TT;
  if((mine||v.cur===v.me)&&!(prev&&prev.cur===v.me&&!prev._m)&&!v.over)K.sfx('ping');
  v._m=mine;
  $('hkStatus').textContent=hintTxt||(v.log[0]?tx(v.log[0]):'');
  $('hkLog').innerHTML=v.log.slice(1,60).map(l=>`<div>${esc(tx(l))}</div>`).join('');
  sync3d();
}
// ---------- Würfelfläche: das ganze Brett (2D: unsichtbare Fläche darüber, 3D: Fläche in der Szene) ----------
// 1 Würfeleinheit = u Pixel der Brettzeichnung; die Fläche deckt genau die Zeichnung ab (w x h Pixel)
const VBOX=map=>map==='eight'?{w:1200,h:560,u:24.8}:{w:800,h:800,u:20.8};
function setDiceArea(map){
  const b=VBOX(map);Dice3D.setArea(b.w/b.u/2,b.h/b.u/2);
  if(!use3d&&K&&K.dview){try{const v=K.dview(0);if(v&&v.refit)v.refit();}catch(e){}}
}
function diceObstaclesT(g,rot){      // alle Figuren als feste Hindernisse; Koordinaten relativ zur Brettmitte, zur geworfenen Seite gedreht
  const b=VBOX(g.map),L=layout(g.n,g.P,g.map),th=(rot|0)*Math.PI/2,cs=Math.cos(th),sn=Math.sin(th),o=[];
  for(let p=0;p<g.n;p++)for(let i=0;i<g.P;i++){
    const sw=g.sw&&g.sw[p]&&g.sw[p][i]||[0,0],pt=pcPt(L,p,g.pos[p][i],i,sw),x=(pt[0]-b.w/2)/b.u,z=(pt[1]-b.h/2)/b.u;
    o.push([x*cs-z*sn,x*sn+z*cs,.45,1.3]);
  }
  return o;
}
// ---------- 3D-Ansicht ----------
function fields3d(v){
  const L=layout(v.n,v.P,v.map),pts=[],key=(v.map||'ring')+v.n+'-'+v.P;let loop=null;
  if(v.map==='eight'){
    L.cells.forEach((c,i)=>{if(i===MTE.EDUP)return;pts.push({x:c[0],y:c[1],k:i===MTE.ECEN?'center':'track'});});
    for(let p=0;p<4;p++){const c=L.cells[MTE.ESEAT[p].s];pts.push({x:c[0],y:c[1],k:'start',c:seatColor(p,4)});L.base[p].forEach(b=>pts.push({x:b[0],y:b[1],k:'base',c:seatColor(p,4)}));}
    [0,1].forEach(tm=>L.house[tm].forEach(h=>pts.push({x:h[0],y:h[1],k:'house',c:TEAMC[tm]})));
    loop=L.cells.slice();
  }else{
    L.ring.forEach(pt=>pts.push({x:pt[0],y:pt[1],k:'track'}));
    for(let p=0;p<v.n;p++){const c=L.ring[L.start[p]];pts.push({x:c[0],y:c[1],k:'start',c:seatColor(p,v.n)});L.lane[p].forEach(h=>pts.push({x:h[0],y:h[1],k:'lane',c:seatColor(p,v.n)}));L.house[p].forEach(h=>pts.push({x:h[0],y:h[1],k:'base',c:seatColor(p,v.n)}));}
  }
  const pieces=[];for(let p=0;p<v.n;p++)for(let i=0;i<v.P;i++)pieces.push({p,i,c:seatColor(p,v.n),tc:TEAMC[teamOf(p,v.n)]});
  const vb=VBOX(v.map);
  return {key,pts,loop,closed:true,pieces,arrows:arrowsOf(v),vb:[vb.w,vb.h],unit:vb.u,rotCam:v.map==='eight'?'half':true};
}
let use3d=false,loading3=false;
try{use3d=localStorage.getItem('mt-3d')==='1';}catch(e){}
const CDN3='https://cdn.jsdelivr.net/npm/three@0.128.0/',LIBS3=['build/three.min.js','examples/js/controls/OrbitControls.js'];
const loadLibs3=()=>window.THREE&&THREE.OrbitControls?Promise.resolve():LIBS3.reduce((pr,u)=>pr.then(()=>new Promise((res,rej)=>{const s=document.createElement('script');s.src=CDN3+u;s.onload=res;s.onerror=()=>rej(new Error(u));document.head.appendChild(s);})),Promise.resolve());
function sync3d(){
  if(!use3d||!V||!window.MT3D||!MT3D.ready)return;
  const L=layout(V.n,V.P,V.map);
  const opts=!!inp&&!V.over?inp.opts:null;
  MT3D.update(V,fields3d(V),(p,pos,i,sw)=>pcPt(L,p,pos,i,sw),opts,trailsOf(V,L,opts));
}
async function set3d(on){
  if(on&&!(window.MT3D&&MT3D.ready)){
    if(loading3)return;loading3=true;$('v3d').textContent=T('Lade 3D …','Loading 3D …');
    try{await loadLibs3();await Dice3D.ready();MT3D.init($('stage3d'),{
      onTarget:k=>{if(inp)answer(k);},
      style:()=>document.documentElement.getAttribute('data-style')||'standard',
      onPiece:(p,i)=>{if(!inp)return;const k=inp.opts.findIndex(o=>o.q===p&&o.i===i);if(k>=0)answer(k);else{hintTxt=T('Diese Figur kann gerade nicht ziehen.','This piece cannot move right now.');K.apply();}}});}
    catch(e){loading3=false;$('v3d').textContent=T('3D nicht verfügbar','3D unavailable');return;}
    loading3=false;
  }
  use3d=on;try{localStorage.setItem('mt-3d',on?'1':'0');}catch(e){}
  $('stage3d').hidden=!on;$('svg').parentNode.hidden=on;$('cam3').hidden=!on;$('fs3').hidden=!on;
  setFull(on);      // 3D füllt wie bei Mensch ärgere dich nicht die ganze Seite; Banner, Hinweis und Knöpfe schweben darüber
  $('v3d').textContent=on?T('2D-Ansicht','2D view'):T('🧊 3D-Ansicht','🧊 3D view');
  if(window.MT3D&&MT3D.ready){MT3D.setActive(on);if(on){MT3D.resize();builtKey3=null;}}
  if(K&&K.V){K.prevV=null;K.apply();}
}
let builtKey3=null;
function setFull(on){      // Seitenlayout: 3D-Bühne füllt den Bildschirm
  if(document.body.classList.contains('full3d')===on)return;
  document.body.classList.toggle('full3d',on);
  [100,500].forEach(ms=>setTimeout(()=>{if(window.MT3D&&MT3D.ready){MT3D.resize();MT3D.camReset();}},ms));
}
function toggleBrowserFs(){      // zusätzlich echter Browser-Vollbildmodus
  try{if(!document.fullscreenElement&&document.documentElement.requestFullscreen)document.documentElement.requestFullscreen().catch(()=>{});else if(document.fullscreenElement)document.exitFullscreen().catch(()=>{});}catch(e){}

$('fs3').onclick=toggleBrowserFs;
addEventListener('keydown',e=>{if(e.key==='Escape'&&use3d&&!document.fullscreenElement)set3d(false);});
new MutationObserver(()=>{if(window.MT3D&&MT3D.ready){MT3D.restyle();if(K&&K.V)K.apply();}}).observe(document.documentElement,{attributes:true,attributeFilter:['data-style']});
$('v3d').onclick=()=>set3d(!use3d);
$('cam3').onclick=()=>MT3D.camReset();
function ui(spec){return new Promise(res=>{if(spec.k==='turn'){inp={res,v:spec.v,opts:spec.opts};hintTxt='';K.apply();}else res(null);});}
function answer(k){if(!inp)return;const r=inp.res;inp=null;hintTxt='';K.apply();r(k);}
$('svg').addEventListener('click',e=>{
  if(!inp)return;
  const t=e.target.closest('.tgt');if(t){answer(+t.dataset.k);return;}
  const c=e.target.closest('.pc');if(!c)return;
  const k=inp.opts.findIndex(o=>o.q===+c.dataset.p&&o.i===+c.dataset.i);
  if(k>=0)answer(k);else{hintTxt=T('Diese Figur kann gerade nicht ziehen.','This piece cannot move right now.');K.apply();}
});
// ---------- Sicht und Start ----------
function view(g,s){
  const R=MTE.len(g),tp=[];for(let t=0;t<g.n/2;t++){let home=0,total=0;for(let p=0;p<g.n;p++)if(MTE.teamOf(g,p)===t){total+=g.P;g.pos[p].forEach(x=>{if(x>=R)home++;});}tp.push({home,total});}
  return {map:g.map,mod:g.mod,sw:g.sw,ch:g.ch,me:s,n:g.n,P:g.P,names:g.seats.map(x=>x.name),types:g.seats.map(x=>x.type),pos:g.pos,cur:g.cur,die:g.die,dieP:g.dieP,last:g.last,over:g.over,teamPieces:tp,log:K.logFor(s)};
}
function startGame(seats,opts){
  K.reset();
  let n=opts.n,P=opts.P,map=opts.map;if(seats.length>n){n=8;P=4;map='ring';}      // zu viele Sitze für die Acht (nur 4 Spieler): dann das große Ring-Brett
  const names=['Kira','Bolt','Nova','Pixel','Juno','Rook','Echo','Zed'];let k=0;
  const full=seats.map(s=>({type:s.type,name:s.name,seat:s.seat,orig:s.orig,away:s.away}));
  while(full.length<n)full.push({type:'cpu',name:names[k++%names.length],seat:-1});
  K.G=MTE.setup(full,{n,P,map,share:opts.share});
  K.say(-1,L2('Neues Spiel. '+K.nm(K.G.cur)+' beginnt.','New game. '+K.nm(K.G.cur)+' starts.'));
  K.push();K.run(main);
}
async function main(){
  await MTE.main();
  const g=K.G,w=g.over.team;K.sfx('win');
  const again=await K.vote(q=>({ico:'🏆',title:teamOf(q,g.n)===w?L2('Dein Team hat gewonnen!','Your team won!'):L2('Team '+TEAMN[w].de+' hat gewonnen!','Team '+TEAMN[w].en+' won!'),html:L2('<b>Abstimmung:</b> Noch eine Partie?','<b>Vote:</b> play again?'),btns:[L2('Nochmal spielen','Play again'),L2('Beenden','Quit')]}));
  if(again)startGame(g.seats.map(s=>({type:s.type,name:s.name,seat:s.seat,orig:s.orig,away:s.away})),g.opts);else K.exit(false);
}
K=HK.init({
  prefix:'mtm-v1-',title:L2('Mädn Teams','Ludo Teams'),minPlayers:2,diceZoom:false,diceDock:'diceDock',bareDice:true,timeoutMs:30000,
  dviewFor:p=>use3d&&window.MT3D&&MT3D.ready?MT3D.diceView():null,
  diceObstacles:diceObstaclesT,cancelUi:()=>{inp=null;K.apply();},cancelDice:()=>{if(window.MT3D&&MT3D.ready&&MT3D.diceView)MT3D.cancelDice();},
  seats:Array.from({length:8},(_,i)=>({name:T('Sitz ','Seat ')+(i+1),color:seatColor(i,8)})),
  cpuNames:['Kira','Bolt','Nova','Pixel','Juno','Rook','Echo','Zed'],
  dieColor:(p,g)=>seatColor(p,g.n),
  view,valid:MTE.valid,render,ui,
  start:s=>startGame(s,readOpts()),
  resume(){K.run(main);},
  onGame(){$('setup').hidden=true;$('game').hidden=false;},
  onSetup(){inp=null;builtKey='';$('game').hidden=true;$('setup').hidden=false;document.title=TT;}
});
MTE.bind(K);
K.sndBtn($('snd'));
$('start').onclick=()=>K.startLocal(readOpts().n-1);
if(use3d){use3d=false;setTimeout(()=>set3d(true),0);}
$('again').onclick=()=>K.exit(true);
