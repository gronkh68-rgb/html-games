<script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.2/peerjs.min.js"></script>

<style>
html,body{overscroll-behavior:none}
body{user-select:none;-webkit-user-select:none;touch-action:manipulation}
.wrap{max-width:1200px;padding:10px 12px 56px}
.top{margin-bottom:8px}
#hud{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:0 0 8px}
#hud .pl{display:flex;align-items:center;gap:8px;padding:5px 12px;background:#0b111c;border:1px solid #1c2a3d;border-top:3px solid var(--c);
  font:700 .9rem "Share Tech Mono",ui-monospace,monospace;color:#dff6ff;box-shadow:0 0 12px color-mix(in srgb,var(--c) 35%,transparent)}
#hud .pl.dead{opacity:.45}
#hud .pl b{font-size:1.15rem;color:var(--c);text-shadow:0 0 8px var(--c);min-width:1.2em;text-align:right}
#hud .pl .bo{letter-spacing:2px;color:var(--c);font-size:.8rem}
#hud .pl .bo i{font-style:normal;opacity:.2}
#arenaWrap{position:relative;margin:0 auto;line-height:0;width:max-content;max-width:100%}
#cv3{display:block;border:1px solid #00cfff;box-shadow:0 0 18px rgba(0,207,255,.45);touch-action:none;background:#05080d}
.ovl .hint{font:.78rem "Share Tech Mono",ui-monospace,monospace;color:#8fb3c7;margin:10px 0 0;text-align:center}
#cv{display:block;background:#080c12;border:1px solid #00cfff;box-shadow:0 0 18px rgba(0,207,255,.45),inset 0 0 30px rgba(0,207,255,.08);touch-action:none}
.ovl{position:absolute;inset:0;display:grid;place-items:center;line-height:1.4;padding:10px;background:rgba(4,8,14,.72);overflow:auto}
.ovl .box{background:#0b111c;border:1px solid #1c2a3d;border-top:3px solid #00cfff;padding:16px 20px;width:min(430px,100%);box-shadow:0 0 26px rgba(0,207,255,.25);color:#dff6ff}
.ovl h2{margin:0 0 10px;font:900 1.5rem Orbitron,"Segoe UI",sans-serif;letter-spacing:.14em;color:#00cfff;text-shadow:0 0 12px #00cfff;text-align:center}
.ovl .row{margin:6px 0}
.ovl .row label{min-width:120px;color:#8fb3c7;font:.85rem "Share Tech Mono",ui-monospace,monospace}
.ovl select{flex:1;min-width:0;background:#080c12;color:#dff6ff;border:1px solid #1c2a3d;border-radius:0;padding:7px 8px}
.ovl .go{display:flex;gap:8px;justify-content:center;margin-top:12px;flex-wrap:wrap}
.nbtn{font:700 .95rem Orbitron,"Segoe UI",sans-serif;letter-spacing:.08em;padding:10px 18px;background:#00cfff;color:#04121a;border:0;cursor:pointer;box-shadow:0 0 14px rgba(0,207,255,.6)}
.nbtn.alt{background:transparent;color:#00cfff;border:1px solid #00cfff;box-shadow:none}
.nbtn:hover{filter:brightness(1.15)}
#msg{background:transparent;pointer-events:none}
#msg span{font:900 clamp(1.6rem,7vw,4rem) Orbitron,"Segoe UI",sans-serif;letter-spacing:.1em;color:var(--c,#00cfff);text-shadow:0 0 18px var(--c,#00cfff),0 0 4px #fff;text-align:center;animation:pop .5s ease-out}
@keyframes pop{0%{transform:scale(1.8);opacity:0}100%{transform:scale(1);opacity:1}}
#bar{display:flex;gap:8px;justify-content:center;margin:10px 0 6px;flex-wrap:wrap}
#bar .btn{padding:7px 14px;font-size:.85rem}
.keys{color:var(--muted);font-size:.82rem;line-height:1.6;text-align:center;margin:6px 0 0}
.keys b{color:var(--text)}
#touch{display:none;position:fixed;left:0;right:0;bottom:0;z-index:40;grid-template-columns:1fr .8fr 1fr;gap:8px;
  padding:8px 10px calc(8px + env(safe-area-inset-bottom));background:rgba(8,12,18,.96);border-top:1px solid #1c2a3d}
#touch button{height:70px;font-size:1.8rem;background:#0b111c;color:#00cfff;border:1px solid #00cfff;touch-action:none;-webkit-tap-highlight-color:transparent}
#touch button:active{background:#00cfff;color:#04121a}
#touch #tB{color:#ff9a1f;border-color:#ff9a1f;font-size:1.4rem}
@media (pointer:coarse){#touch{display:grid}body{padding-bottom:96px}.keys{display:none}}
/* Stil-Leiste der Seite über die Touch-Leiste heben, damit sie die Lenkknöpfe nicht verdeckt */
@media (pointer:coarse){#styleSwitch{bottom:calc(94px + env(safe-area-inset-bottom))!important}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><a class="back" href="../">← Spiele</a><h1>Tron</h1></div>
  <div id="hud"></div>
  <div id="arenaWrap">
    <canvas id="cv"></canvas><canvas id="cv3" hidden></canvas>
    <div class="ovl" id="msg" hidden><span id="msgT"></span></div>
    <div class="ovl" id="menu">
      <div class="box">
        <h2>TRON</h2>
        <div class="row"><label>Modus</label><select id="oMode"><option value="1">1 Spieler</option><option value="2">2 Spieler (eine Tastatur)</option></select></div>
        <div class="row"><label>Computer-Gegner</label><select id="oBots"><option>0</option><option>1</option><option>2</option><option>3</option></select></div>
        <div class="row"><label>Stärke</label><select id="oLvl"><option value="0">Leicht</option><option value="1">Mittel</option><option value="2">Schwer</option></select></div>
        <div class="row"><label>Tempo</label><select id="oSpeed"><option value="0">Langsam</option><option value="1">Normal</option><option value="2">Schnell</option></select></div>
        <div class="row"><label>Siegpunkte</label><select id="oGoal"><option>3</option><option>5</option><option>10</option></select></div>
        <div class="row"><label>Turbo</label><select id="oBoost"><option value="1">An (3 pro Runde)</option><option value="0">Aus</option></select></div>
        <div class="row"><label>Spur nach Crash</label><select id="oKeep"><option value="0">Verschwindet</option><option value="1">Bleibt stehen</option></select></div>
        <div class="go"><button class="nbtn" id="start">Spiel starten</button><button class="nbtn alt" id="onlineBtn">🌐 Online spielen</button></div>
        <p class="hint">Online gelten Stärke, Tempo, Siegpunkte, Turbo und Spur des Hosts.</p>
      </div>
    </div>
    <div class="ovl" id="end" hidden>
      <div class="box">
        <h2 id="endT"></h2>
        <div class="go"><button class="nbtn" id="again">Nochmal spielen</button><button class="nbtn alt" id="toMenu">Zur Auswahl</button></div>
      </div>
    </div>
  </div>
  <div id="bar">
    <button class="btn alt" id="pauseBtn">Pause</button>
    <button class="btn alt" id="quitBtn">Zur Auswahl</button>
    <button class="btn alt" id="viewBtn">3D-Ansicht</button>
    <button class="btn alt" id="camBtn" hidden></button>
    <button class="btn alt" id="sndBtn">Ton: an</button>
  </div>
  <p class="keys" id="keys"></p>
</div>
<div id="touch"><button id="tL">⟲</button><button id="tB">⚡</button><button id="tR">⟳</button></div>

<script>
'use strict';
const $=id=>document.getElementById(id);
const T=window.T||((de)=>de);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
if(window.SITE)SITE.addDict({
  'Modus':'Mode','1 Spieler':'1 player','2 Spieler (eine Tastatur)':'2 players (one keyboard)','Stärke':'Strength','Leicht':'Easy','Mittel':'Medium','Schwer':'Hard',
  'Tempo':'Speed','Langsam':'Slow','Normal':'Normal','Schnell':'Fast','Siegpunkte':'Points to win','Turbo':'Boost','An (3 pro Runde)':'On (3 per round)',
  'Spur nach Crash':'Trail after crash','Verschwindet':'Disappears','Bleibt stehen':'Stays','Pause':'Pause','Weiter':'Resume',
  'Online gelten Stärke, Tempo, Siegpunkte, Turbo und Spur des Hosts.':'Online, the host\'s strength, speed, points to win, boost and trail settings apply.'
});
const COLS=['#00cfff','#ff9a1f','#39ff14','#ff2fa8'];
const DX=[1,0,-1,0],DY=[0,1,0,-1];          // Richtungen: rechts, unten, links, oben
const TICK=[92,70,52];                      // Millisekunden pro Feld je Tempo-Stufe
const BOOST_N=3,BOOST_T=16;                 // Turbo-Ladungen pro Runde, Dauer in Halbschritten

// ---------- Einstellungen ----------
const O={mode:'1',bots:1,lvl:1,speed:1,goal:5,boost:1,keep:0};
const OSEL={mode:'oMode',bots:'oBots',lvl:'oLvl',speed:'oSpeed',goal:'oGoal',boost:'oBoost',keep:'oKeep'};
try{Object.assign(O,JSON.parse(localStorage.getItem('tron-opts')||'{}'));}catch(e){}
for(const k in OSEL)$(OSEL[k]).value=String(O[k]);
function readOpts(){
  O.mode=$('oMode').value==='2'?'2':'1';
  for(const k of ['bots','lvl','speed','goal','boost','keep'])O[k]=+$(OSEL[k]).value||0;
  O.bots=Math.max(O.mode==='1'?1:0,Math.min(O.mode==='1'?3:2,O.bots));     // 2 bis 4 Fahrer insgesamt
  $('oBots').value=String(O.bots);
  try{localStorage.setItem('tron-opts',JSON.stringify(O));}catch(e){}
}
$('oMode').onchange=readOpts;$('oBots').onchange=readOpts;

// ---------- Ton ----------
let sndOn=true,AC=null;try{sndOn=localStorage.getItem('tron-sound')!=='0';}catch(e){}
function beep(f,d,type,vol,slide){
  if(!sndOn)return;
  try{
    AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();
    const o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime;
    o.type=type||'square';o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(slide,t+d);
    g.gain.setValueAtTime(vol||.05,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);
    o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d);
  }catch(e){}
}
function syncSnd(){$('sndBtn').textContent=sndOn?T('Ton: an','Sound: on'):T('Ton: aus','Sound: off');}
$('sndBtn').onclick=()=>{sndOn=!sndOn;try{localStorage.setItem('tron-sound',sndOn?'1':'0');}catch(e){}syncSnd();};syncSnd();

// ---------- Zustand ----------
const cv=$('cv'),cv3=$('cv3'),ctx=cv.getContext('2d'),bgC=document.createElement('canvas'),trC=document.createElement('canvas'),tctx=trC.getContext('2d');
let W=84,H=50,cs=10,grid=new Uint8Array(W*H),P=[],state='menu',paused=false;
let sub=35,acc=0,simT=0,tickN=0,last=0,lastSim=0,mul=1,parts=[],shake=0,flowTok=0;
let vis=new Uint8Array(W*H),que=new Int32Array(W*H);
// Online: Der Host rechnet das Spiel und schickt jeden Schritt; Mitspieler schicken nur ihre Lenkbefehle
const NET={on:false,role:'local',you:-1};
let L=null;
const bc=m=>{if(NET.role==='host'&&L)L.broadcast(m);};
const free=(x,y)=>x>=0&&y>=0&&x<W&&y<H&&!grid[y*W+x];
const clk=()=>NET.role==='client'?performance.now():simT+acc;
const local=k=>P.find(p=>p.ctl===k);                 // k0 = dieser Spieler, k1 = zweiter Spieler an derselben Tastatur
const byId=id=>P.find(p=>p.id===id);

// ---------- Größe und Hintergrund ----------
function setGrid(w,h){W=w;H=h;grid=new Uint8Array(W*H);vis=new Uint8Array(W*H);que=new Int32Array(W*H);}
function pickGrid(){const port=innerWidth<innerHeight*.8;setGrid(port?44:84,port?62:50);}
function layout(){
  const dpr=Math.min(2,window.devicePixelRatio||1),wrap=$('arenaWrap'),top=wrap.getBoundingClientRect().top+scrollY;
  const coarse=matchMedia('(pointer:coarse)').matches;
  const aw=$('hud').clientWidth-2,ah=Math.max(240,innerHeight-top-(coarse?196:120));
  cs=Math.max(3,Math.floor(Math.min(aw*dpr/W,ah*dpr/H)));
  for(const c of [cv,bgC,trC]){c.width=W*cs;c.height=H*cs;}
  cv.style.width=(W*cs/dpr)+'px';cv.style.height=(H*cs/dpr)+'px';
  const b=bgC.getContext('2d');
  b.fillStyle='#080c12';b.fillRect(0,0,bgC.width,bgC.height);
  for(let x=0;x<=W;x++){b.fillStyle=x%4===0?'rgba(0,207,255,.16)':'rgba(0,207,255,.05)';b.fillRect(x*cs,0,1,H*cs);}
  for(let y=0;y<=H;y++){b.fillStyle=y%4===0?'rgba(0,207,255,.16)':'rgba(0,207,255,.05)';b.fillRect(0,y*cs,W*cs,1);}
  rebuild();
  if(G3)size3(aw,Math.round(Math.min(ah,aw*1.4)));
}
addEventListener('resize',layout);

// ---------- Spuren zeichnen (2D) ----------
const cx=v=>(v+.5)*cs;
function poly(c,p,pts,n,dim){          // die ersten n Punkte als Leuchtlinie
  if(n<1)return;
  c.lineCap='round';c.lineJoin='round';
  c.beginPath();c.moveTo(cx(pts[0][0]),cx(pts[0][1]));
  for(let i=1;i<n;i++)c.lineTo(cx(pts[i][0]),cx(pts[i][1]));
  if(n===1)c.lineTo(cx(pts[0][0])+.01,cx(pts[0][1]));
  c.globalAlpha=dim?.28:1;c.strokeStyle=p.col;c.shadowColor=p.col;c.shadowBlur=dim?0:cs*.9;c.lineWidth=cs*.46;c.stroke();
  c.shadowBlur=0;c.globalAlpha=dim?.12:.8;c.strokeStyle='#fff';c.lineWidth=cs*.14;c.stroke();c.globalAlpha=1;
}
function rebuild(){
  tctx.clearRect(0,0,trC.width,trC.height);
  for(const p of P){
    if(p.alive)poly(tctx,p,p.path,p.path.length-1);
    else if(O.keep)poly(tctx,p,p.path,p.path.length,true);
  }
}

// ---------- Runde ----------
function hud(){
  $('hud').innerHTML=P.map(p=>`<div class="pl${p.alive||state!=='play'?'':' dead'}" style="--c:${p.col}"><span>${esc(p.name)}</span>${!p.bot&&O.boost?`<span class="bo">${'▮'.repeat(p.boost)}<i>${'▮'.repeat(BOOST_N-p.boost)}</i></span>`:''}<b>${p.score}</b></div>`).join('');
}
function say(t,col,ms){
  const m=$('msg');m.hidden=!t;if(!t)return;
  const s=$('msgT');s.textContent=t;s.style.setProperty('--c',col||'#00cfff');s.style.animation='none';void s.offsetWidth;s.style.animation='';
  if(ms){const k=flowTok;setTimeout(()=>{if(k===flowTok&&s.textContent===t)m.hidden=true;},ms);}
}
const solo=p=>p.ctl==='k0'&&!local('k1');            // eigener Sieg (nicht bei zwei Spielern an einem Gerät)
function startLocal(){
  if(NET.on)return;
  readOpts();pickGrid();
  P=[];
  const humans=O.mode==='2'?2:1;
  for(let i=0;i<humans+O.bots;i++){
    const bot=i>=humans;
    P.push({id:i,col:COLS[i],bot,ctl:bot?'bot':'k'+i,score:0,name:bot?'CPU '+(i-humans+1):humans===1?T('Du','You'):T('Spieler ','Player ')+(i+1)});
  }
  begin();
}
function begin(){          // Match starten (lokal oder als Host)
  $('menu').hidden=true;$('end').hidden=true;
  sub=TICK[O.speed]/2;P.forEach(p=>{p.score=0;});
  startRound();
}
function place(){
  const mx=W>>1,my=H>>1,gx=Math.round(W*.14),gy=Math.round(H*.14);
  const S=[[gx,my,0],[W-1-gx,my,2],[mx,gy,1],[mx,H-1-gy,3]];
  P.forEach((p,i)=>{const s=S[i];p.x=s[0];p.y=s[1];p.d=s[2];});
}
function resetRound(){     // alle: Feld leeren, Fahrer an ihre (schon gesetzten) Startpunkte
  grid.fill(0);parts=[];acc=0;simT=0;tickN=0;paused=false;syncPause();
  P.forEach(p=>{
    Object.assign(p,{alive:true,q:[],boost:O.boost?BOOST_N:0,bt:0,path:[[p.x,p.y]],t0:0,dur:1});
    grid[p.y*W+p.x]=p.id+1;
  });
  state='count';hud();layout();syncUi();
}
function startRound(){
  const k=++flowTok;
  place();resetRound();
  bc({t:'round',W,H,o:[O.boost,O.keep,O.goal],pl:P.map(p=>[p.id,p.name,p.bot?1:0,p.score,p.x,p.y,p.d])});
  const step=n=>{
    if(k!==flowTok)return;
    bc({t:'cnt',n});count(n);
    if(n>0)setTimeout(()=>step(n-1),650);
    else{state='play';lastSim=performance.now();}
  };
  step(3);
}
function count(n){
  if(n>0){say(String(n));beep(440,.12,'square',.05);}
  else{say('GO','#39ff14',500);beep(880,.25,'square',.06);}
}
function showRoundEnd(w){
  state='roundEnd';
  if(w){say(solo(w)?T('Runde gewonnen','Round won'):w.name+' '+T('gewinnt','wins'),w.col);beep(660,.3,'triangle',.07,990);}
  else say(T('Unentschieden','Draw'),'#dff6ff');
  hud();
}
function showMatchEnd(w){
  state='matchEnd';say('');
  $('endT').textContent=solo(w)?T('Sieg','Victory'):w.name+' '+T('gewinnt','wins');$('endT').style.color=w.col;$('endT').style.textShadow='0 0 12px '+w.col;
  $('again').hidden=NET.role==='client';
  $('toMenu').textContent=NET.role==='client'?T('Spiel verlassen','Leave game'):NET.role==='host'?T('Zur Lobby','Back to lobby'):T('Zur Auswahl','Back to menu');
  $('end').hidden=false;
}
function endRound(w){
  const k=++flowTok;
  if(w)w.score++;
  bc({t:'end',w:w?w.id:-1,sc:P.map(p=>p.score)});
  showRoundEnd(w);
  setTimeout(()=>{
    if(k!==flowTok)return;
    if(w&&w.score>=O.goal){bc({t:'match',w:w.id});showMatchEnd(w);}
    else startRound();
  },1700);
}
function toMenu(){flowTok++;state='menu';paused=false;P=[];NET.on=false;NET.role='local';NET.you=-1;syncPause();syncUi();say('');hud();rebuild();$('end').hidden=true;$('menu').hidden=false;}
function quit(){           // Knopf "Zur Auswahl": online zurück in die Lobby (Host) bzw. Raum verlassen (Mitspieler)
  if(NET.role==='host'){flowTok++;state='lobby';say('');$('end').hidden=true;L.backToLobby();}
  else{if(NET.role==='client'&&L)L.leave();toMenu();}
}
function syncPause(){$('pauseBtn').textContent=paused?T('Weiter','Resume'):T('Pause','Pause');}
function syncUi(){
  $('pauseBtn').hidden=NET.on;
  $('quitBtn').textContent=NET.role==='client'?T('Spiel verlassen','Leave game'):NET.role==='host'?T('Zur Lobby','Back to lobby'):T('Zur Auswahl','Back to menu');
  $('viewBtn').textContent=v3?T('2D-Ansicht','2D view'):T('3D-Ansicht','3D view');
  $('camBtn').hidden=!v3;$('camBtn').textContent=T('Kamera: ','Camera: ')+(camMode==='chase'?T('Verfolger','Chase'):T('Übersicht','Overview'));
}
function togglePause(){
  if(state!=='play'||NET.on)return;
  paused=!paused;syncPause();say(paused?T('Pause','Paused'):'');
}

// ---------- Schritt ----------
function kill(p){
  p.alive=false;p.bt=0;p.q=[];
  if(!O.keep)for(let i=0;i<grid.length;i++)if(grid[i]===p.id+1)grid[i]=0;
  for(let i=0;i<46;i++){const a=Math.random()*6.283,v=(2+Math.random()*9)*cs;parts.push({x:cx(p.x),y:cx(p.y),vx:Math.cos(a)*v,vy:Math.sin(a)*v,l:1,col:Math.random()<.3?'#fff':p.col});}
  if(G3&&v3)burst3(p);
  shake=1;beep(180,.45,'sawtooth',.09,40);
}
function advance(p,x,y){   // ein Feld weiter: vorige Teilstrecke fest einzeichnen, Feld belegen
  const n=p.path.length;if(n>=2)poly(tctx,p,[p.path[n-2],p.path[n-1]],2);
  p.x=x;p.y=y;grid[y*W+x]=p.id+1;p.path.push([x,y]);
}
function subtick(){
  tickN++;
  const mv=P.filter(p=>p.alive&&(p.bt>0||tickN%2===0));
  for(const p of mv){
    if(p.bot)think(p);
    if(p.q.length)p.d=p.q.shift();
    p.nx=p.x+DX[p.d];p.ny=p.y+DY[p.d];
  }
  // Alle Züge gelten gleichzeitig: Wand, Spur oder dasselbe Zielfeld wie ein anderer Fahrer = Crash
  const dead=mv.filter(p=>!free(p.nx,p.ny)||mv.some(o=>o!==p&&o.nx===p.nx&&o.ny===p.ny));
  const out=[];
  for(const p of mv){
    if(dead.includes(p))continue;
    advance(p,p.nx,p.ny);
    if(p.bt>0){p.bt--;if(!p.bt&&!p.bot)hud();}
    p.t0=simT;p.dur=p.bt>0?sub:(tickN%2===0?2*sub:sub);
    out.push([p.id,p.x,p.y,p.bt,Math.round(p.dur/mul)]);
  }
  if(out.length||dead.length)bc({t:'s',m:out,k:dead.map(p=>p.id)});
  if(dead.length){
    dead.forEach(kill);rebuild();hud();
    const al=P.filter(p=>p.alive);
    if(al.length<=1)endRound(al[0]||null);
  }
}
function useBoost(p){
  if(!p||!p.alive||p.boost<=0||p.bt>0||state!=='play'||paused)return;
  if(NET.role==='client'){L.send({t:'b'});return;}
  p.boost--;p.bt=BOOST_T;bc({t:'bst',id:p.id,n:p.boost});
  if(!p.bot)hud();

// ---------- Computer ----------
// Zählt die Felder, die der Fahrer von (sx,sy) aus zuerst erreicht; mit Gegnern (opp) werden deren Felder abgezogen
function area(p,sx,sy,opp){
  vis.fill(0);
  let h=0,t=0,mine=0,theirs=0,risk=0;
  if(opp)for(const o of P){
    if(o===p||!o.alive)continue;
    for(let d=0;d<4;d++){
      const x=o.x+DX[d],y=o.y+DY[d];
      if(!free(x,y))continue;
      if(x===sx&&y===sy){risk=1;continue;}        // der Gegner könnte dasselbe Feld nehmen
      const i=y*W+x;if(!vis[i]){vis[i]=2;que[t++]=i;}
    }
  }
  const s=sy*W+sx;vis[s]=1;que[t++]=s;
  while(h<t){
    const i=que[h++],o=vis[i],x=i%W,y=(i-x)/W;
    if(o===1)mine++;else theirs++;
    if(x>0&&!grid[i-1]&&!vis[i-1]){vis[i-1]=o;que[t++]=i-1;}
    if(x<W-1&&!grid[i+1]&&!vis[i+1]){vis[i+1]=o;que[t++]=i+1;}
    if(y>0&&!grid[i-W]&&!vis[i-W]){vis[i-W]=o;que[t++]=i-W;}
    if(y<H-1&&!grid[i+W]&&!vis[i+W]){vis[i+W]=o;que[t++]=i+W;}
  }
  return mine-theirs*.6-risk*25;
}
function best(p,opts,opp){
  let bd=opts[0],bs=-1e9;
  for(const d of opts){
    const sc=area(p,p.x+DX[d],p.y+DY[d],opp)+(d===p.d?.5:0);
    if(sc>bs){bs=sc;bd=d;}
  }
  return bd;
}
function think(p){
  const opts=[p.d,(p.d+3)%4,(p.d+1)%4].filter(d=>free(p.x+DX[d],p.y+DY[d]));
  if(!opts.length)return;
  let nd;
  if(O.lvl===0){        // leicht: fährt meist geradeaus, reagiert spät und macht Fehler
    if(opts.includes(p.d)&&Math.random()>.03){
      nd=p.d;
      if(!free(p.x+2*DX[p.d],p.y+2*DY[p.d])&&opts.length>1&&Math.random()<.7)nd=best(p,opts.filter(d=>d!==p.d),false);
    }else nd=Math.random()<.2?opts[Math.floor(Math.random()*opts.length)]:best(p,opts,false);
  }else nd=best(p,opts,O.lvl===2);     // mittel: größter freier Raum; schwer: Raum im Vergleich zu den Gegnern
  p.q=nd!==p.d?[nd]:[];
  if(O.lvl>0&&p.boost>0&&!p.bt&&nd===p.d&&Math.random()<.012){
    let ok=true;for(let k=1;k<=10&&ok;k++)ok=free(p.x+k*DX[p.d],p.y+k*DY[p.d]);
    if(ok)useBoost(p);
  }
}

function steer(p,nd,quiet){          // absolute Richtung

  if(NET.role==='client'&&p.q.length&&performance.now()-p.qt>500)p.q=[];      // Merkliste nie hängen lassen
  const b=p.q.length?p.q[p.q.length-1]:p.d;
  if(nd===b||nd===(b+2)%4||p.q.length>=2)return;
  p.q.push(nd);p.qt=performance.now();

  if(!quiet)beep(1200,.03,'square',.02);
}
function turn(p,s){            // relativ: -1 links, +1 rechts

function head(p){          // aktuelle Position zwischen zwei Feldern (für weiche Bewegung)
  const n=p.path.length,a=p.path[n-2]||p.path[n-1],b=p.path[n-1];
  const f=state==='play'||state==='roundEnd'?Math.max(0,Math.min(1,(clk()-p.t0)/p.dur)):1;
  return [a[0]+(b[0]-a[0])*f,a[1]+(b[1]-a[1])*f];
}
function draw(dt){
  ctx.setTransform(1,0,0,1,0,0);
  if(shake>0){shake=Math.max(0,shake-dt/350);ctx.translate((Math.random()-.5)*shake*cs*1.2,(Math.random()-.5)*shake*cs*1.2);}
  ctx.drawImage(bgC,0,0);ctx.drawImage(trC,0,0);
  for(const p of P){
    if(!p.alive)continue;
    const n=p.path.length,a=p.path[n-2]||p.path[n-1],h=head(p),hx=h[0],hy=h[1];
    poly(ctx,p,[a,h],2);
    // Fahrzeug: heller Kopf, im Turbo größer
    const r=cs*(p.bt>0?.62:.46);
    ctx.shadowColor=p.col;ctx.shadowBlur=cs*(p.bt>0?2.4:1.4);ctx.fillStyle='#fff';
    ctx.beginPath();ctx.arc(cx(hx),cx(hy),r,0,6.283);ctx.fill();ctx.shadowBlur=0;
    if(state==='count'){      // Startmarkierung mit Fahrtrichtung; der eigene Fahrer bekommt einen zweiten Ring
      ctx.strokeStyle=p.col;ctx.lineWidth=Math.max(1,cs*.16);ctx.beginPath();ctx.arc(cx(hx),cx(hy),cs*1.6,0,6.283);ctx.stroke();
      if(NET.on&&p.ctl==='k0'){ctx.beginPath();ctx.arc(cx(hx),cx(hy),cs*2.6,0,6.283);ctx.stroke();}
      ctx.beginPath();ctx.moveTo(cx(hx)+DX[p.d]*cs*2.2,cx(hy)+DY[p.d]*cs*2.2);ctx.lineTo(cx(hx)+DX[p.d]*cs*3.6,cx(hy)+DY[p.d]*cs*3.6);ctx.stroke();
    }
  }
  if(parts.length){
    ctx.globalCompositeOperation='lighter';
    for(let i=parts.length-1;i>=0;i--){
      const q=parts[i];q.l-=dt/700;if(q.l<=0){parts.splice(i,1);continue;}
      q.x+=q.vx*dt/1000;q.y+=q.vy*dt/1000;q.vx*=.96;q.vy*=.96;
      ctx.globalAlpha=q.l;ctx.fillStyle=q.col;ctx.fillRect(q.x-cs*.18,q.y-cs*.18,cs*.36,cs*.36);
    }
    ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';
  }
}
function sim(t){           // Spielschritte nachholen (lokal und als Host)
  const dt=Math.min(100,t-lastSim);lastSim=t;
  if(state!=='play'||paused||NET.role==='client')return;
  mul=P.some(p=>p.alive&&!p.bot)?1:3;                // ohne lebenden Menschen läuft der Rest der Runde im Schnelldurchlauf
  acc+=dt*mul;
  while(acc>=sub&&state==='play'){acc-=sub;simT+=sub;subtick();}
}
function frame(t){
  requestAnimationFrame(frame);
  const dt=Math.min(100,t-last);last=t;
  if(state==='lobby'&&L&&L.role==='local')toMenu();       // Lobby geschlossen: zurück zur Auswahl
  sim(performance.now());
  if(v3&&G3){parts.length=0;draw3(dt);}else draw(dt);
}
pickGrid();layout();hud();syncUi();
requestAnimationFrame(t=>{last=t;frame(t);});
let wantView='3d';try{wantView=localStorage.getItem('tron-view')||'3d';}catch(e){}
if(wantView==='3d')setView(true);
</script>
