<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vier gewinnt</title>
<link rel="stylesheet" href="../common.css">
<script src="../theme.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.2/peerjs.min.js"></script>
<script>window.Peer||document.write('<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"><\/script>')</script>
<script src="../net-config.js"></script>
<script src="../net.js"></script>
<script src="../mplobby.js"></script>
<style>
:root{--red:#ef4444;--yel:#facc15}
.wrap{max-width:620px}
#board{
  --cell:min(11.5vw,68px);
  display:grid;grid-template-columns:repeat(7,var(--cell));gap:calc(var(--cell)*.1);padding:calc(var(--cell)*.12);
  background:#2447c9;border-radius:18px;width:max-content;margin:12px auto;box-shadow:0 10px 30px rgba(0,0,0,.4);
  position:relative;
}
.col{display:contents}
.slot{
  width:var(--cell);height:var(--cell);border-radius:50%;background:var(--bg);position:relative;
  box-shadow:inset 0 3px 7px rgba(0,0,0,.55);cursor:pointer;
}
.disc{position:absolute;inset:6%;border-radius:50%;box-shadow:inset 0 -4px 8px rgba(0,0,0,.3),inset 0 3px 6px rgba(255,255,255,.35)}
.disc.p1{background:var(--red)}
.disc.p2{background:var(--yel)}
.disc.drop{animation:drop .42s cubic-bezier(.4,0,.8,.5)}
@keyframes drop{from{transform:translateY(calc(var(--fall)*-110%))}to{transform:translateY(0)}}
.slot.win .disc{animation:glow .6s infinite alternate;outline:3px solid #fff;outline-offset:-3px}
@keyframes glow{from{filter:brightness(1)}to{filter:brightness(1.5)}}
.slot.hover::after{content:"";position:absolute;inset:0;background:rgba(255,255,255,.12)}
.bar{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;align-items:center}
.score{display:flex;justify-content:center;gap:24px;margin:6px 0;color:var(--muted)}
.score b{color:var(--text)}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><a class="back" href="../">← Spiele</a><h1>Vier gewinnt</h1></div>

  <div class="panel">
    <div class="row">
      <label>Modus</label>
      <select id="mode"><option value="cpu">Gegen Computer</option><option value="two">2 Spieler</option></select>
      <select id="level"><option value="2">Leicht</option><option value="4" selected>Mittel</option><option value="6">Schwer</option></select>
      <button class="btn" id="new">Neues Spiel</button>
      <button class="btn alt" id="onlineBtn">Online</button>
      <button class="btn alt" id="onlineEnd" hidden>Online beenden</button>
    </div>
    <div class="status" id="msg" style="text-align:center"></div>
    <div class="score" id="score"></div>
  </div>

  <div id="board"></div>
</div>

<script>
const ROWS=6,COLS=7;
const $=id=>document.getElementById(id);
let board,turn,over,busy,wins={1:0,2:0},starter=1,token=0,lastMove=null,lastWin=null;
const net={on:false,role:'local',you:-1,names:{1:'Rot',2:'Gelb'}};
const names=()=>net.on?net.names:($('mode').value==='cpu'?{1:'Du',2:'Computer'}:{1:'Rot',2:'Gelb'});
const dot=p=>`<span class="chip" style="background:var(${p===1?'--red':'--yel'})"></span>`;

function buildBoard(){
  const b=$('board');b.innerHTML='';
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
    const s=document.createElement('div');
    s.className='slot';s.id=`s${r}-${c}`;s.dataset.c=c;
    s.onclick=()=>clickCol(c);
    s.onmouseenter=()=>hoverCol(c,true);
    s.onmouseleave=()=>hoverCol(c,false);
    b.appendChild(s);
  }
}
function hoverCol(c,on){
  for(let r=0;r<ROWS;r++)$(`s${r}-${c}`).classList.toggle('hover',on&&!over&&!busy);
}
function newGame(){
  token++;
  board=Array.from({length:ROWS},()=>Array(COLS).fill(0));
  over=false;busy=false;lastMove=null;lastWin=null;
  turn=starter;starter=3-starter;
  buildBoard();updateStatus();showScore();
  if(isCpu(turn))cpuMove();
}
const isCpu=p=>!net.on&&$('mode').value==='cpu'&&p===2;
function updateStatus(extra){
  const n=names();
  $('msg').innerHTML=extra||`${dot(turn)}<b>${n[turn]}</b> ${turn===1&&$('mode').value==='cpu'?'bist':'ist'} dran`;
}
function showScore(){
  const n=names();
  $('score').innerHTML=`<span>${dot(1)}${n[1]}: <b>${wins[1]}</b></span><span>${dot(2)}${n[2]}: <b>${wins[2]}</b></span>`;
}
function dropRow(b,c){for(let r=ROWS-1;r>=0;r--)if(!b[r][c])return r;return -1;}
function findWin(b,p){
  const dirs=[[0,1],[1,0],[1,1],[1,-1]];
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
    if(b[r][c]!==p)continue;
    for(const [dr,dc] of dirs){
      const cells=[[r,c]];
      for(let k=1;k<4;k++){
        const rr=r+dr*k,cc=c+dc*k;
        if(rr<0||rr>=ROWS||cc<0||cc>=COLS||b[rr][cc]!==p)break;
        cells.push([rr,cc]);
      }
      if(cells.length===4)return cells;
    }
  }
  return null;
}
function place(c){
  const r=dropRow(board,c);
  board[r][c]=turn;
  const slot=$(`s${r}-${c}`);
  const d=document.createElement('div');
  d.className=`disc p${turn} drop`;
  d.style.setProperty('--fall',r+1.2);
  slot.appendChild(d);
  lastMove={r,c};
  const w=findWin(board,turn);
  lastWin=w;
  if(w){
    over=true;wins[turn]++;
    setTimeout(()=>{w.forEach(([rr,cc])=>$(`s${rr}-${cc}`).classList.add('win'));},380);
    const n=names();
    updateStatus(`${dot(turn)}<b>${n[turn]}</b> ${turn===1&&$('mode').value==='cpu'?'hast':'hat'} gewonnen! 🎉`);
    showScore();return;
  }
  if(board[0].every(x=>x)){over=true;updateStatus('Unentschieden!');return;}
  turn=3-turn;updateStatus();
}
function clickCol(c){
  if(over||busy||isCpu(turn)||dropRow(board,c)<0)return;
  if(net.on){
    if(turn!==net.you+1)return;                       // nur am eigenen Zug
    if(net.role==='client'){L.send({t:'move',c});return;}
    place(c);bcast();return;
  }
  place(c);
  if(!over&&isCpu(turn))cpuMove();
}
function cpuMove(){
  busy=true;const t=token;
  updateStatus(`${dot(2)}<b>Computer</b> denkt nach …`);
  setTimeout(()=>{
    if(t!==token)return;
    const c=bestMove(board,+$('level').value);
    busy=false;
    place(c);
  },500);
}

// ---------- KI: Negamax mit Alpha-Beta ----------
const ORDER=[3,2,4,1,5,0,6];
function scoreWindow(w,p){
  let me=0,op=0,em=0;
  for(const x of w){if(x===p)me++;else if(x===0)em++;else op++;}
  if(me&&op)return 0;
  if(me===4)return 1000;
  if(me===3)return 12;
  if(me===2)return 3;
  if(op===3)return -14;
  if(op===2)return -3;
  return 0;
}
function evaluate(b,p){
  let s=0;
  for(let r=0;r<ROWS;r++)if(b[r][3]===p)s+=3;else if(b[r][3])s-=3;
  const dirs=[[0,1],[1,0],[1,1],[1,-1]];
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++)for(const [dr,dc] of dirs){
    const er=r+dr*3,ec=c+dc*3;
    if(er<0||er>=ROWS||ec<0||ec>=COLS)continue;
    const w=[b[r][c],b[r+dr][c+dc],b[r+dr*2][c+dc*2],b[er][ec]];
    s+=scoreWindow(w,p);
  }
  return s;
}
function negamax(b,depth,alpha,beta,p){
  const moves=ORDER.filter(c=>!b[0][c]);
  if(!moves.length)return 0;
  if(depth===0)return evaluate(b,p);
  let best=-Infinity;
  for(const c of moves){
    const r=dropRow(b,c);
    b[r][c]=p;
    let v;
    if(findWin(b,p))v=100000+depth;
    else v=-negamax(b,depth-1,-beta,-alpha,3-p);
    b[r][c]=0;
    if(v>best)best=v;
    if(best>alpha)alpha=best;
    if(alpha>=beta)break;
  }
  return best;
}
function bestMove(b,depth){
  const moves=ORDER.filter(c=>!b[0][c]);
  let best=moves[0],bv=-Infinity;
  const noise=depth<=2?6:0;
  for(const c of moves){
    const r=dropRow(b,c);
    b[r][c]=2;
    let v;
    if(findWin(b,2))v=100000+depth;
    else v=-negamax(b,depth-1,-Infinity,Infinity,1);
    b[r][c]=0;
    v+=Math.random()*noise;
    if(v>bv){bv=v;best=c;}
  }
  return best;
}

$('new').onclick=()=>{
  if(net.on){if(net.role==='client'){L.send({t:'again'});}else{newGame();bcast();}return;}
  wins={1:0,2:0};starter=1;newGame();
};

// ---------- Online ----------
let L=null;
function bcast(){
  if(!(net.on&&net.role==='host'))return;
  L.broadcast({t:'state',board,turn,over,wins,last:lastMove,win:lastWin,draw:over&&!lastWin});
}
function applyState(s){
  board=s.board;turn=s.turn;over=s.over;wins=s.wins;busy=false;
  buildBoard();
  board.forEach((row,r)=>row.forEach((v,c)=>{
    if(!v)return;
    const d=document.createElement('div');d.className=`disc p${v}`;
    if(s.last&&s.last.r===r&&s.last.c===c){d.classList.add('drop');d.style.setProperty('--fall',r+1.2);}
    $(`s${r}-${c}`).appendChild(d);
  }));
  const n=names();
  if(s.win){
    const w=board[s.win[0][0]][s.win[0][1]];
    setTimeout(()=>s.win.forEach(([rr,cc])=>$(`s${rr}-${cc}`).classList.add('win')),380);
    updateStatus(`${dot(w)}<b>${n[w]}</b> ${w===net.you+1?'hast':'hat'} gewonnen! 🎉`);
  }else if(s.draw)updateStatus('Unentschieden!');
  else updateStatus();
  showScore();
}
function updateStatus(extra){
  const n=names();
  const who=net.on?(turn===net.you+1?'bist':'ist'):(turn===1&&$('mode').value==='cpu'?'bist':'ist');
  const nm=net.on&&turn===net.you+1?'Du':n[turn];
  $('msg').innerHTML=extra||`${dot(turn)}<b>${nm}</b> ${who} dran`;
}
function setOnlineUi(on){
  $('mode').hidden=on;$('level').hidden=on||$('mode').value!=='cpu';$('onlineBtn').hidden=on;$('onlineEnd').hidden=!on;
  $('new').textContent=on&&net.role==='client'?'Revanche anfragen':'Neues Spiel';
}
function leaveOnline(){
  if(L)L.leave();
  net.on=false;net.role='local';net.you=-1;setOnlineUi(false);wins={1:0,2:0};starter=1;newGame();
}
L=MP.init({
  prefix:'c4-v1-',title:'Vier gewinnt',
  seats:[{name:'Rot',color:'#ef4444'},{name:'Gelb',color:'#facc15'}],minPlayers:2,bots:false,
  onStart(info){
    net.on=true;net.role=info.role;net.you=info.you;
    net.names={1:info.seats[0].name||'Rot',2:info.seats[1].name||'Gelb'};
    setOnlineUi(true);wins={1:0,2:0};starter=1;token++;
    if(info.role==='host'){newGame();bcast();}
    else{board=Array.from({length:ROWS},()=>Array(COLS).fill(0));over=false;turn=1;buildBoard();showScore();$('msg').textContent='Warte auf den Host …';}
  },
  onData(from,m){
    if(!m)return;
    if(net.role==='host'){
      if(m.t==='move'&&!over&&turn===from+1&&Number.isInteger(m.c)&&m.c>=0&&m.c<COLS&&dropRow(board,m.c)>=0){place(m.c);bcast();}
      else if(m.t==='again'&&over){newGame();bcast();}
    }else if(m.t==='state')applyState(m);
  },
  onSeatDrop(i){over=true;L.backToLobby();},
  onBackToLobby(){board=Array.from({length:ROWS},()=>Array(COLS).fill(0));buildBoard();$('msg').textContent='Warte in der Lobby …';},
  onLeave(why){net.on=false;net.role='local';setOnlineUi(false);wins={1:0,2:0};starter=1;newGame();}
});
$('onlineBtn').onclick=()=>L.open();
$('onlineEnd').onclick=leaveOnline;
$('mode').onchange=()=>{wins={1:0,2:0};starter=1;$('level').hidden=$('mode').value!=='cpu';newGame();};
newGame();
</script>
</body>
</html>
