<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Blockheads</title>
<link rel="stylesheet" href="../common.css">
<script src="../theme.js"></script>
<style>
html,body{overscroll-behavior:none}
body{user-select:none;-webkit-user-select:none}
.wrap{max-width:1200px;padding:10px 12px 14px}
#stage{position:relative;line-height:0;border:2px solid var(--border);box-shadow:0 8px 30px rgba(0,0,0,.4);background:#000;overflow:hidden}
#cv{display:block;width:100%;height:calc(100vh - 190px);min-height:340px;touch-action:none;cursor:crosshair}
.hud{position:absolute;left:0;right:0;pointer-events:none;line-height:1.2}
.hud.top{top:0;display:flex;justify-content:space-between;align-items:flex-start;padding:8px 10px;gap:8px}
.hud.bot{bottom:0;display:flex;justify-content:center;padding:8px}
.pill{background:rgba(8,10,20,.72);border:1px solid var(--border);color:#fff;padding:5px 9px;font-size:.85rem;border-radius:var(--radius,8px)}
#hearts{letter-spacing:2px;font-size:1.1rem;color:#ff4d6d}
#hearts i{font-style:normal;color:#40202a}
#hearts i.on{color:#ff4d6d}
#hotbar{display:flex;gap:4px;flex-wrap:wrap;justify-content:center;max-width:100%;pointer-events:auto}
.slot{position:relative;width:44px;height:44px;background:rgba(8,10,20,.72);border:2px solid var(--border);cursor:pointer;padding:0;border-radius:6px}
.slot.sel{border-color:var(--accent,#ffd86b);box-shadow:0 0 8px var(--accent,#ffd86b)}
.slot canvas{width:100%;height:100%;image-rendering:pixelated;display:block}
.slot b{position:absolute;right:2px;bottom:0;font-size:.72rem;color:#fff;text-shadow:0 0 3px #000,0 0 3px #000}
.slot u{position:absolute;left:3px;top:0;font-size:.6rem;color:#aaa;text-decoration:none}
.btns{display:flex;gap:6px;pointer-events:auto;flex-wrap:wrap;justify-content:flex-end}
.btns .btn{padding:5px 10px;font-size:.8rem}
#craft{position:absolute;right:10px;top:52px;width:min(330px,calc(100% - 20px));max-height:calc(100% - 150px);overflow:auto;background:rgba(8,10,20,.92);border:2px solid var(--border);padding:10px;display:none;line-height:1.3;color:#fff;z-index:3}
#craft h3{margin:0 0 8px;font-size:.9rem;text-transform:uppercase;letter-spacing:.1em}
.rec{display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid rgba(255,255,255,.1)}
.rec canvas{width:32px;height:32px;image-rendering:pixelated;flex:none}
.rec .t{flex:1;font-size:.8rem}
.rec .t small{display:block;color:#aab;font-size:.7rem}
.rec .btn{padding:4px 9px;font-size:.78rem}
.rec.no{opacity:.45}
#toast{position:absolute;left:0;right:0;top:20%;text-align:center;color:#fff;font-weight:800;font-size:1.2rem;text-shadow:0 0 10px #000,0 0 4px #000;pointer-events:none;opacity:0;transition:opacity .4s;line-height:1.3;padding:0 12px}
#toast.show{opacity:1}
.touch{display:none;gap:8px;margin-top:10px;justify-content:center}
.touch button{font-size:1.4rem;padding:14px 0;width:70px;touch-action:none}
.keys{color:var(--muted);font-size:.8rem;line-height:1.6;margin:10px 0 0}
.keys b{color:var(--text)}
@media (pointer:coarse){.touch{display:flex}.keys{display:none}}
@media (max-width:700px){.touch{display:flex}#cv{height:calc(100vh - 290px)}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><a class="back" href="../">← Spiele</a><h1>Blockheads</h1></div>
  <div id="stage">
    <canvas id="cv"></canvas>
    <div class="hud top">
      <div style="display:flex;flex-direction:column;gap:6px;align-items:flex-start">
        <div class="pill" id="hearts"></div>
        <div class="pill" id="clock"></div>
      </div>
      <div class="btns">
        <button class="btn alt" id="bCraft">Handwerk (E)</button>
        <button class="btn alt" id="bZoom">Zoom</button>
        <button class="btn alt" id="bNew">Neue Welt</button>
      </div>
    </div>
    <div id="craft"><h3>Handwerk</h3><div id="recipes"></div></div>
    <div id="toast"></div>
    <div class="hud bot"><div id="hotbar"></div></div>
  </div>
  <div class="touch" id="touch">
    <button class="btn alt" id="tL">◀</button>
    <button class="btn alt" id="tR">▶</button>
    <button class="btn" id="tJ">⤒</button>
    <button class="btn alt" id="tM" style="width:auto;padding:14px 16px">⛏ Abbauen</button>
  </div>
  <p class="keys"><b>A/D</b> oder <b>←/→</b> laufen · <b>W/Leertaste</b> springen · <b>Linksklick</b> abbauen / kämpfen · <b>Rechtsklick</b> Block setzen · <b>1–9 / Mausrad</b> Block wählen · <b>E</b> Handwerk · <b>+/−</b> Zoom. Nachts kommen Nachtbären – bau dir ein Haus und stell Fackeln auf. Die Welt wird automatisch gespeichert.</p>
</div>
<script>
(function () {
  'use strict';
  var W = 320, H = 110, SEA = 44, REACH = 5.5, DAY = 300;
  var AIR = 0, GRASS = 1, DIRT = 2, STONE = 3, SAND = 4, WOOD = 5, LEAVES = 6, PLANKS = 7, COAL_ORE = 8, IRON_ORE = 9, GOLD_ORE = 10, WATER = 11, TORCH = 12, BEDROCK = 13, BRICK = 14, GLASS = 15, GOLDBLK = 16;
  var COAL = 30, IRON = 31, GOLD = 32;
  var NAMES = { 1: 'Gras', 2: 'Erde', 3: 'Stein', 4: 'Sand', 5: 'Holz', 6: 'Laub', 7: 'Bretter', 8: 'Kohleerz', 9: 'Eisenerz', 10: 'Golderz', 12: 'Fackel', 14: 'Ziegel', 15: 'Glas', 16: 'Goldblock', 20: 'Holz-Spitzhacke', 21: 'Stein-Spitzhacke', 22: 'Eisen-Spitzhacke', 23: 'Holzschwert', 24: 'Steinschwert', 25: 'Eisenschwert', 30: 'Kohle', 31: 'Eisen', 32: 'Gold' };
  var SOLID = {}, OPAQUE = {}, PLACEABLE = {};

  [1, 2, 3, 4, 5, 7, 8, 9, 10, 13, 14, 16].forEach(function (i) { OPAQUE[i] = 1; });
  [2, 3, 4, 5, 6, 7, 12, 14, 15, 16].forEach(function (i) { PLACEABLE[i] = 1; });
  var HARD = { 1: .4, 2: .4, 3: 1.4, 4: .3, 5: .9, 6: .15, 7: .8, 8: 1.6, 9: 2.2, 10: 2.6, 12: .05, 14: 2, 15: .3, 16: 3 };
  var NEED = { 3: 1, 8: 1, 9: 2, 10: 3, 14: 1, 16: 1 };
  var DROP = { 1: 2, 6: 0, 8: COAL, 9: IRON, 10: GOLD };
  var RECIPES = [
    { out: PLANKS, n: 4, need: [[WOOD, 1]] },
    { out: TORCH, n: 4, need: [[COAL, 1], [PLANKS, 1]] },
    { out: 20, n: 1, need: [[PLANKS, 3]] },
    { out: 21, n: 1, need: [[STONE, 3], [PLANKS, 2]] },
    { out: 22, n: 1, need: [[IRON, 3], [PLANKS, 2]] },

    { out: GLASS, n: 2, need: [[SAND, 2]] },
    { out: GOLDBLK, n: 1, need: [[GOLD, 3]] }
  ];
  var TOOL_TIER = { 20: 1, 21: 2, 22: 3 }, SWORD = { 23: 2, 24: 3, 25: 5 };

  // ---------- Zufall / Rauschen ----------
  function mkRng(seed) { var s = seed >>> 0; return function () { s = (s + 0x6D2B79F5) >>> 0; var t = s; t = Math.imul(t ^ t >>> 15, t | 1); t ^= t + Math.imul(t ^ t >>> 7, t | 61); return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

  function vnoise(x, y, seed) {
    var xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi, u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
    var a = hash2(xi, yi, seed), b = hash2(xi + 1, yi, seed), c = hash2(xi, yi + 1, seed), d = hash2(xi + 1, yi + 1, seed);

  // ---------- Welt ----------
  var world, surf = new Int16Array(W), seed = 1, spawn = { x: W / 2, y: 20 };
  function get(x, y) { if (x < 0 || x >= W) return BEDROCK; if (y < 0) return AIR; if (y >= H) return BEDROCK; return world[y * W + x]; }

  function calcSurf(x) { var y = 0; while (y < H && !OPAQUE[world[y * W + x]]) y++; surf[x] = y; }
  function setBlock(x, y, id) { if (x < 0 || x >= W || y < 0 || y >= H) return; world[y * W + x] = id; calcSurf(x); dirty = true; }
  function gen(sd) {
    seed = sd; var w = new Uint8Array(W * H), rnd = mkRng(sd), hs = new Int16Array(W), x, y;
    for (x = 0; x < W; x++) {
      var h = Math.round(42 + (vnoise(x / 38, 0, sd) - .5) * 28 + (vnoise(x / 11, 5, sd) - .5) * 7);
      hs[x] = Math.max(22, Math.min(70, h));
    }
    for (x = 0; x < W; x++) for (y = 0; y < H; y++) {
      var id = AIR, h2 = hs[x];
      if (y >= h2) {

    }
    // Erze (Adern)

      if (w[y * W + x] !== STONE) continue;
      var dd = y - hs[x], r = rnd(), ore = 0;
      if (dd > 4 && r < .022) ore = COAL_ORE; else if (dd > 14 && r > .985) ore = IRON_ORE; else if (dd > 30 && r > .993) ore = GOLD_ORE;
      if (ore) { w[y * W + x] = ore; if (rnd() < .6 && w[y * W + x + 1] === STONE) w[y * W + x + 1] = ore; if (rnd() < .6 && w[(y + 1) * W + x] === STONE) w[(y + 1) * W + x] = ore; }
    }
    // Wasser & Strand
    for (x = 0; x < W; x++) {
      var t = hs[x];
      if (t > SEA) { for (y = SEA; y < t; y++) w[y * W + x] = WATER; for (y = t; y < t + 3; y++) if (w[y * W + x] !== AIR) w[y * W + x] = SAND; }

    }
    // Bäume
    var last = -9;
    for (x = 4; x < W - 4; x++) {
      if (x - last < 5 || rnd() > .14 || w[hs[x] * W + x] !== GRASS) continue;
      last = x; var th = 4 + Math.floor(rnd() * 3), top = hs[x] - th;
      for (y = hs[x] - 1; y >= top; y--) w[y * W + x] = WOOD;
      for (var dx = -2; dx <= 2; dx++) for (var dy = -2; dy <= 1; dy++) {
        if (Math.abs(dx) === 2 && Math.abs(dy) !== 0 && Math.abs(dy) !== 1) continue;
        var lx = x + dx, ly = top + dy; if (lx < 0 || lx >= W || ly < 0) continue;
        if (w[ly * W + lx] === AIR && !(dx === 0 && dy >= 0 && ly >= top)) w[ly * W + lx] = LEAVES;
      }
    }

    for (x = 0; x < W; x++) calcSurf(x);
    var sx = W >> 1; for (var k = 0; k < 80; k++) { var cx = sx + (k % 2 ? k : -k) / 2 | 0; if (cx > 6 && cx < W - 6 && hs[cx] <= SEA - 2) { sx = cx; break; } }

  }

  // ---------- Speichern ----------
  var dirty = false, KEY = 'blockheads-save-v1';
  function enc(w) { var out = [], i = 0; while (i < w.length) { var v = w[i], n = 1; while (i + n < w.length && w[i + n] === v && n < 255) n++; out.push(v, n); i += n; } var s = ''; for (var k = 0; k < out.length; k += 8192) s += String.fromCharCode.apply(null, out.slice(k, k + 8192)); return btoa(s); }

  function save() { try { localStorage.setItem(KEY, JSON.stringify({ v: 1, seed: seed, world: enc(world), inv: inv, px: P.x, py: P.y, hp: P.hp, t: tod, sel: sel, sx: spawn.x, sy: spawn.y })); dirty = false; } catch (e) { } }
  function load() {
    try { var s = JSON.parse(localStorage.getItem(KEY)); if (!s || s.v !== 1) return false; world = dec(s.world); seed = s.seed; for (var x = 0; x < W; x++) calcSurf(x); inv = s.inv || []; P.x = s.px; P.y = s.py; P.hp = s.hp || 10; tod = s.t || .35; sel = s.sel || 0; spawn = { x: s.sx, y: s.sy }; return true; } catch (e) { return false; }
  }

  // ---------- Inventar ----------
  var inv = [], sel = 0;
  function count(id) { for (var i = 0; i < inv.length; i++) if (inv[i][0] === id) return inv[i][1]; return 0; }
  function addItem(id, n) { if (!id) return; for (var i = 0; i < inv.length; i++) if (inv[i][0] === id) { inv[i][1] += n; invDirty = true; return; } inv.push([id, n]); invDirty = true; }

  var invDirty = true;
  function tier() { var t = 0; for (var k in TOOL_TIER) if (count(+k) && TOOL_TIER[k] > t) t = TOOL_TIER[k]; return t; }
  function dmg() { var d = 1; for (var k in SWORD) if (count(+k) && SWORD[k] > d) d = SWORD[k]; return d; }

  // ---------- Grafik (Atlas) ----------
  var atlas = document.createElement('canvas'); atlas.width = 16 * 40; atlas.height = 16;
  (function () {
    var g = atlas.getContext('2d');
    function c(v) { return Math.max(0, Math.min(255, v | 0)); }

    function dots(o, id, col) { for (var i = 0; i < 7; i++) { var x = (hash2(i, 1, id) * 13) | 0, y = (hash2(i, 2, id) * 13) | 0; px(o, x + 1, y + 1, col, 2, 2); } }
    for (var id = 1; id <= 16; id++) {

      if (id === 1) { sp(o, id, 134, 96, 67, 28); for (var x = 0; x < 16; x++) { var dh = 4 + (hash2(x, 9, 1) > .6 ? 2 : 0); for (var gy = 0; gy < dh; gy++) { var gn = (hash2(x, gy, 91) - .5) * 36; g.fillStyle = 'rgb(' + c(84 + gn) + ',' + c(170 + gn) + ',' + c(60 + gn) + ')'; g.fillRect(o + x, gy, 1, 1); } } }

      else if (id === 3) sp(o, id, 125, 125, 130, 34);

    function sword(o, head) { for (var i = 0; i < 8; i++) px(o, 6 + i, 8 - i, head, 2, 2); px(o, 3, 9, '#7a4a20', 6, 2); px(o, 3, 11, '#7a4a20', 2, 4); px(o, 2, 12, '#7a4a20', 2, 2); }

  function icon(id, size) {
    var c = document.createElement('canvas'); c.width = c.height = 16; var g = c.getContext('2d'); g.drawImage(atlas, id * 16, 0, 16, 16, 0, 0, 16, 16); return c;
  }

  // ---------- Spieler / Mobs ----------
  var P = { x: 160, y: 20, w: .7, h: 1.8, vx: 0, vy: 0, on: false, inW: false, hp: 10, face: 1, walk: 0, hurtT: 0, regenT: 0 };
  var mobs = [], tod = .35, msgT = 0, camX = 0, camY = 0, TSL = [24, 32, 40, 48], tsi = 1;
  var keys = {}, mouse = { x: 0, y: 0, down: false, btn: 0, touch: false }, touchMode = 'mine';
  function hit(x, y, w, h) {
    var x0 = Math.floor(x - w / 2), x1 = Math.floor(x + w / 2 - 1e-6), y0 = Math.floor(y), y1 = Math.floor(y + h - 1e-6);
    for (var tx = x0; tx <= x1; tx++) for (var ty = y0; ty <= y1; ty++) if (solid(tx, ty)) return true;
    return false;
  }
  function stepEnt(e, dt, hop) {
    e.inW = get(Math.floor(e.x), Math.floor(e.y + e.h * .5)) === WATER;
    e.vy += (e.inW ? 8 : 34) * dt;
    if (e.inW) { e.vy *= Math.pow(.04, dt); if (e.vy > 4) e.vy = 4; } else if (e.vy > 32) e.vy = 32;
    var nx = e.x + e.vx * dt;
    if (nx - e.w / 2 < 0) nx = e.w / 2; if (nx + e.w / 2 > W) nx = W - e.w / 2;
    if (!hit(nx, e.y, e.w, e.h)) e.x = nx; else { if (hop && e.on && !hit(nx, e.y - 1.1, e.w, e.h)) e.vy = -9.6; e.vx = 0; }
