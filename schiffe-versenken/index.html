<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Schiffe versenken</title>
<link rel="stylesheet" href="../common.css">
<script src="../theme.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.2/peerjs.min.js"></script>
<script>window.Peer||document.write('<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"><\/script>')</script>
<script src="../net-config.js"></script>
<script src="../net.js"></script>
<script src="../mplobby.js"></script>
<style>
.boards{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:720px){.boards{grid-template-columns:1fr}}
.boards h2{margin:0 0 8px;font-size:1rem;color:var(--muted);text-align:center}
.grid{
  --n:10;display:grid;grid-template-columns:repeat(10,1fr);gap:2px;background:#0b3a6b;padding:2px;border-radius:10px;
  aspect-ratio:1;max-width:420px;margin:0 auto;
}
.c{background:#2a79c4;border-radius:3px;position:relative;aspect-ratio:1;cursor:default}
.enemy .c.free{cursor:crosshair}
.enemy .c.free:hover{background:#4a95dd}
.c.ship{background:#7b8794}
.c.miss::after{content:"";position:absolute;inset:36%;border-radius:50%;background:rgba(255,255,255,.75)}
.c.hit{background:#e5484d}
.c.hit::after{content:"✕";position:absolute;inset:0;display:grid;place-items:center;color:#fff;font-weight:800;font-size:clamp(.7rem,2.6vw,1.2rem)}
.c.sunk{background:#7a1d22}
.c.last{outline:3px solid #facc15;outline-offset:-3px}
.fleet{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:8px;font-size:.85rem;color:var(--muted)}
.fleet span{padding:2px 8px;border:1px solid var(--border);border-radius:99px}
.fleet span.dead{text-decoration:line-through;opacity:.5}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><a class="back" href="../">← Spiele</a><h1>Schiffe versenken</h1></div>

  <div class="panel">
    <div class="status" id="msg" style="text-align:center"></div>
    <div class="row" style="justify-content:center">
      <button class="btn alt" id="shuffle">Flotte neu mischen</button>
      <button class="btn" id="go">Los geht's</button>
      <button class="btn alt" id="restart" hidden>Neues Spiel</button>
      <button class="btn alt" id="onlineBtn">Online</button>
      <button class="btn alt" id="onlineEnd" hidden>Online beenden</button>
    </div>
  </div>

  <div class="boards">
    <div><h2>Deine Flotte</h2><div class="grid" id="mine"></div><div class="fleet" id="fleetMine"></div></div>
    <div class="enemy"><h2>Gegner (hier schießen)</h2><div class="grid" id="theirs"></div><div class="fleet" id="fleetTheirs"></div></div>
  </div>
</div>
<div class="overlay" id="winBox" hidden>
  <div class="box"><h2 id="winTitle"></h2><p id="winSub"></p><button class="btn" id="winBtn">Neues Spiel</button></div>
</div>

<script>
const N=10,SIZES=[5,4,3,3,2],NAMES=['Schlachtschiff','Kreuzer','Zerstörer','U-Boot','Patrouillenboot'];
const $=id=>document.getElementById(id);
let mine,theirs,phase,token=0,lastMine=-1,lastTheirs=-1;

function emptyFleet(){return {ships:[],shots:Array(N*N).fill(0)};} // shots: 0 unbeschossen,1 Wasser,2 Treffer
function randomFleet(){
  const f=emptyFleet(),occ=new Set();
  SIZES.forEach((len,k)=>{
    for(;;){
      const horiz=Math.random()<.5;
      const r=Math.floor(Math.random()*(horiz?N:N-len+1));
      const c=Math.floor(Math.random()*(horiz?N-len+1:N));
      const cells=Array.from({length:len},(_,i)=>horiz?r*N+c+i:(r+i)*N+c);
      const near=cells.some(x=>{
        const xr=Math.floor(x/N),xc=x%N;
        for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++){
          const rr=xr+dr,cc=xc+dc;
          if(rr>=0&&rr<N&&cc>=0&&cc<N&&occ.has(rr*N+cc))return true;
        }
        return false;
      });
      if(near)continue;
      cells.forEach(x=>occ.add(x));
      f.ships.push({name:NAMES[k],cells});
      break;
    }
  });
  return f;
}
const shipAt=(f,i)=>f.ships.find(s=>s.cells.includes(i));
const isSunk=(f,s)=>s.cells.every(i=>f.shots[i]===2);
const allSunk=f=>f.ships.every(s=>isSunk(f,s));

function build(id,onclick){
  const g=$(id);g.innerHTML='';
  for(let i=0;i<N*N;i++){
    const d=document.createElement('div');d.className='c';d.id=id+i;
    if(onclick)d.onclick=()=>onclick(i);
    g.appendChild(d);
  }
}
function paint(){
  for(let i=0;i<N*N;i++){
    const m=$('mine'+i),t=$('theirs'+i);
    let cls='c';
    const s=shipAt(mine,i);
    if(s)cls+=' ship';
    if(mine.shots[i]===1)cls+=' miss';
    if(mine.shots[i]===2)cls+=' hit'+(isSunk(mine,s)?' sunk':'');
    if(i===lastMine)cls+=' last';
    m.className=cls;
    cls='c';
    const e=shipAt(theirs,i);
    if(theirs.shots[i]===0&&phase==='play')cls+=' free';
    if(theirs.shots[i]===1)cls+=' miss';
    if(theirs.shots[i]===2)cls+=' hit'+(e&&isSunk(theirs,e)?' sunk':'');
    if(phase==='over'&&e&&theirs.shots[i]!==2)cls+=' ship';
    if(i===lastTheirs)cls+=' last';
    t.className=cls;
  }
  const fl=(f,id)=>$(id).innerHTML=f.ships.map(s=>`<span class="${isSunk(f,s)?'dead':''}">${s.name} (${s.cells.length})</span>`).join('');
  fl(mine,'fleetMine');fl(theirs,'fleetTheirs');
}
function say(t){$('msg').innerHTML=t;}

// ---------- Spielablauf ----------
function setup(){
  token++;phase='setup';lastMine=lastTheirs=-1;
  mine=randomFleet();theirs=randomFleet();ai={hits:[],tried:new Set()};
  build('mine');build('theirs',shoot);
  $('go').hidden=false;$('shuffle').hidden=false;$('restart').hidden=true;$('winBox').hidden=true;
  say('Das ist deine Flotte. Mische sie neu oder starte das Spiel.');
  paint();
}
function startPlay(){
  phase='play';$('go').hidden=true;$('shuffle').hidden=true;$('restart').hidden=false;
  say('Du bist dran: Klicke auf ein Feld des Gegners.');paint();
}
function shoot(i){
  if(net.on){if(phase==='play'&&!theirs.shots[i])netShoot(i);return;}
  if(phase!=='play'||theirs.shots[i])return;
  lastTheirs=i;
  const s=shipAt(theirs,i);
  if(s){
    theirs.shots[i]=2;
    if(allSunk(theirs)){return end(true);}
    say(isSunk(theirs,s)?`<b>${s.name} versenkt!</b> Du darfst nochmal.`:'Treffer! Du darfst nochmal.');
    paint();
  }else{
    theirs.shots[i]=1;paint();
    phase='ai';say('Wasser. Der Gegner schießt …');
    const t=token;setTimeout(()=>{if(t===token)aiShot();},750);
  }
}

// ---------- KI ----------
let ai;
function neighbors(i){
  const r=Math.floor(i/N),c=i%N,o=[];
  if(r>0)o.push(i-N);if(r<N-1)o.push(i+N);if(c>0)o.push(i-1);if(c<N-1)o.push(i+1);
  return o;
}
function chooseShot(){
  const open=i=>mine.shots[i]===0;
  // offene Treffer = getroffene Felder von noch nicht versenkten Schiffen
  const hits=[];
  for(let i=0;i<N*N;i++)if(mine.shots[i]===2&&!isSunk(mine,shipAt(mine,i)))hits.push(i);
  if(hits.length){
    // Linie erkennen
    const cand=[];
    for(const h of hits){
      for(const n of neighbors(h)){
        if(!open(n))continue;
        const dir=n-h;
        const back=h-dir;
        const aligned=hits.includes(back)&&neighbors(h).includes(back);
        cand.push({n,w:aligned?5:1});
      }
    }
    const pool=[];
    cand.forEach(c=>{for(let k=0;k<c.w;k++)pool.push(c.n);});
    if(pool.length)return pool[Math.floor(Math.random()*pool.length)];
  }
  // Suche mit Schachbrettmuster
  const free=[];
  for(let i=0;i<N*N;i++)if(open(i))free.push(i);
  const par=free.filter(i=>((Math.floor(i/N)+i%N)%2)===0);
  const pool=par.length?par:free;
  return pool[Math.floor(Math.random()*pool.length)];
}
function aiShot(){
  if(phase!=='ai')return;
  const i=chooseShot();lastMine=i;
  const s=shipAt(mine,i);
  if(s){
    mine.shots[i]=2;
    if(allSunk(mine)){paint();return end(false);}
    say(isSunk(mine,s)?`Der Gegner hat dein <b>${s.name}</b> versenkt und schießt nochmal …`:'Der Gegner hat getroffen und schießt nochmal …');
    paint();
    const t=token;setTimeout(()=>{if(t===token)aiShot();},800);
  }else{
    mine.shots[i]=1;phase='play';paint();
    say('Der Gegner hat verfehlt. Du bist dran.');
  }
}
function end(win){
  phase='over';paint();
  $('winTitle').textContent=win?'Gewonnen! 🎉':'Verloren 😢';
  $('winSub').textContent=win?'Du hast alle gegnerischen Schiffe versenkt.':'Der Gegner hat deine Flotte versenkt.';
  $('winBox').hidden=false;
  say(win?'Alle Schiffe versenkt!':'Deine Flotte wurde versenkt.');
}

const net={on:false,role:'local',you:-1,names:['Flotte 1','Flotte 2'],fleets:null,ready:[false,false],started:false,turn:0,last:null,over:false,winner:-1};
let L=null;

// ---------- Online ----------
// Der Host kennt beide Flotten und schickt jedem nur die eigene Flotte samt den Schüssen auf die gegnerische.
function viewFor(seat){
  const my=net.fleets[seat],en=net.fleets[1-seat],over=net.over;
  return {you:seat,names:net.names,ready:net.ready,started:net.started,over,turn:net.turn,last:net.last,winner:net.winner,
    mine:{ships:my.ships,shots:my.shots},
    theirs:{shots:en.shots,ships:en.ships.map(sh=>{const open=isSunk(en,sh)||over;return {name:sh.name,len:sh.cells.length,cells:open?sh.cells:null};})}};
}
function viewText(v){
  if(v.over)return v.winner===v.you?'Alle Schiffe versenkt!':'Deine Flotte wurde versenkt.';
  if(!v.started)return v.ready[v.you]?'Bereit. Warte auf den Gegner …':'Das ist deine Flotte. Mische sie neu und drücke Bereit.';
  const opp=v.names[1-v.you],l=v.last;let pre='';
  if(l){
    if(l.by===v.you)pre=l.hit?(l.sunk?`<b>${l.sunk} versenkt!</b> `:'Treffer! '):'Wasser. ';
    else pre=l.hit?(l.sunk?`${opp} hat dein <b>${l.sunk}</b> versenkt. `:`${opp} hat getroffen. `):`${opp} hat verfehlt. `;
  }
  return pre+(v.turn===v.you?'Du bist dran: Klicke auf ein Feld des Gegners.':`${opp} ist dran …`);
}
function applyView(v){
  mine={ships:v.mine.ships,shots:v.mine.shots};
  theirs={shots:v.theirs.shots,ships:v.theirs.ships.map(sh=>({name:sh.name,cells:sh.cells||Array(sh.len).fill(-1)}))};
  phase=v.over?'over':(!v.started?'setup':(v.turn===v.you?'play':'wait'));
  if(v.last){if(v.last.by===v.you)lastTheirs=v.last.i;else lastMine=v.last.i;}
  const setupPh=phase==='setup';
  $('shuffle').hidden=!setupPh||v.ready[v.you];$('go').hidden=!setupPh||v.ready[v.you];$('go').textContent='Bereit';
  $('restart').hidden=!(net.role==='host'&&phase==='over');$('restart').textContent='Neue Runde';
  say(viewText(v));paint();
  if(v.over){
    $('winTitle').textContent=v.winner===v.you?'Gewonnen! 🎉':'Verloren 😢';
    $('winSub').textContent=v.winner===v.you?'Du hast alle gegnerischen Schiffe versenkt.':'Der Gegner hat deine Flotte versenkt.';
    $('winBtn').textContent=net.role==='host'?'Neue Runde':'Warten auf den Host';$('winBtn').disabled=net.role!=='host';
    $('winBox').hidden=false;
  }else $('winBox').hidden=true;
}
function bcastAll(){
  if(net.role!=='host')return;
  applyView(viewFor(net.you));
  for(let seat=0;seat<2;seat++)if(seat!==net.you)L.sendTo(seat,{t:'view',v:viewFor(seat)});
}
function hostNewRound(){
  net.fleets=[randomFleet(),randomFleet()];net.ready=[false,false];net.started=false;net.over=false;net.winner=-1;net.last=null;net.turn=0;
  lastMine=lastTheirs=-1;bcastAll();
}
function hostAct(seat,m){
  if(!m)return;
  if(m.t==='shuffle'&&!net.started&&!net.ready[seat]){net.fleets[seat]=randomFleet();bcastAll();}
  else if(m.t==='ready'&&!net.started&&!net.ready[seat]){net.ready[seat]=true;if(net.ready[0]&&net.ready[1]){net.started=true;net.turn=0;}bcastAll();}
  else if(m.t==='shot'&&net.started&&!net.over&&net.turn===seat&&Number.isInteger(m.i)&&m.i>=0&&m.i<N*N){
    const en=net.fleets[1-seat];if(en.shots[m.i])return;
    const sh=shipAt(en,m.i);
    if(sh){
      en.shots[m.i]=2;const sunk=isSunk(en,sh)?sh.name:null;
      net.last={by:seat,i:m.i,hit:true,sunk};
      if(allSunk(en)){net.over=true;net.winner=seat;}
    }else{en.shots[m.i]=1;net.last={by:seat,i:m.i,hit:false,sunk:null};net.turn=1-seat;}
    bcastAll();
  }else if(m.t==='again'&&net.over&&net.role==='host'&&seat===net.you)hostNewRound();
}
function netShoot(i){if(net.role==='host')hostAct(net.you,{t:'shot',i});else L.send({t:'shot',i});}
function netShuffle(){if(net.role==='host')hostAct(net.you,{t:'shuffle'});else L.send({t:'shuffle'});}
function netReady(){if(net.role==='host')hostAct(net.you,{t:'ready'});else L.send({t:'ready'});}
function setOnlineUi(on){$('onlineBtn').hidden=on;$('onlineEnd').hidden=!on;}
function leaveOnline(){if(L)L.leave();net.on=false;net.role='local';net.you=-1;setOnlineUi(false);$('winBtn').disabled=false;$('winBtn').textContent='Neues Spiel';setup();}
L=MP.init({
  prefix:'sv-v1-',title:'Schiffe versenken',
  seats:[{name:'Flotte 1',color:'#2a79c4'},{name:'Flotte 2',color:'#ff9a1f'}],minPlayers:2,bots:false,
  onStart(info){
    token++;net.on=true;net.role=info.role;net.you=info.you;
    net.names=[info.seats[0].name||'Flotte 1',info.seats[1].name||'Flotte 2'];
    mine={ships:[],shots:Array(N*N).fill(0)};theirs={ships:[],shots:Array(N*N).fill(0)};lastMine=lastTheirs=-1;
    build('mine');build('theirs',shoot);setOnlineUi(true);$('winBox').hidden=true;$('winBtn').disabled=false;
    if(info.role==='host')hostNewRound();else{phase='wait';say('Warte auf den Host …');paint();}
  },
  onData(from,m){
    if(!m)return;
    if(net.role==='host')hostAct(from,m);
    else if(m.t==='view')applyView(m.v);
  },
  onSeatDrop(i){net.over=true;$('winBox').hidden=true;L.backToLobby();},
  onBackToLobby(){$('winBox').hidden=true;say('Warte in der Lobby …');},
  onLeave(why){net.on=false;net.role='local';setOnlineUi(false);setup();}
});
$('onlineBtn').onclick=()=>L.open();
$('onlineEnd').onclick=leaveOnline;

$('shuffle').onclick=()=>{if(net.on){netShuffle();return;}mine=randomFleet();paint();};
$('go').onclick=()=>{if(net.on){netReady();return;}startPlay();};
$('restart').onclick=()=>{if(net.on){hostAct(net.you,{t:'again'});return;}setup();};
$('winBtn').onclick=()=>{if(net.on){hostAct(net.you,{t:'again'});return;}setup();};
setup();
</script>
</body>
</html>
